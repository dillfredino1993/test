                  uploaded_file = await fast_upload_file(
                      client=client,
                      file_path=file_path,
                      progress_callback=progress_callback
                  )
                  if uploaded_file is None:
                      print(f"❌ Upload returned None for {os.path.basename(file_path)}")
                      return False, None
                  print(f"✅ Upload complete for {os.path.basename(file_path)}!")
              except Exception as e:
                  print(f"❌ Upload failed: {e}")
                  return False, None

              video_attr = DocumentAttributeVideo(
                  duration=duration,
                  w=w if w > 0 else 1280,
                  h=h if h > 0 else 720,
                  supports_streaming=True
              )

              kwargs = {
                  "entity": entity,
                  "file": uploaded_file,
                  "caption": caption,
                  "attributes": [video_attr],
                  "supports_streaming": True,
                  "force_document": False,
                  "allow_cache": True
              }

              if reply_to:
                  kwargs["reply_to"] = int(reply_to)
                  print(f"🎯 Uploading into Topic ID: {reply_to}")

              if thumb and os.path.exists(thumb):
                  kwargs["thumb"] = thumb

              try:
                  result = await client.send_file(**kwargs)
                  return True, result
              except Exception as e:
                  print(f"❌ Send failed: {e}")
                  if "thumb" in kwargs:
                      del kwargs["thumb"]
                      try:
                          result = await client.send_file(**kwargs)
                          return True, result
                      except Exception as e2:
                          print(f"❌ Send failed without thumb: {e2}")
                          return False, None
                  return False, None
              finally:
                  if thumb and os.path.exists(thumb):
                      try: os.remove(thumb)
                      except: pass

          async def upload_episodes(client, entity, topic_id=None):
              ep_files = sorted(glob.glob("EP*.mp4"),
                  key=lambda f: int(re.search(r'EP(\d+)\.mp4', f).group(1)) if re.search(r'EP(\d+)\.mp4', f) else 0)

              if not ep_files:
                  print("❌ No episode files found!")
                  return False

              print(f"📊 Found {len(ep_files)} episodes to upload to topic {topic_id}")
              count = 0

              if topic_id and poster_path and os.path.isfile(poster_path):
                  poster_caption = f"📺 {display_title}\n👤 {series_provider}\n📝 {series_description}"
                  print(f"🖼️ Posting poster with series info into topic...")
                  try:
                      await client.send_file(
                          entity=entity,
                          file=poster_path,
                          caption=poster_caption,
                          reply_to=topic_id
                      )
                      print("✅ Poster + series info posted into topic")
                  except Exception as e:
                      print(f"⚠️ Poster post failed: {e}")
                  await asyncio.sleep(2)

              for ep_file in ep_files:
                  ep_match = re.search(r'EP(\d+)\.mp4', ep_file)
                  if not ep_match:
                      continue
                  ep_num = int(ep_match.group(1))

                  print(f"🔧 Fixing duration for Episode {ep_num}...")
                  if fix_video_duration(ep_file):
                      print(f"✅ Duration fixed for Episode {ep_num}")

                  file_size = os.path.getsize(ep_file) / (1024 * 1024)
                  if file_size > 2000:
                      print(f"⚠️ Episode {ep_num} exceeds 2GB! Skipping.")
                      continue

                  caption = f"📺 Episode {ep_num}"
                  print(f"📤 Uploading Episode {ep_num} ({file_size:.1f} MB)...")

                  with open("episode_upload.log", "a") as f:
                      f.write(f"{datetime.datetime.now()}: STARTING_EP_{ep_num}\n")

                  try:
                      success, result = await send_file_with_thumb(client, entity, ep_file, caption, reply_to=topic_id)
                      if success:
                          count += 1
                          print(f"✅ Episode {ep_num} uploaded into topic")
                          with open("episode_upload.log", "a") as f:
                              f.write(f"{datetime.datetime.now()}: COMPLETE_EP_{ep_num}\n")
                      else:
                          print(f"❌ Episode {ep_num} failed")
                  except FloodWaitError as e:
                      print(f"⏳ Rate limited: waiting {e.seconds}s")
                      await asyncio.sleep(e.seconds)
                      success, result = await send_file_with_thumb(client, entity, ep_file, caption, reply_to=topic_id)
                      if success:
                          count += 1
                          print(f"✅ Episode {ep_num} uploaded into topic")
                  except Exception as e:
                      print(f"❌ Episode {ep_num} error: {e}")

                  await asyncio.sleep(1)

              print(f"✅ Uploaded {count}/{len(ep_files)} episodes")
              return count > 0

          async def main():
              try:
                  print("🔌 Connecting to Telegram...")
                  client = make_client()
                  await client.connect()

                  if not await client.is_user_authorized():
                      print("❌ Session invalid")
                      return

                  me = await client.get_me()
                  print(f"✅ Logged in: {me.first_name}")

                  entity = await resolve_chat(client, chat_id, invite_link, chat_name)
                  if not entity:
                      print("❌ Could not resolve group for single episodes!")
                      return

                  print(f"\n📤 Target Group: {entity.title if hasattr(entity, 'title') else entity.id}")

                  topic_name = f"[{label}]-{display_title}"
                  topic_id = await get_or_create_topic(client, entity, topic_name, topic_id_raw)

                  await upload_episodes(client, entity, topic_id)

                  await client.disconnect()
                  with open("single_episodes_complete.txt", "w") as f:
                      f.write("COMPLETE\n")
                  with open("episode_upload.log", "a") as f:
                      f.write(f"{datetime.datetime.now()}: ALL_EPISODES_COMPLETE\n")
                  print("\n✅ Single episode uploads complete!")
              except Exception as e:
                  print(f"❌ Error: {e}")
                  traceback.print_exc()

          if __name__ == '__main__':
              asyncio.run(main())
          EOFUPLOAD

          python3 upload_single.py
          touch single_episodes_complete.txt

      - name: Wait for All Uploads with Enhanced Progress Monitoring
        if: steps.merge.outputs.verify_success == 'true'
        timeout-minutes: 240
        run: |
          cd downloads

          echo "========================================="
          echo "⏳ MONITORING UPLOAD PROGRESS"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="

          is_merged_running() {
            if [ -n "${{ env.merged_pid }}" ]; then
              if kill -0 ${{ env.merged_pid }} 2>/dev/null; then
                return 0
              fi
            fi
            return 1
          }

          get_merged_progress() {
            if [ -f "merged_progress.log" ]; then
              if grep -q "VIDEO_SENT" merged_progress.log; then
                echo "100|complete"
                return
              fi
              if [ -f "merged_upload.log" ] && grep -q "✅ Video sent to Telegram Channel!" merged_upload.log; then
                echo "100|complete"
                return
              fi
              local last_progress=$(grep -E "[0-9]+\.[0-9]+%.*[0-9]+\.[0-9]+/[0-9]+\.[0-9]+ MB" merged_progress.log | tail -1)
              if [ -n "$last_progress" ]; then
                local percent=$(echo "$last_progress" | grep -oE "[0-9.]+\%" | sed 's/%//')
                local uploaded=$(echo "$last_progress" | grep -oE "[0-9.]+\/[0-9.]+ MB" | sed 's/ MB//')
                echo "$percent|$uploaded"
              else
                echo "0|0.0/0.0"
              fi
            else
              echo "0|0.0/0.0"
            fi
          }

          get_episode_progress() {
            if [ -f "single_episodes_complete.txt" ]; then
              echo "100|complete"
              return
            fi
            if [ -f "episode_upload.log" ]; then
              local total_eps=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
              local completed=$(grep -c "COMPLETE_EP_" episode_upload.log 2>/dev/null || echo "0")
              if [ "$total_eps" -gt 0 ]; then
                local percent=$((completed * 100 / total_eps))
                echo "$percent|${completed}/${total_eps}"
              else
                echo "0|0/0"
              fi
            else
              echo "0|0/0"
            fi
          }

          START_TIME=$(date +%s)
          MERGED_COMPLETE=false
          EPISODES_COMPLETE=false
          NO_PROGRESS_COUNT=0

          echo ""
          echo "🔄 Monitoring upload progress..."
          echo "   (Updates every 5 seconds)"
          echo ""

          while true; do
            if [ -f "single_episodes_complete.txt" ]; then
              EPISODES_COMPLETE=true
            fi

            if [ -f "merged_progress.log" ] && grep -q "VIDEO_SENT" merged_progress.log; then
              MERGED_COMPLETE=true
            elif [ -f "merged_upload.log" ] && grep -q "✅ Video sent to Telegram Channel!" merged_upload.log; then
              MERGED_COMPLETE=true
              if ! grep -q "VIDEO_SENT" merged_progress.log 2>/dev/null; then
                echo "$(date): VIDEO_SENT" >> merged_progress.log
              fi
            elif ! is_merged_running && [ -f "merged_upload.log" ]; then
              if tail -20 merged_upload.log | grep -q "✅ Video sent to Telegram Channel!"; then
                MERGED_COMPLETE=true
                if ! grep -q "VIDEO_SENT" merged_progress.log 2>/dev/null; then
                  echo "$(date): VIDEO_SENT" >> merged_progress.log
                fi
              fi
            fi

            if [ "$MERGED_COMPLETE" = true ] && [ "$EPISODES_COMPLETE" = true ]; then
              echo ""
              echo "✅ ALL UPLOADS COMPLETED!"
              echo ""
              break
            fi

            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ $ELAPSED -lt 60 ]; then
              ELAPSED_STR="${ELAPSED}s"
            elif [ $ELAPSED -lt 3600 ]; then
              ELAPSED_STR="$((ELAPSED / 60))m $((ELAPSED % 60))s"
            else
              ELAPSED_STR="$((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m"
            fi

            clear 2>/dev/null || printf "\033c" 2>/dev/null || echo ""

            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║           📤 UPLOAD PROGRESS MONITOR                        ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║ ⏱️  Elapsed Time: $(printf "%-40s" "$ELAPSED_STR")║"
            echo "║ 📺 Series: $(printf "%-47s" "${{ steps.fname.outputs.series_title }}")║"
            echo "║                                                              ║"

            MERGED_PROGRESS=$(get_merged_progress)
            MERGED_PERCENT=$(echo "$MERGED_PROGRESS" | cut -d'|' -f1)
            MERGED_DATA=$(echo "$MERGED_PROGRESS" | cut -d'|' -f2)

            POSTER_STATUS=""
            if [ -f "merged_upload.log" ]; then
              if grep -q "✅ Poster posted with series info!" merged_upload.log; then
                POSTER_STATUS="✅ Poster sent"
              elif grep -q "ℹ️ Skipping poster" merged_upload.log; then
                POSTER_STATUS="ℹ️ Poster skipped"
              fi
            fi

            if [ "$MERGED_COMPLETE" = true ] || [ "$MERGED_DATA" = "complete" ]; then
              MERGED_COMPLETE=true
              echo "║ 📹 Merged Video:                                        ║"
              echo "║    Status: ✅ COMPLETE                                   ║"
              echo "║    Progress: 100%                                       ║"
              BAR_LENGTH=40
              BAR=""
              for ((i=0; i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
              echo "║    [${BAR}] ║"
              if [ -n "$POSTER_STATUS" ]; then
                echo "║    $POSTER_STATUS                                    ║"
              fi
              echo "║                                                              ║"
            elif [ "$MERGED_PERCENT" != "0" ] && [ "$MERGED_PERCENT" != "100" ]; then
              echo "║ 📹 Merged Video:                                        ║"
              echo "║    Progress: $(printf "%-51s" "${MERGED_PERCENT}%")║"
              BAR_LENGTH=40
              FILLED=$(echo "scale=0; ($MERGED_PERCENT * $BAR_LENGTH) / 100" | bc 2>/dev/null || echo "0")
              BAR=""
              for ((i=0; i<$FILLED && i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
              for ((i=$FILLED; i<$BAR_LENGTH; i++)); do BAR="${BAR}░"; done
              echo "║    [${BAR}] ║"
              if [ -n "$POSTER_STATUS" ]; then
                echo "║    $POSTER_STATUS                                    ║"
              fi
              echo "║                                                              ║"
            elif is_merged_running; then
              echo "║ 📹 Merged Video: Uploading...                           ║"
              echo "║    Status: ⏳ In Progress                                 ║"
              echo "║                                                              ║"
            else
              echo "║ 📹 Merged Video: Starting...                             ║"
              echo "║                                                              ║"
            fi

            echo "║ 📺 Single Episodes:                                        ║"

            EP_PROGRESS=$(get_episode_progress)
            EP_PERCENT=$(echo "$EP_PROGRESS" | cut -d'|' -f1)
            EP_DATA=$(echo "$EP_PROGRESS" | cut -d'|' -f2)

            if [ "$EPISODES_COMPLETE" = true ] || [ "$EP_DATA" = "complete" ]; then
              EPISODES_COMPLETE=true
              echo "║    Status: ✅ COMPLETE                                     ║"
              BAR_LENGTH=40
              BAR=""
              for ((i=0; i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
              echo "║    [${BAR}] ║"
            else
              TOTAL_EPISODES=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
              COMPLETED=$(echo "$EP_DATA" | cut -d'/' -f1 2>/dev/null || echo "0")
              if [ "$TOTAL_EPISODES" -gt 0 ]; then
                echo "║    Progress: $(printf "%-51s" "${EP_PERCENT}% (${COMPLETED}/${TOTAL_EPISODES} episodes)")║"
                BAR_LENGTH=40
                FILLED=$((EP_PERCENT * BAR_LENGTH / 100))
                BAR=""
                for ((i=0; i<$FILLED && i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
                for ((i=$FILLED; i<$BAR_LENGTH; i++)); do BAR="${BAR}░"; done
                echo "║    [${BAR}] ║"
              else
                echo "║    Status: No episodes found                             ║"
              fi
            fi
            echo "║                                                              ║"
            echo "╚══════════════════════════════════════════════════════════════╝"

            if [ "$MERGED_PERCENT" = "100" ] && [ "$MERGED_COMPLETE" = false ]; then
              NO_PROGRESS_COUNT=$((NO_PROGRESS_COUNT + 1))
              if [ $NO_PROGRESS_COUNT -gt 12 ]; then
                if ! is_merged_running; then
                  if [ -f "merged_upload.log" ] && grep -q "✅ Video sent to Telegram Channel!" merged_upload.log; then
                    echo "$(date): VIDEO_SENT" >> merged_progress.log
                    MERGED_COMPLETE=true
                  else
                    NO_PROGRESS_COUNT=0
                  fi
                else
                  NO_PROGRESS_COUNT=0
                fi
              fi
            else
              NO_PROGRESS_COUNT=0
            fi

            sleep 5
          done

          echo "========================================="
          echo "✅ ALL UPLOADS COMPLETED SUCCESSFULLY!"
          echo "========================================="

          if [ -f "merged_upload.log" ]; then
            echo ""
            echo "📋 Final merged upload log:"
            echo "========================================="
            tail -20 merged_upload.log
            echo "========================================="
          fi

          echo ""
          echo "📊 Upload Summary:"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "⏱️  Total Time: $ELAPSED_STR"

          if [ -f "merged_progress.log" ]; then
            FINAL_SIZE=$(grep -E "[0-9]+\.[0-9]+/[0-9]+\.[0-9]+ MB" merged_progress.log | tail -1 | grep -oE "[0-9.]+\/[0-9.]+ MB" | tail -1)
            if [ -n "$FINAL_SIZE" ]; then
              echo "📹 Merged Video Size: $FINAL_SIZE"
            fi
          fi

          EP_COUNT=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          if [ -f "single_episodes_complete.txt" ]; then
            if grep -q "skipped" single_episodes_complete.txt 2>/dev/null; then
              echo "📺 Episodes Upload: ⏭️ Skipped (user requested)"
            else
              echo "📺 Episodes Uploaded: $EP_COUNT"
            fi
          fi

          echo "========================================="
          if [ -f "single_episodes_complete.txt" ] && [ -f "merged_progress.log" ] && grep -q "VIDEO_SENT" merged_progress.log; then
            echo "🎉 All uploads completed successfully!"
          fi
          echo "========================================="

      - name: Cleanup - Delete Workflow Run if Successful
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const runId = context.runId;
            const repo = context.repo;

            console.log(`🧹 Cleaning up workflow run ${runId}`);
            console.log(`📦 Repository: ${repo.owner}/${repo.repo}`);

            try {
              await github.rest.actions.deleteWorkflowRun({
                owner: repo.owner,
                repo: repo.repo,
                run_id: runId
              });
              console.log(`✅ Successfully deleted workflow run ${runId}`);
            } catch (error) {
              console.log(`❌ Failed to delete workflow run: ${error.message}`);
              if (error.status === 403) {
                console.log('⚠️ Permission denied. The token may not have "actions: write" permission.');
                console.log('ℹ️ You may need to manually delete this workflow run.');
              } else if (error.status === 404) {
                console.log('⚠️ Workflow run not found. It may have been already deleted.');
              } else {
                console.log(`⚠️ Error details: ${JSON.stringify(error, null, 2)}`);
              }
              console.log('ℹ️ Continuing workflow execution...');
            }
