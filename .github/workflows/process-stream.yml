name: Process Stream

on:
  workflow_dispatch:
    inputs:
      command:
        required: true
      callback_url:
        required: true
      stream_id:
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (static)
        run: |
          curl -L -o /tmp/ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ffmpeg
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          sudo mv /tmp/ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo mv /tmp/ffmpeg/ffprobe /usr/local/bin/ffprobe
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          ffmpeg -version | head -1

      - name: Download N_m3u8DL-RE
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/nilaoda/N_m3u8DL-RE/releases/latest \
            | grep "browser_download_url.*linux-x64.*tar.gz" \
            | cut -d '"' -f 4)
          if [ -z "$ASSET_URL" ]; then
            echo "Could not find linux-x64 asset"
            exit 1
          fi
          curl -L -o n-m3u8dl-re.tar.gz "$ASSET_URL"
          tar -xzf n-m3u8dl-re.tar.gz
          chmod +x N_m3u8DL-RE
          ./N_m3u8DL-RE --version

      - name: Install shaka-packager
        run: |
          curl -L -o /tmp/shaka-packager \
            https://github.com/shaka-project/shaka-packager/releases/latest/download/packager-linux-x64
          chmod +x /tmp/shaka-packager
          sudo mv /tmp/shaka-packager /usr/local/bin/shaka-packager
          shaka-packager --version 2>&1 | head -1 || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install axios

      - name: Run relay
        env:
          COMMAND: ${{ inputs.command }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          STREAM_ID: ${{ inputs.stream_id }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          cat > process.js << 'JSEOF'
          const axios = require('axios');
          const crypto = require('crypto');
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          async function main() {
            const command     = process.env.COMMAND;
            const callbackUrl = process.env.CALLBACK_URL;
            const streamId    = process.env.STREAM_ID;
            const secret      = process.env.CALLBACK_SECRET;
            const proxyUrl    = process.env.PROXY_URL || '';

            console.log('Running N_m3u8DL-RE (parse-only, debug log)');

            let result;
            let metaJsonContent = '';

            try {
              // Parse the user's command to extract the URL and headers
              const urlMatch = command.match(/N_m3u8DL-RE\s+"([^"]+)"/);
              const originalUrl = urlMatch ? urlMatch[1] : '';

              const headerMatches = [...command.matchAll(/-H\s+"([^:]+):\s*([^"]+)"/g)];
              const headers = {};
              for (const m of headerMatches) {
                headers[m[1].trim()] = m[2].trim();
              }

              console.log('Source URL: ' + originalUrl.slice(0, 80) + '...');
              console.log('Headers parsed: ' + Object.keys(headers).join(', '));

              // Build N_m3u8DL-RE command with debug logging
              let execCmd = command.replace(/^N_m3u8DL-RE\s+/, './N_m3u8DL-RE ');

              if (proxyUrl && !execCmd.includes('--custom-proxy')) {
                execCmd += ` --custom-proxy "${proxyUrl}"`;
              }

              const flagsToAdd = [
                '--skip-download',
                '--write-meta-json',
                '--auto-select',
                '--log-level DEBUG',
              ];
              for (const flag of flagsToAdd) {
                if (!execCmd.includes(flag.split(' ')[0])) {
                  execCmd += ` ${flag}`;
                }
              }

              execCmd = execCmd
                .replace(/--morehelp/g, '')
                .replace(/--skip-merge/g, '');

              console.log('Executing N_m3u8DL-RE...');

              const output = execSync(execCmd, {
                encoding: 'utf-8',
                timeout: 300000,
                maxBuffer: 30 * 1024 * 1024,
                env: process.env,
                shell: '/bin/bash',
                cwd: process.env.GITHUB_WORKSPACE || '.',
              });

              console.log('N_m3u8DL-RE output: ' + output.length + ' bytes');

              // Try meta.json first
              const candidates = [
                'meta.json',
                path.join(process.env.GITHUB_WORKSPACE || '.', 'meta.json'),
                path.join(process.cwd(), 'meta.json'),
              ];
              for (const candidate of candidates) {
                if (fs.existsSync(candidate)) {
                  metaJsonContent = fs.readFileSync(candidate, 'utf-8');
                  console.log('meta.json read from: ' + candidate);
                  break;
                }
              }

              // As fallback, fetch the MPD ourselves using the parsed headers
              let rawManifest = '';
              if (!metaJsonContent && originalUrl) {
                console.log('Fetching MPD directly with parsed headers...');
                try {
                  const mpdRes = await axios.get(originalUrl, {
                    headers: {
                      ...headers,
                      'Accept': '*/*',
                    },
                    timeout: 30000,
                    responseType: 'text',
                    httpsAgent: proxyUrl ? new (require('https').Agent)({
                      // Not using HTTP proxy here — N_m3u8DL-RE already validated access
                    }) : undefined,
                  });
                  rawManifest = mpdRes.data;
                  console.log('MPD fetched directly: ' + rawManifest.length + ' bytes');
                } catch (e) {
                  console.error('Direct MPD fetch failed: ' + e.message);
                }
              }

              result = {
                streamId,
                success: true,
                n3u8Output: output,
                metaJson: metaJsonContent,
                rawManifest: rawManifest,
                sourceUrl: originalUrl,
                headers: headers,
                fetchedAt: new Date().toISOString(),
              };
            } catch (err) {
              const stderr = err.stderr ? err.stderr.toString() : '';
              const stdout = err.stdout ? err.stdout.toString() : '';
              console.error('N_m3u8DL-RE failed: ' + err.message);
              result = {
                streamId,
                success: false,
                error: err.message,
                stdout: stdout.slice(0, 10000),
                stderr: stderr.slice(0, 10000),
                metaJson: metaJsonContent,
                fetchedAt: new Date().toISOString(),
              };
            }

            const payload = JSON.stringify(result);
            const signature = crypto
              .createHmac('sha256', secret)
              .update(payload)
              .digest('hex');

            console.log('Posting callback...');
            try {
              await axios.post(callbackUrl, result, {
                headers: {
                  'Content-Type': 'application/json',
                  'X-Signature': signature,
                },
                timeout: 20000,
                maxBodyLength: 50 * 1024 * 1024,
              });
              console.log('Callback delivered');
            } catch (e) {
              console.error('Callback failed: ' + e.message);
              process.exit(1);
            }
            if (!result.success) process.exit(1);
          }

          main();
          JSEOF
          node process.js
