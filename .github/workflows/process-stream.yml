name: Process Stream

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        required: true
      callback_url:
        required: true
      stream_id:
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download N_m3u8DL-RE
        run: |
          # Fetch the latest release asset dynamically to avoid 404s
          ASSET_URL=$(curl -s https://api.github.com/repos/nilaoda/N_m3u8DL-RE/releases/latest \
            | grep "browser_download_url.*linux-x64.*tar.gz" \
            | cut -d '"' -f 4)
          
          if [ -z "$ASSET_URL" ]; then
            echo "Could not find linux-x64 asset in latest release"
            exit 1
          fi
          
          echo "Downloading: $ASSET_URL"
          curl -L -o n-m3u8dl-re.tar.gz "$ASSET_URL"
          tar -xzf n-m3u8dl-re.tar.gz
          chmod +x N_m3u8DL-RE
          ./N_m3u8DL-RE --version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install axios

      - name: Run relay
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          STREAM_ID: ${{ inputs.stream_id }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          cat > process.js << 'JSEOF'
          const axios = require('axios');
          const crypto = require('crypto');
          const { execSync } = require('child_process');

          async function main() {
            const manifestUrl = process.env.MANIFEST_URL;
            const callbackUrl = process.env.CALLBACK_URL;
            const streamId    = process.env.STREAM_ID;
            const secret      = process.env.CALLBACK_SECRET;

            console.log('Probing manifest with N_m3u8DL-RE: ' + manifestUrl);

            let result;
            try {
              // Run N_m3u8DL-RE in skip-download mode to parse the stream
              const output = execSync(
                `./N_m3u8DL-RE "${manifestUrl}" --skip-download --morehelp`,
                { encoding: 'utf-8', timeout: 45000, maxBuffer: 10 * 1024 * 1024 }
              );

              console.log('N_m3u8DL-RE output captured (' + output.length + ' bytes)');

              result = {
                streamId,
                success: true,
                n3u8Output: output,
                fetchedAt: new Date().toISOString(),
                sourceUrl: manifestUrl,
              };
            } catch (err) {
              const stderr = err.stderr ? err.stderr.toString() : '';
              const stdout = err.stdout ? err.stdout.toString() : '';
              console.error('N_m3u8DL-RE failed: ' + err.message);
              console.error('STDOUT:', stdout.slice(0, 2000));
              console.error('STDERR:', stderr.slice(0, 2000));
              result = {
                streamId,
                success: false,
                error: err.message,
                stdout: stdout.slice(0, 5000),
                stderr: stderr.slice(0, 5000),
                fetchedAt: new Date().toISOString(),
              };
            }

            const payload = JSON.stringify(result);
            const signature = crypto
              .createHmac('sha256', secret)
              .update(payload)
              .digest('hex');

            console.log('Posting callback: ' + callbackUrl);
            await axios.post(callbackUrl, result, {
              headers: {
                'Content-Type': 'application/json',
                'X-Signature': signature,
              },
              timeout: 20000,
            });

            console.log('Callback delivered');
            if (!result.success) process.exit(1);
          }

          main();
          JSEOF
          node process.js
