name: GitHub Telegram & Media Pipeline

on:
  repository_dispatch:
    types: [github_release_upload]

# ONLY ONE WORKFLOW RUN AT A TIME
concurrency:
  group: media-pipeline-processor
  cancel-in-progress: false
  queue: max

# Add permissions for deleting workflow runs
permissions:
  actions: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Series Information & Setup
        run: |
          echo "========================================="
          echo "📋 SERIES INFORMATION"
          echo "========================================="
          
          # Extract series information from payload
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Unknown Series' }}"
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          EPISODE_COUNT="${{ github.event.client_payload.episode_count || 'Unknown' }}"
          
          echo "📺 Series Title: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "📊 Episode Count: $EPISODE_COUNT"
          echo "⏰ Started at: $(date)"
          echo "========================================="
          
          # Store for later use
          echo "series_title=$SERIES" >> $GITHUB_ENV
          echo "label=$LABEL" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Tools
        run: |
          echo "========================================="
          echo "🔧 INSTALLING TOOLS"
          echo "========================================="
          echo "📺 Series: ${{ env.series_title }}"
          echo "========================================="
          
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 curl python3-pip jq mkvtoolnix bc wget mediainfo exiftool
          pip3 install --upgrade pip
          pip3 install telethon qrcode yt-dlp requests
          pip3 install aiohttp python-socks[asyncio]
          python3 -c "import telethon; print(f'✅ Telethon version: {telethon.__version__}')"
          
          echo "========================================="
          echo "✅ INSTALLATION COMPLETE"
          echo "========================================="

      - name: Compute Dynamic Formatted Output Filename & Label
        id: fname
        run: |
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Series' }}"
          
          echo "========================================="
          echo "📝 COMPUTING FILENAME"
          echo "========================================="
          echo "📺 Series: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "========================================="
          
          CLEAN_LABEL=$(echo "$LABEL" | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          CLEAN_SERIES_TITLE=$(echo "$SERIES" | sed -e 's/[\/:*?"<>|]/_/g' -e 's/^ *//' -e 's/ *$//')
          CLEAN_SERIES_TAG=$(echo "$CLEAN_SERIES_TITLE" | tr ' ' '_')
          
          DATE_STR=$(date +'%Y-%m-%d')
          
          TAG_NAME="${DATE_STR}-${CLEAN_LABEL}-${CLEAN_SERIES_TAG}"
          FORMATTED_TITLE="[${DATE_STR}]-[${CLEAN_LABEL}]-${CLEAN_SERIES_TITLE}"
          
          echo "📄 Formatted Title: $FORMATTED_TITLE"
          echo "🏷️  Tag Name: $TAG_NAME"
          echo "========================================="
          
          echo "formatted_title=${FORMATTED_TITLE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "series_title=${CLEAN_SERIES_TITLE}" >> $GITHUB_OUTPUT
          echo "clean_label=${CLEAN_LABEL}" >> $GITHUB_OUTPUT

      - name: Parse URLs with jq (Clean & Uncorrupted)
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "========================================="
          echo "📋 PARSING URLs"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          mkdir -p downloads && cd downloads
          
          # Extract URLs cleanly: remove \r carriage returns and trim whitespace
          echo "$CLIENT_PAYLOAD" | tr -d '\r' | jq -r '
            (.episodes[]?.url // .video_urls[]? // .video_url // .url // empty)
            | tostring | gsub("^\\s+|\\s+$"; "")
          ' > urls.txt
          
          # Remove empty lines
          sed -i '/^$/d' urls.txt
          
          echo "========================================="
          echo "📋 URLs to download:"
          cat urls.txt
          echo "========================================="
          
          echo "total_episodes=$(cat urls.txt | wc -l)" >> $GITHUB_ENV
          
          if [ ! -s urls.txt ]; then
            echo "❌ No valid URLs found!"
            exit 1
          fi
          
          echo "✅ Found $(cat urls.txt | wc -l) URLs"

      - name: Download All Episodes (All-or-Nothing)
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ github.event.client_payload.label || 'NONE' }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📥 DOWNLOADING EPISODES"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $(cat urls.txt | wc -l)"
          echo "========================================="
          
          TOTAL_EPISODES=$(cat urls.txt | wc -l)
          echo "📥 Need to download $TOTAL_EPISODES episodes"
          
          # Create verify_and_repair.py
          cat > verify_and_repair.py << 'EOFVERIFY'
          import os
          import sys
          import subprocess
          import json
          import shutil
          
          def check_with_mediainfo(file_path):
              try:
                  cmd = ["mediainfo", "--Output=JSON", file_path]
                  result = subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL)
                  data = json.loads(result)
                  
                  tracks = data.get("media", {}).get("track", [])
                  for track in tracks:
                      if track.get("@type") == "Video":
                          return True, track
                  return False, None
              except:
                  return False, None
          
          def compress_video(file_path, target_size_mb=80):
              """Compress video to target size using FFmpeg with improved quality"""
              print(f"  🔧 Compressing: {os.path.basename(file_path)} to < {target_size_mb}MB")
              
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              if file_size_mb <= target_size_mb:
                  print(f"  ✅ File already under {target_size_mb}MB ({file_size_mb:.1f}MB)")
                  return True
              
              # Get video duration
              try:
                  cmd = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", file_path]
                  duration = float(subprocess.check_output(cmd, text=True).strip())
                  
                  if duration == 0:
                      cmd = ["mediainfo", "--Inform=Video;%Duration%", file_path]
                      duration_str = subprocess.check_output(cmd, text=True).strip()
                      duration = float(duration_str) / 1000 if duration_str else 0
              except:
                  duration = 0
              
              if duration <= 0:
                  print("  ⚠️ Could not determine duration, using default compression")
                  crf_value = 28
              else:
                  # Calculate bitrate to achieve target size
                  # target_size_mb * 8 (bits) / duration (seconds)
                  target_bitrate = (target_size_mb * 8 * 1024) / duration
                  
                  # Cap bitrate for quality preservation
                  if target_bitrate > 2000:
                      target_bitrate = 2000
                  elif target_bitrate < 500:
                      target_bitrate = 500
                  
                  # Determine CRF based on bitrate
                  if target_bitrate >= 1500:
                      crf_value = 23
                  elif target_bitrate >= 1000:
                      crf_value = 26
                  elif target_bitrate >= 700:
                      crf_value = 28
                  else:
                      crf_value = 30
              
              base_name = os.path.splitext(file_path)[0]
              temp_file = f"{base_name}_compressed.mp4"
              
              print(f"  📊 Duration: {duration:.1f}s, Target bitrate: {target_bitrate:.0f}k, CRF: {crf_value}")
              
              # First attempt: CRF encoding (better quality)
              cmd = [
                  "ffmpeg", "-y",
                  "-i", file_path,
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", str(crf_value),
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ar", "44100",
                  "-movflags", "+faststart",
                  "-metadata", f"title={os.environ.get('TITLE', '')}",
                  "-metadata", f"series={os.environ.get('SERIES_TITLE', '')}",
                  "-metadata", f"label={os.environ.get('LABEL', '')}",
                  temp_file
              ]
              
              try:
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
                  
                  if result.returncode == 0 and os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                      new_size_mb = os.path.getsize(temp_file) / (1024 * 1024)
                      print(f"  ✅ CRF compression complete: {new_size_mb:.1f}MB")
                      
                      if new_size_mb <= target_size_mb:
                          shutil.move(temp_file, file_path)
                          return True
                      else:
                          print(f"  ⚠️ CRF compression still too large ({new_size_mb:.1f}MB > {target_size_mb}MB)")
                          
                          # Try two-pass encoding for better control
                          print("  🔧 Trying two-pass encoding...")
                          return compress_two_pass(file_path, target_size_mb, duration)
                  else:
                      print(f"  ❌ CRF compression failed: {result.stderr[:200]}")
                      return False
              except subprocess.TimeoutExpired:
                  print("  ❌ CRF compression timeout")
                  return False
              finally:
                  if os.path.exists(temp_file):
                      try: os.remove(temp_file)
                      except: pass
          
          def compress_two_pass(file_path, target_size_mb, duration):
              """Two-pass VBR encoding for better size control"""
              if duration <= 0:
                  return False
              
              # Slightly under target to account for overhead
              target_bitrate = ((target_size_mb * 0.9) * 8 * 1024) / duration
              
              if target_bitrate < 400:
                  target_bitrate = 400
              elif target_bitrate > 2500:
                  target_bitrate = 2500
              
              base_name = os.path.splitext(file_path)[0]
              temp_file = f"{base_name}_2pass.mp4"
              
              print(f"  📊 Two-pass: {target_bitrate:.0f}k bitrate")
              
              # Pass 1 - Analysis
              cmd_pass1 = [
                  "ffmpeg", "-y",
                  "-i", file_path,
                  "-c:v", "libx264",
                  "-b:v", f"{target_bitrate:.0f}k",
                  "-preset", "medium",
                  "-pass", "1",
                  "-an",  # No audio in first pass
                  "-f", "null",
                  "/dev/null"
              ]
              
              # Pass 2 - Encoding
              cmd_pass2 = [
                  "ffmpeg", "-y",
                  "-i", file_path,
                  "-c:v", "libx264",
                  "-b:v", f"{target_bitrate:.0f}k",
                  "-preset", "medium",
                  "-pass", "2",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ar", "44100",
                  "-movflags", "+faststart",
                  "-metadata", f"title={os.environ.get('TITLE', '')}",
                  "-metadata", f"series={os.environ.get('SERIES_TITLE', '')}",
                  "-metadata", f"label={os.environ.get('LABEL', '')}",
                  temp_file
              ]
              
              try:
                  print("  🔄 Pass 1/2...")
                  subprocess.run(cmd_pass1, capture_output=True, text=True, timeout=300, check=True)
                  
                  print("  🔄 Pass 2/2...")
                  subprocess.run(cmd_pass2, capture_output=True, text=True, timeout=600, check=True)
                  
                  if os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                      new_size_mb = os.path.getsize(temp_file) / (1024 * 1024)
                      print(f"  ✅ Two-pass compression complete: {new_size_mb:.1f}MB")
                      
                      if new_size_mb <= target_size_mb:
                          shutil.move(temp_file, file_path)
                          return True
                      else:
                          print(f"  ⚠️ Still too large: {new_size_mb:.1f}MB > {target_size_mb}MB")
                          # Keep the compressed file anyway if it's smaller than original
                          if new_size_mb < os.path.getsize(file_path) / (1024 * 1024):
                              shutil.move(temp_file, file_path)
                              return True
                          return False
                  
                  return False
              except subprocess.TimeoutExpired:
                  print("  ❌ Two-pass encoding timeout")
                  return False
              except subprocess.CalledProcessError as e:
                  print(f"  ❌ Two-pass encoding error: {e}")
                  return False
              finally:
                  # Clean up pass files
                  for f in ["ffmpeg2pass-0.log", "ffmpeg2pass-0.log.mbtree"]:
                      if os.path.exists(f):
                          try: os.remove(f)
                          except: pass
          
          def repair_mp4(file_path):
              print("  🔧 Attempting repair...")
              
              temp_file = f"{file_path}.temp.mp4"
              try:
                  cmd = [
                      "ffmpeg", "-y",
                      "-err_detect", "ignore_err",
                      "-i", file_path,
                      "-c", "copy",
                      "-movflags", "+faststart",
                      "-ignore_unknown",
                      temp_file
                  ]
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=120)
                  
                  if result.returncode == 0 and os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                      is_valid, _ = check_with_mediainfo(temp_file)
                      if is_valid:
                          shutil.move(temp_file, file_path)
                          print("  ✅ Repaired with ffmpeg remux")
                          return True
              except:
                  pass
              finally:
                  if os.path.exists(temp_file):
                      try: os.remove(temp_file)
                      except: pass
              
              try:
                  print("  ⚠️ Attempting re-encode...")
                  temp_file = f"{file_path}.temp.mp4"
                  cmd = [
                      "ffmpeg", "-y",
                      "-err_detect", "ignore_err",
                      "-i", file_path,
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "23",
                      "-c:a", "aac",
                      "-b:a", "128k",
                      "-movflags", "+faststart",
                      temp_file
                  ]
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
                  
                  if result.returncode == 0 and os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                      is_valid, _ = check_with_mediainfo(temp_file)
                      if is_valid:
                          shutil.move(temp_file, file_path)
                          print("  ✅ Repaired with re-encode")
                          return True
              except:
                  pass
              finally:
                  if os.path.exists(temp_file):
                      try: os.remove(temp_file)
                      except: pass
              
              return False
          
          def process_video(file_path, max_size_mb=80):
              """Process video: verify, repair, compress if needed"""
              if not os.path.exists(file_path):
                  print(f"ERROR: File not found: {file_path}")
                  return False
              
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"📊 Original size: {file_size_mb:.1f}MB")
              
              # First verify
              is_valid, video_track = check_with_mediainfo(file_path)
              
              if not is_valid:
                  print("  ⚠️ Invalid file, attempting repair...")
                  if not repair_mp4(file_path):
                      print("  ❌ Repair failed")
                      return False
                  is_valid, video_track = check_with_mediainfo(file_path)
                  if not is_valid:
                      print("  ❌ File still invalid after repair")
                      return False
              
              # Check size and compress if needed
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              if file_size_mb > max_size_mb:
                  print(f"  ⚠️ File exceeds {max_size_mb}MB ({file_size_mb:.1f}MB)")
                  
                  # Try compression
                  if compress_video(file_path, max_size_mb):
                      final_size_mb = os.path.getsize(file_path) / (1024 * 1024)
                      print(f"  ✅ Compression successful: {final_size_mb:.1f}MB")
                  else:
                      print(f"  ❌ Compression failed, file remains {file_size_mb:.1f}MB")
                      
                      # Final attempt: use very aggressive compression
                      print("  🔧 Attempting aggressive compression...")
                      base_name = os.path.splitext(file_path)[0]
                      temp_file = f"{base_name}_agg.mp4"
                      
                      cmd = [
                          "ffmpeg", "-y",
                          "-i", file_path,
                          "-c:v", "libx264",
                          "-preset", "fast",
                          "-crf", "32",
                          "-c:a", "aac",
                          "-b:a", "96k",
                          "-ar", "44100",
                          "-movflags", "+faststart",
                          "-metadata", f"title={os.environ.get('TITLE', '')}",
                          "-metadata", f"series={os.environ.get('SERIES_TITLE', '')}",
                          "-metadata", f"label={os.environ.get('LABEL', '')}",
                          temp_file
                      ]
                      
                      try:
                          subprocess.run(cmd, capture_output=True, text=True, timeout=300, check=True)
                          if os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                              new_size_mb = os.path.getsize(temp_file) / (1024 * 1024)
                              if new_size_mb < file_size_mb:
                                  shutil.move(temp_file, file_path)
                                  print(f"  ✅ Aggressive compression: {new_size_mb:.1f}MB")
                              else:
                                  os.remove(temp_file)
                      except:
                          pass
              
              # Final verification
              is_valid, video_track = check_with_mediainfo(file_path)
              if is_valid and video_track:
                  print(f"  ✅ Final check passed")
                  print(f"  📐 {video_track.get('Width', 'N/A')}x{video_track.get('Height', 'N/A')}")
                  print(f"  💾 {os.path.getsize(file_path) / (1024*1024):.1f}MB")
                  return True
              else:
                  print("  ❌ Final verification failed")
                  return False
          
          def main():
              file_path = sys.argv[1]
              max_size = int(sys.argv[2]) if len(sys.argv) > 2 else 80
              
              success = process_video(file_path, max_size)
              sys.exit(0 if success else 1)
          
          if __name__ == "__main__":
              main()
          EOFVERIFY
          
          EP_INDEX=1
          FAILED_EPISODES=""
          COMPRESSED_EPISODES=""
          
          while IFS= read -u 3 -r URL || [ -n "$URL" ]; do
            URL=$(echo "$URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$URL" ]; then continue; fi
            
            EP_NUM=$(printf "%02d" $EP_INDEX)
            OUT_FILE="EP${EP_NUM}.mp4"
            
            echo "========================================="
            echo "📥 Downloading Episode $EP_INDEX/$TOTAL_EPISODES"
            echo "📎 URL: $URL"
            echo "💾 Output: $OUT_FILE"
            echo "========================================="
            
            if [[ "$URL" == *".m3u8"* ]]; then
              echo "📺 HLS stream - Using yt-dlp"
              
              yt-dlp -f "bestvideo+bestaudio/best" --hls-use-mpegts --concurrent-fragments 16 \
                --no-progress --no-warnings \
                -o "$OUT_FILE" "$URL" < /dev/null 2>&1 | grep -E "(Extracting URL|Downloading webpage|Downloading m3u8|Total fragments|Destination|Downloading 1 format)" || true
              
              if [ ! -f "$OUT_FILE" ] || [ ! -s "$OUT_FILE" ]; then
                echo "⚠️ First attempt failed, trying with ffmpeg..."
                ffmpeg -nostdin -i "$URL" -c copy "$OUT_FILE" < /dev/null 2>/dev/null
              fi
              DOWNLOAD_STATUS=$?
              
              if [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
                FILE_SIZE=$(du -h "$OUT_FILE" | cut -f1)
                echo "✅ Downloaded: $OUT_FILE ($FILE_SIZE)"
              fi
              
            else
              echo "🎬 Direct file - Using aria2c"
              aria2c -x 16 -s 16 -k 1M --continue=true \
                --console-log-level=error \
                --summary-interval=0 \
                -o "$OUT_FILE" "$URL" < /dev/null 2>/dev/null || \
              curl -sSL "$URL" -o "$OUT_FILE" < /dev/null 2>/dev/null
              DOWNLOAD_STATUS=$?
              
              if [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
                FILE_SIZE=$(du -h "$OUT_FILE" | cut -f1)
                echo "✅ Downloaded: $OUT_FILE ($FILE_SIZE)"
              fi
            fi
            
            if [ $DOWNLOAD_STATUS -eq 0 ] && [ -f "$OUT_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
              
              if [ "$FILE_SIZE" -gt 50000 ]; then
                echo "🔍 Verifying and processing file..."
                echo "   Max size: 80MB"
                
                if python3 verify_and_repair.py "$OUT_FILE" 80 < /dev/null; then
                  echo "✅ File verified and processed"
                  
                  # Check if file was compressed
                  FINAL_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
                  FINAL_SIZE_MB=$((FINAL_SIZE / 1024 / 1024))
                  
                  if [ $FINAL_SIZE_MB -le 80 ]; then
                    echo "✅ File size: ${FINAL_SIZE_MB}MB (within 80MB limit)"
                  else
                    echo "⚠️ File still exceeds 80MB (${FINAL_SIZE_MB}MB), but continuing..."
                  fi
                  
                  EPISODE_TITLE="Episode ${EP_NUM} - ${SERIES_TITLE}"
                  
                  ffmpeg -nostdin -i "$OUT_FILE" \
                    -c copy \
                    -metadata title="$EPISODE_TITLE" \
                    -metadata episode_id="$EP_NUM" \
                    -metadata series="$SERIES_TITLE" \
                    -metadata label="$LABEL" \
                    -metadata date="$(date +%Y-%m-%d)" \
                    -metadata media_type="tv_episode" \
                    -movflags +faststart \
                    "temp_$OUT_FILE" < /dev/null 2>/dev/null
                  
                  if [ $? -eq 0 ] && [ -f "temp_$OUT_FILE" ]; then
                    mv "temp_$OUT_FILE" "$OUT_FILE"
                    echo "✅ Metadata added"
                  else
                    rm -f "temp_$OUT_FILE"
                  fi
                  
                else
                  echo "❌ File verification failed"
                  rm -f "$OUT_FILE"
                  FAILED_EPISODES="$FAILED_EPISODES $EP_NUM"
                fi
              else
                echo "❌ File too small: $OUT_FILE ($FILE_SIZE bytes)"
                rm -f "$OUT_FILE"
                FAILED_EPISODES="$FAILED_EPISODES $EP_NUM"
              fi
            else
              echo "❌ Download failed for Episode $EP_INDEX"
              FAILED_EPISODES="$FAILED_EPISODES $EP_NUM"
            fi
            
            EP_INDEX=$((EP_INDEX + 1))
            echo ""
          done 3< urls.txt
          
          echo "========================================="
          echo "📊 DOWNLOAD & COMPRESSION SUMMARY"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Expected: $TOTAL_EPISODES episodes"
          
          TOTAL_FILES=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          echo "✅ Downloaded: $TOTAL_FILES/$TOTAL_EPISODES episodes"
          
          # Show file sizes after compression
          echo ""
          echo "📊 Final episode sizes:"
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              SIZE_MB=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null | awk '{print $1/1024/1024}')
              printf "   %-10s: %.1f MB\n" "$f" "$SIZE_MB"
            fi
          done
          echo ""
          
          if [ -n "$FAILED_EPISODES" ]; then
            echo "❌ FAILED EPISODES: $FAILED_EPISODES"
            echo "❌ Not all episodes downloaded successfully!"
            echo "   This is an all-or-nothing workflow. Exiting."
            exit 1
          fi
          
          if [ "$TOTAL_FILES" -ne "$TOTAL_EPISODES" ]; then
            echo "❌ Expected $TOTAL_EPISODES episodes, but only $TOTAL_FILES downloaded!"
            echo "❌ Exiting - all episodes required."
            exit 1
          fi
          
          echo "✅ All $TOTAL_EPISODES episodes downloaded and processed successfully!"
          echo "========================================="

      - name: Smart Merge Episodes
        id: merge
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔗 MERGING EPISODES"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📊 Episodes: $(ls -1 EP*.mp4 2>/dev/null | wc -l)"
          echo "========================================="
          
          EP_COUNT=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          if [ "$EP_COUNT" -eq 0 ]; then
            echo "❌ No episodes to merge!"
            exit 1
          fi
          
          if [ "$EP_COUNT" -eq 1 ]; then
            echo "📦 Only 1 episode - skipping merge"
            SINGLE_FILE=$(ls EP*.mp4 | head -1)
            ffmpeg -i "$SINGLE_FILE" -c copy -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output.mp4" 2>/dev/null
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📊 Found $EP_COUNT episodes to merge"
          
          echo "🔍 Analyzing file properties with MediaInfo..."
          
          declare -A resolutions
          declare -A audio_sample_rates
          declare -A video_codecs
          declare -A audio_codecs
          
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              res=$(mediainfo --Inform="Video;%Width%x%Height%" "$f" 2>/dev/null || echo "0x0")
              resolutions["$f"]="$res"
              
              sample_rate=$(mediainfo --Inform="Audio;%SamplingRate%" "$f" 2>/dev/null | tr -d ' ' | cut -d'/' -f1 | cut -d' ' -f1)
              if [ -z "$sample_rate" ] || [ "$sample_rate" = "0" ]; then
                sample_rate="44100"
              fi
              audio_sample_rates["$f"]="$sample_rate"
              
              video_codec=$(mediainfo --Inform="Video;%CodecID%" "$f" 2>/dev/null || echo "unknown")
              if [ -z "$video_codec" ] || [ "$video_codec" = "unknown" ]; then
                video_codec=$(mediainfo --Inform="Video;%Format%" "$f" 2>/dev/null || echo "AVC")
              fi
              video_codecs["$f"]="$video_codec"
              
              audio_codec=$(mediainfo --Inform="Audio;%Format%" "$f" 2>/dev/null || echo "AAC")
              if [ -z "$audio_codec" ] || [ "$audio_codec" = "unknown" ]; then
                audio_codec="AAC"
              fi
              audio_codecs["$f"]="$audio_codec"
              
              echo "$f: ${resolutions[$f]}, ${audio_sample_rates[$f]}Hz, ${video_codecs[$f]}, ${audio_codecs[$f]}"
            fi
          done
          
          if [ ${#resolutions[@]} -eq 0 ]; then
            echo "❌ No valid files to merge!"
            exit 1
          fi
          
          TARGET_RES=$(printf '%s\n' "${resolutions[@]}" | grep -v "0x0" | sort | uniq -c | sort -nr | head -1 | awk '{print $2}')
          if [ -z "$TARGET_RES" ] || [ "$TARGET_RES" = "0x0" ]; then
            TARGET_RES="720x1280"
          fi
          
          TARGET_SAMPLE_RATE=$(printf '%s\n' "${audio_sample_rates[@]}" | sort | uniq -c | sort -nr | head -1 | awk '{print $2}')
          if [ -z "$TARGET_SAMPLE_RATE" ]; then
            TARGET_SAMPLE_RATE="44100"
          fi
          
          TARGET_VIDEO_CODEC=$(printf '%s\n' "${video_codecs[@]}" | sort | uniq -c | sort -nr | head -1 | awk '{print $2}')
          if [ -z "$TARGET_VIDEO_CODEC" ]; then
            TARGET_VIDEO_CODEC="avc1"
          fi
          
          TARGET_AUDIO_CODEC=$(printf '%s\n' "${audio_codecs[@]}" | sort | uniq -c | sort -nr | head -1 | awk '{print $2}')
          if [ -z "$TARGET_AUDIO_CODEC" ]; then
            TARGET_AUDIO_CODEC="AAC"
          fi
          
          TARGET_W=$(echo "$TARGET_RES" | cut -d'x' -f1)
          TARGET_H=$(echo "$TARGET_RES" | cut -d'x' -f2)
          
          echo ""
          echo "🎯 TARGET PROPERTIES:"
          echo "   Resolution: ${TARGET_W}x${TARGET_H}"
          echo "   Audio Sample Rate: ${TARGET_SAMPLE_RATE} Hz"
          echo "   Video Codec: ${TARGET_VIDEO_CODEC}"
          echo "   Audio Codec: ${TARGET_AUDIO_CODEC}"
          echo ""
          
          NORMALIZED_FILES=""
          NEEDS_NORMALIZE=false
          
          for f in EP*.mp4; do
            if [ ! -f "$f" ]; then continue; fi
            
            CURRENT_RES="${resolutions[$f]}"
            CURRENT_SAMPLE_RATE="${audio_sample_rates[$f]}"
            CURRENT_VIDEO_CODEC="${video_codecs[$f]}"
            CURRENT_AUDIO_CODEC="${audio_codecs[$f]}"
            
            if [ "$CURRENT_RES" == "$TARGET_RES" ] && \
               [ "$CURRENT_SAMPLE_RATE" == "$TARGET_SAMPLE_RATE" ] && \
               [ "$CURRENT_VIDEO_CODEC" == "$TARGET_VIDEO_CODEC" ] && \
               [ "$CURRENT_AUDIO_CODEC" == "$TARGET_AUDIO_CODEC" ]; then
              echo "✅ Keeping: $f (matches all targets)"
              NORMALIZED_FILES="$NORMALIZED_FILES $f"
            else
              echo "⚠️ Normalizing: $f"
              echo "   Current: ${CURRENT_RES}, ${CURRENT_SAMPLE_RATE}Hz, ${CURRENT_VIDEO_CODEC}, ${CURRENT_AUDIO_CODEC}"
              echo "   Target:  ${TARGET_RES}, ${TARGET_SAMPLE_RATE}Hz, ${TARGET_VIDEO_CODEC}, ${TARGET_AUDIO_CODEC}"
              NEEDS_NORMALIZE=true
              
              EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
              EPISODE_TITLE="Episode ${EP_NUM} - ${SERIES_TITLE}"
              
              ffmpeg -i "$f" \
                -vf "scale=${TARGET_W}:${TARGET_H}:force_original_aspect_ratio=decrease,pad=${TARGET_W}:${TARGET_H}:(ow-iw)/2:(oh-ih)/2:color=black" \
                -c:v libx264 -preset veryfast -crf 23 \
                -c:a aac -b:a 128k -ar ${TARGET_SAMPLE_RATE} \
                -metadata title="$EPISODE_TITLE" \
                -metadata episode_id="$EP_NUM" \
                -metadata series="$SERIES_TITLE" \
                -metadata label="$LABEL" \
                -movflags +faststart \
                "normalized_$f" 2>/dev/null
              
              if [ -f "normalized_$f" ] && [ -s "normalized_$f" ]; then
                NORM_RES=$(mediainfo --Inform="Video;%Width%x%Height%" "normalized_$f" 2>/dev/null || echo "0x0")
                NORM_SAMPLE_RATE=$(mediainfo --Inform="Audio;%SamplingRate%" "normalized_$f" 2>/dev/null | tr -d ' ' | cut -d'/' -f1 | cut -d' ' -f1)
                
                if [ "$NORM_RES" == "$TARGET_RES" ] && \
                   [ "$NORM_SAMPLE_RATE" == "$TARGET_SAMPLE_RATE" ]; then
                  echo "✅ Normalized successfully: $f -> normalized_$f"
                  echo "   ${NORM_RES}, ${NORM_SAMPLE_RATE}Hz"
                  NORMALIZED_FILES="$NORMALIZED_FILES normalized_$f"
                else
                  echo "⚠️ Normalization verification failed, using original"
                  NORMALIZED_FILES="$NORMALIZED_FILES $f"
                fi
              else
                echo "⚠️ Normalization failed, using original"
                NORMALIZED_FILES="$NORMALIZED_FILES $f"
              fi
            fi
          done
          
          FILE_COUNT=$(echo "$NORMALIZED_FILES" | wc -w)
          echo ""
          echo "📊 Files to merge: $FILE_COUNT"
          
          if [ $FILE_COUNT -eq 0 ]; then
            echo "❌ No files to merge!"
            exit 1
          fi
          
          echo "🔍 Verifying all files match target properties..."
          ALL_MATCH=true
          VERIFIED_FILES=""
          
          for f in $NORMALIZED_FILES; do
            if [ ! -f "$f" ] || [ ! -s "$f" ]; then
              echo "⚠️ File missing or empty: $f"
              continue
            fi
            
            if ! mediainfo "$f" > /dev/null 2>&1; then
              echo "⚠️ Invalid file: $f"
              continue
            fi
            
            RES=$(mediainfo --Inform="Video;%Width%x%Height%" "$f" 2>/dev/null || echo "0x0")
            SAMPLE_RATE=$(mediainfo --Inform="Audio;%SamplingRate%" "$f" 2>/dev/null | tr -d ' ' | cut -d'/' -f1 | cut -d' ' -f1)
            
            if [ "$RES" == "$TARGET_RES" ] && [ "$SAMPLE_RATE" == "$TARGET_SAMPLE_RATE" ]; then
              echo "✅ Verified: $f (${RES}, ${SAMPLE_RATE}Hz)"
              VERIFIED_FILES="$VERIFIED_FILES $f"
            else
              echo "⚠️ Mismatch: $f (${RES}, ${SAMPLE_RATE}Hz)"
              ALL_MATCH=false
            fi
          done
          
          if [ "$ALL_MATCH" = false ]; then
            echo "❌ Some files still don't match target properties!"
            echo "🔧 Forcing re-encode of all files..."
            
            VERIFIED_FILES=""
            for f in $NORMALIZED_FILES; do
              if [ ! -f "$f" ] || [ ! -s "$f" ]; then
                continue
              fi
              
              BASE_NAME=$(basename "$f" .mp4)
              FORCED_FILE="forced_${BASE_NAME}.mp4"
              
              ffmpeg -i "$f" \
                -vf "scale=${TARGET_W}:${TARGET_H}:force_original_aspect_ratio=decrease,pad=${TARGET_W}:${TARGET_H}:(ow-iw)/2:(oh-ih)/2:color=black" \
                -c:v libx264 -preset veryfast -crf 23 \
                -c:a aac -b:a 128k -ar ${TARGET_SAMPLE_RATE} \
                -movflags +faststart \
                -metadata title="$TITLE" \
                -metadata series="$SERIES_TITLE" \
                -metadata label="$LABEL" \
                "${FORCED_FILE}" 2>/dev/null
              
              if [ -f "${FORCED_FILE}" ] && [ -s "${FORCED_FILE}" ]; then
                VERIFIED_FILES="$VERIFIED_FILES ${FORCED_FILE}"
                echo "✅ Force re-encoded: $f -> ${FORCED_FILE}"
              else
                VERIFIED_FILES="$VERIFIED_FILES $f"
                echo "⚠️ Force re-encode failed, using original: $f"
              fi
            done
          else
            VERIFIED_FILES="$NORMALIZED_FILES"
          fi
          
          MERGE_FILES_ARRAY=($VERIFIED_FILES)
          FILE_COUNT=${#MERGE_FILES_ARRAY[@]}
          
          if [ $FILE_COUNT -lt 2 ]; then
            echo "❌ Not enough valid files to merge (need at least 2)"
            exit 1
          fi
          
          echo ""
          echo "✅ All files now match target properties!"
          echo "📊 FAST MERGE: Using FFmpeg concat demuxer (no re-encoding)"
          
          TOTAL_DURATION=0
          for f in "${MERGE_FILES_ARRAY[@]}"; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null || echo "0")
              DURATION_INT=${DURATION%.*}
              if [ "$DURATION_INT" -gt 0 ]; then
                TOTAL_DURATION=$((TOTAL_DURATION + DURATION_INT))
                echo "   $f: ${DURATION_INT}s"
              fi
            fi
          done
          echo "📊 Total expected duration: ${TOTAL_DURATION} seconds ($((TOTAL_DURATION / 60)) minutes)"
          
          CONCAT_LIST="concat_list.txt"
          > $CONCAT_LIST
          
          for f in "${MERGE_FILES_ARRAY[@]}"; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              if mediainfo "$f" > /dev/null 2>&1; then
                echo "file '$f'" >> $CONCAT_LIST
                echo "✅ Added: $f ($(du -h $f | cut -f1))"
              else
                echo "⚠️ Skipping invalid file: $f"
              fi
            else
              echo "⚠️ File missing or empty: $f"
            fi
          done
          
          echo "🔄 Concatenating files with stream copy (fast)..."
          ffmpeg -f concat -safe 0 -i $CONCAT_LIST \
            -c copy \
            -movflags +faststart \
            -metadata title="$TITLE" \
            -metadata series="$SERIES_TITLE" \
            -metadata label="$LABEL" \
            -metadata year="$(date +%Y)" \
            -metadata date="$(date +%Y-%m-%d)" \
            "output.mp4" 2>/dev/null
          
          if [ -f "output.mp4" ] && [ -s "output.mp4" ]; then
            echo "✅ Fast merge successful (no re-encoding!)"
            
            MERGED_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "output.mp4" 2>/dev/null || echo "0")
            MERGED_DURATION_INT=${MERGED_DURATION%.*}
            echo "📊 Merged file duration: ${MERGED_DURATION_INT} seconds"
            
            DIFF=$((TOTAL_DURATION - MERGED_DURATION_INT))
            if [ ${DIFF#-} -gt $((TOTAL_DURATION / 20)) ] && [ $TOTAL_DURATION -gt 60 ]; then
              echo "❌ DURATION MISMATCH!"
              echo "   Expected: ${TOTAL_DURATION}s ($((TOTAL_DURATION / 60)) minutes)"
              echo "   Actual:   ${MERGED_DURATION_INT}s ($((MERGED_DURATION_INT / 60)) minutes)"
              echo "❌ Merge failed - duration mismatch!"
              echo "🔧 Falling back to re-encode merge..."
              
              ffmpeg -f concat -safe 0 -i $CONCAT_LIST \
                -c:v libx264 -preset veryfast -crf 23 \
                -c:a aac -b:a 128k -ar ${TARGET_SAMPLE_RATE} \
                -metadata title="$TITLE" \
                -metadata series="$SERIES_TITLE" \
                -metadata label="$LABEL" \
                -metadata year="$(date +%Y)" \
                -metadata date="$(date +%Y-%m-%d)" \
                -movflags +faststart \
                -threads $(nproc) \
                "output.mp4" 2>/dev/null
              
              if [ -f "output.mp4" ] && [ -s "output.mp4" ]; then
                REENCODED_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "output.mp4" 2>/dev/null || echo "0")
                REENCODED_DURATION_INT=${REENCODED_DURATION%.*}
                echo "📊 Re-encoded duration: ${REENCODED_DURATION_INT}s"
                
                DIFF=$((TOTAL_DURATION - REENCODED_DURATION_INT))
                if [ ${DIFF#-} -gt $((TOTAL_DURATION / 20)) ] && [ $TOTAL_DURATION -gt 60 ]; then
                  echo "❌ Re-encoded file also has duration mismatch!"
                  exit 1
                else
                  echo "✅ Re-encode merge successful with correct duration!"
                fi
              else
                echo "❌ Re-encode merge failed!"
                exit 1
              fi
            else
              echo "✅ Duration verified: ${MERGED_DURATION_INT}s matches expected (${TOTAL_DURATION}s)"
            fi
          else
            echo "❌ Fast merge failed!"
            exit 1
          fi
          
          if [ -f "output.mp4" ] && [ -s "output.mp4" ]; then
            echo "🖼️ Generating thumbnails..."
            
            ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
              -q:v 2 "thumb.jpg" 2>/dev/null
            
            ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
              -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
              -q:v 2 "square_thumb.jpg" 2>/dev/null
            
            rm -f normalized_*.mp4 forced_*.mp4 concat_list.txt
            
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            
            echo ""
            echo "========================================="
            echo "📊 FINAL MERGED FILE"
            echo "========================================="
            echo "📺 Series: $SERIES_TITLE"
            echo "📁 File: output.mp4"
            ls -lh output.mp4
            echo "========================================="
          else
            echo "❌ output.mp4 not created!"
            exit 1
          fi

      - name: Verify, Compress if Needed, and Fix Duration
        if: steps.merge.outputs.merge_success == 'true'
        id: verify
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔍 VERIFYING MERGED FILE"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          if [ ! -f "output.mp4" ]; then
            echo "❌ output.mp4 not found!"
            exit 1
          fi
          
          FILE_SIZE_BYTES=$(stat -c%s "output.mp4" 2>/dev/null || stat -f%z "output.mp4" 2>/dev/null || echo "0")
          FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))
          
          echo "📊 File size: ${FILE_SIZE_MB} MB"
          
          if [ $FILE_SIZE_MB -gt 1800 ]; then
            echo "⚠️ File exceeds 1.8GB (${FILE_SIZE_MB} MB)"
            echo "🔧 Compressing file..."
            
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "output.mp4" 2>/dev/null || echo "0")
            DURATION_INT=${DURATION%.*}
            
            if [ "$DURATION_INT" -gt 0 ]; then
              TARGET_SIZE_MB=1500
              TARGET_BITRATE=$((TARGET_SIZE_MB * 8 * 1024 / DURATION_INT))
              if [ $TARGET_BITRATE -lt 500 ]; then
                TARGET_BITRATE=500
              fi
              echo "📊 Target bitrate: ${TARGET_BITRATE}k"
            else
              TARGET_BITRATE=1500
            fi
            
            echo "🔧 Compressing with two-pass encoding..."
            
            ffmpeg -y -i "output.mp4" \
              -c:v libx264 -b:v ${TARGET_BITRATE}k -preset medium \
              -pass 1 -f null /dev/null 2>/dev/null
            
            ffmpeg -y -i "output.mp4" \
              -c:v libx264 -b:v ${TARGET_BITRATE}k -preset medium \
              -pass 2 \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output_compressed.mp4" 2>/dev/null
            
            rm -f ffmpeg2pass-0.log ffmpeg2pass-0.log.mbtree
            
            if [ -f "output_compressed.mp4" ] && [ -s "output_compressed.mp4" ]; then
              NEW_SIZE=$(stat -c%s "output_compressed.mp4" 2>/dev/null || stat -f%z "output_compressed.mp4" 2>/dev/null || echo "0")
              NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
              
              if [ $NEW_SIZE_MB -lt 1800 ]; then
                mv output_compressed.mp4 output.mp4
                echo "✅ File compressed! New size: ${NEW_SIZE_MB} MB"
                echo "compressed=true" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Compression didn't reduce enough (${NEW_SIZE_MB} MB), trying CRF..."
                
                ffmpeg -y -i "output.mp4" \
                  -c:v libx264 -crf 28 -preset medium \
                  -c:a aac -b:a 96k -ar 44100 \
                  -movflags +faststart \
                  -metadata title="$TITLE" \
                  -metadata series="$SERIES_TITLE" \
                  -metadata label="$LABEL" \
                  -metadata year="$(date +%Y)" \
                  -metadata date="$(date +%Y-%m-%d)" \
                  "output_compressed.mp4" 2>/dev/null
                
                if [ -f "output_compressed.mp4" ] && [ -s "output_compressed.mp4" ]; then
                  NEW_SIZE=$(stat -c%s "output_compressed.mp4" 2>/dev/null || stat -f%z "output_compressed.mp4" 2>/dev/null || echo "0")
                  NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
                  
                  if [ $NEW_SIZE_MB -lt 1800 ]; then
                    mv output_compressed.mp4 output.mp4
                    echo "✅ File compressed! New size: ${NEW_SIZE_MB} MB"
                    echo "compressed=true" >> $GITHUB_OUTPUT
                  else
                    echo "❌ Compression failed to reduce file size"
                    rm -f output_compressed.mp4
                    echo "compressed=false" >> $GITHUB_OUTPUT
                  fi
                fi
              fi
            else
              echo "❌ Compression failed"
              echo "compressed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ File size is under 1.8GB, no compression needed"
            echo "compressed=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "output.mp4" ] && [ -s "output.mp4" ]; then
            echo "🖼️ Regenerating thumbnails..."
            ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
              -q:v 2 "thumb.jpg" 2>/dev/null
            
            ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
              -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
              -q:v 2 "square_thumb.jpg" 2>/dev/null
          fi
          
          echo "🔧 Fixing duration metadata..."
          ffmpeg -i output.mp4 -c copy -map_metadata 0 -movflags +faststart output_fixed.mp4 2>/dev/null
          
          if [ -f "output_fixed.mp4" ] && [ -s "output_fixed.mp4" ]; then
            mv output_fixed.mp4 output.mp4
            echo "✅ Duration metadata fixed"
          fi
          
          if mediainfo output.mp4 > /dev/null 2>&1; then
            echo "✅ MediaInfo can read the file"
            echo ""
            mediainfo output.mp4
            echo ""
            
            DURATION=$(mediainfo --Inform="General;%Duration/String3%" output.mp4 2>/dev/null)
            FINAL_SIZE=$(stat -c%s "output.mp4" 2>/dev/null || stat -f%z "output.mp4" 2>/dev/null || echo "0")
            FINAL_SIZE_MB=$((FINAL_SIZE / 1024 / 1024))
            
            echo "📝 Duration: $DURATION"
            echo "💾 Final size: ${FINAL_SIZE_MB} MB"
            echo "✅ File is valid"
            echo "verify_success=true" >> $GITHUB_OUTPUT
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            
            if [ $FINAL_SIZE_MB -gt 2000 ]; then
              echo "❌ File exceeds 2GB (${FINAL_SIZE_MB} MB)"
              echo "   Telegram limit is 2GB!"
              exit 1
            else
              echo "✅ File size: ${FINAL_SIZE_MB} MB (under 2GB limit)"
            fi
          else
            echo "❌ MediaInfo cannot read the file!"
            echo "🔧 Attempting to repair..."
            
            ffmpeg -y -err_detect ignore_err -i output.mp4 \
              -c:v libx264 -preset veryfast -crf 23 \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output_repaired.mp4" 2>/dev/null
            
            if [ -f "output_repaired.mp4" ]; then
              REPAIR_SIZE=$(stat -c%s "output_repaired.mp4" 2>/dev/null || echo "0")
              REPAIR_SIZE_MB=$((REPAIR_SIZE / 1024 / 1024))
              if [ "$REPAIR_SIZE" -gt 1000000 ] && [ $REPAIR_SIZE_MB -lt 2000 ]; then
                mv output_repaired.mp4 output.mp4
                echo "✅ File repaired!"
                echo "verify_success=true" >> $GITHUB_OUTPUT
                echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
              else
                echo "❌ Repair failed or file still too large"
                rm -f output_repaired.mp4
                exit 1
              fi
            else
              echo "❌ Repair failed"
              exit 1
            fi
          fi

      # =============================================
      # UPLOAD STEPS - WITH CUSTOM FAST UPLOAD
      # =============================================
      
      - name: Start Merged Upload (Background with Fast Upload)
        if: steps.verify.outputs.verify_success == 'true'
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TG_MERGED_CHAT_ID: ${{ secrets.TELEGRAM_MERGED_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TG_MERGED_NAME: ${{ secrets.TELEGRAM_MERGED_NAME }}
          TG_MERGED_INVITE_LINK: ${{ secrets.TELEGRAM_MERGED_INVITE_LINK }}
          MERGED_PATH: ${{ env.merged_file_path }}
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
