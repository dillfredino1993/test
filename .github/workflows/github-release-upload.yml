name: GitHub Telegram & Media Pipeline

on:
  repository_dispatch:
    types: [github_release_upload]

# ONLY ONE WORKFLOW RUN AT A TIME
concurrency:
  group: media-pipeline-processor
  cancel-in-progress: false
  queue: max

# Add permissions for deleting workflow runs
permissions:
  actions: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📋 Series Information & Setup
        run: |
          echo "========================================="
          echo "📋 SERIES INFORMATION"
          echo "========================================="
          
          # Extract series information from payload
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Unknown Series' }}"
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          EPISODE_COUNT="${{ github.event.client_payload.episode_count || 'Unknown' }}"
          
          echo "📺 Series Title: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "📊 Episode Count: $EPISODE_COUNT"
          echo "⏰ Started at: $(date)"
          echo "========================================="
          
          # Store for later use
          echo "series_title=$SERIES" >> $GITHUB_ENV
          echo "label=$LABEL" >> $GITHUB_ENV
          
          # Create a file to track workflow progress
          echo "STARTED" > workflow_status.txt

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Tools & Dependencies
        timeout-minutes: 5
        id: install_tools
        run: |
          echo "========================================="
          echo "🔧 INSTALLING TOOLS"
          echo "========================================="
          
          # Prevent interactive debconf prompts and disable needrestart hangs
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          export NEEDRESTART_SUSPEND=1
          sudo rm -f /etc/apt/apt.conf.d/99needrestart /var/lib/man-db/auto-update 2>/dev/null || true
          
          APT_FLAGS="-y -qq --no-install-recommends -o DPkg::Lock::Timeout=120 -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          
          echo "📦 Updating apt cache..."
          sudo apt-get update -qq -o Acquire::ForceIPv4=true -o Acquire::Retries=3 || true
          
          echo "📦 Installing system packages (aria2, mkvtoolnix, mediainfo, exiftool, bc)..."
          sudo apt-get install $APT_FLAGS ffmpeg aria2 mkvtoolnix mediainfo libimage-exiftool-perl bc jq || {
            echo "⚠️ Retrying package install individually..."
            for pkg in ffmpeg aria2 mkvtoolnix mediainfo libimage-exiftool-perl bc jq; do
              sudo apt-get install $APT_FLAGS "$pkg" || echo "⚠️ Warning: $pkg install failed"
            done
          }

          echo "📦 Upgrading pip and installing Python packages..."
          python3 -m pip install --no-cache-dir --upgrade pip
          python3 -m pip install --no-cache-dir \
            "yt-dlp[default,curl-cffi]" \
            "curl_cffi" \
            "telethon==1.34.0" \
            "requests" \
            "aiohttp" \
            "python-socks[asyncio]" \
            "qrcode"

          echo "🔍 Verifying installed tools:"
          command -v ffmpeg &>/dev/null && echo "✅ ffmpeg: $(which ffmpeg)" || echo "⚠️ ffmpeg missing"
          command -v aria2c &>/dev/null && echo "✅ aria2c: $(which aria2c)" || echo "⚠️ aria2c missing"
          command -v mkvmerge &>/dev/null && echo "✅ mkvmerge: $(which mkvmerge)" || echo "⚠️ mkvmerge missing"
          command -v mediainfo &>/dev/null && echo "✅ mediainfo: $(which mediainfo)" || echo "⚠️ mediainfo missing"
          python3 -c "import telethon; print(f'✅ Telethon {telethon.__version__}')" || echo "⚠️ Telethon missing"
          python3 -c "import yt_dlp, curl_cffi; print('✅ yt-dlp & curl_cffi ready')" || echo "⚠️ yt-dlp / curl_cffi missing"
          echo "========================================="
          echo "✅ INSTALLATION COMPLETE"
          echo "========================================="
          
          # Show versions
          echo "📊 Tool versions:"
          ffmpeg -version | head -1 || echo "⚠️ ffmpeg not found"
          aria2c --version | head -1 || echo "⚠️ aria2 not found"
          mkvmerge --version | head -1 || echo "⚠️ mkvmerge not found"
          python3 --version || echo "⚠️ python3 not found"
          python3 -c "import telethon; print(f'Telethon {telethon.__version__}')" 2>/dev/null || echo "⚠️ Telethon not found"
          echo "========================================="
          
          echo "INSTALLED" > ../tools_installed.txt

      - name: Compute Dynamic Formatted Output Filename & Label
        id: fname
        run: |
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Series' }}"
          
          echo "========================================="
          echo "📝 COMPUTING FILENAME"
          echo "========================================="
          echo "📺 Series: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "========================================="
          
          CLEAN_LABEL=$(echo "$LABEL" | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          CLEAN_SERIES_TITLE=$(echo "$SERIES" | sed -e 's/[\/:*?"<>|]/_/g' -e 's/^ *//' -e 's/ *$//')
          CLEAN_SERIES_TAG=$(echo "$CLEAN_SERIES_TITLE" | tr ' ' '_')
          
          DATE_STR=$(date +'%Y-%m-%d')
          
          TAG_NAME="${DATE_STR}-${CLEAN_LABEL}-${CLEAN_SERIES_TAG}"
          FORMATTED_TITLE="[${DATE_STR}]-[${CLEAN_LABEL}]-${CLEAN_SERIES_TITLE}"
          
          # Create a safe output filename for GitHub: {date}_{label}_{series_title}.mp4
          SAFE_SERIES_NAME=$(echo "$CLEAN_SERIES_TITLE" | tr ' ' '_' | tr -d '[:punct:]' | tr '[:upper:]' '[:lower:]')
          SAFE_LABEL=$(echo "$CLEAN_LABEL" | tr '[:upper:]' '[:lower:]')
          OUTPUT_FILENAME="${DATE_STR}_${SAFE_LABEL}_${SAFE_SERIES_NAME}.mp4"
          
          echo "📄 Formatted Title: $FORMATTED_TITLE"
          echo "🏷️  Tag Name: $TAG_NAME"
          echo "📁 Output Filename: $OUTPUT_FILENAME"
          echo "========================================="
          
          echo "formatted_title=${FORMATTED_TITLE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "series_title=${CLEAN_SERIES_TITLE}" >> $GITHUB_OUTPUT
          echo "clean_label=${CLEAN_LABEL}" >> $GITHUB_OUTPUT
          echo "output_filename=${OUTPUT_FILENAME}" >> $GITHUB_OUTPUT

      - name: Parse URLs with jq (Clean & Uncorrupted)
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "========================================="
          echo "📋 PARSING URLs"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          mkdir -p downloads && cd downloads
          
          # Extract URLs cleanly: remove \r carriage returns and trim whitespace
          echo "$CLIENT_PAYLOAD" | tr -d '\r' | jq -r '
            (.episodes[]?.url // .video_urls[]? // .video_url // .url // empty)
            | tostring | gsub("^\\s+|\\s+$"; "")
          ' > urls.txt
          
          # Remove empty lines
          sed -i '/^$/d' urls.txt
          
          echo "========================================="
          echo "📋 URLs to download:"
          cat urls.txt
          echo "========================================="
          
          echo "total_episodes=$(cat urls.txt | wc -l)" >> $GITHUB_ENV
          
          if [ ! -s urls.txt ]; then
            echo "❌ No valid URLs found!"
            exit 1
          fi
          
          echo "✅ Found $(cat urls.txt | wc -l) URLs"

      - name: Download All Episodes First
        timeout-minutes: 120
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ github.event.client_payload.label || 'NONE' }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📥 DOWNLOADING ALL EPISODES"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $(cat urls.txt | wc -l)"
          echo "========================================="
          
          TOTAL_EPISODES=$(cat urls.txt | wc -l)
          EP_INDEX=1
          FAILED_DOWNLOADS=""
          
          # Store URLs in array for redownload if needed
          declare -a URL_ARRAY
          while IFS= read -r line; do
            URL_ARRAY+=("$line")
          done < urls.txt
          
          while IFS= read -u 3 -r URL || [ -n "$URL" ]; do
            URL=$(echo "$URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$URL" ]; then continue; fi
            
            EP_NUM=$(printf "%02d" $EP_INDEX)
            OUT_FILE="EP${EP_NUM}.mp4"
            FIXED_FILE="EP${EP_NUM}_fixed.mp4"
            
            echo "========================================="
            echo "📥 Downloading Episode $EP_INDEX/$TOTAL_EPISODES"
            echo "📎 URL: $URL"
            echo "💾 Output: $OUT_FILE"
            echo "========================================="
            
            # Clean up any existing files
            rm -f "$OUT_FILE" "$FIXED_FILE" 2>/dev/null
            
            DOWNLOAD_SUCCESS=false
            
            # ------------------------------------------------------------
            # CHECK URL TYPE: HLS/m3u8 OR DIRECT VIDEO
            # ------------------------------------------------------------
            if [[ "$URL" == *".m3u8"* ]] || [[ "$URL" == *".m3u"* ]] || [[ "$URL" == *"master.m3u8"* ]]; then
              echo "📺 HLS STREAM DETECTED - Using yt-dlp"
              
              # Use yt-dlp for HLS streams
              yt-dlp \
                --extractor-args "generic:impersonate" \
                --impersonate chrome \
                -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best[ext=mp4]/best" \
                --merge-output-format mp4 \
                --hls-use-mpegts \
                --no-progress \
                --no-warnings \
                --quiet \
                --geo-bypass \
                --no-check-certificates \
                --socket-timeout 300 \
                --retries 10 \
                --fragment-retries 10 \
                -o "$OUT_FILE" \
                "$URL" 2>/dev/null
              
              echo "✅ yt-dlp download complete, checking file..."
              
            else
              # ------------------------------------------------------------
              # DIRECT VIDEO URL - Use aria2c for speed
              # ------------------------------------------------------------
              echo "🎬 DIRECT VIDEO DETECTED - Using aria2c for fast download"
              
              aria2c -x 16 -s 16 -k 1M --continue=true \
                --console-log-level=error \
                --max-connection-per-server=16 \
                --split=16 \
                --min-split-size=1M \
                --max-overall-download-limit=0 \
                --max-download-limit=0 \
                -o "$OUT_FILE" "$URL" < /dev/null 2>/dev/null
              
              echo "✅ aria2c download complete, checking file..."
            fi
            
            # ------------------------------------------------------------
            # CHECK AND FIX MPEG-TS CONTAINER IMMEDIATELY
            # ------------------------------------------------------------
            if [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
              
              if [ "$FILE_SIZE" -gt 100000 ]; then
                # Check if file needs fixup (MPEG-TS container)
                NEEDS_FIXUP=false
                
                # Check container format
                CONTAINER=$(ffprobe -v error -show_entries format=format_name -of default=noprint_wrappers=1:nokey=1 "$OUT_FILE" 2>/dev/null | head -1)
                if [[ "$CONTAINER" == *"mpegts"* ]] || [[ "$CONTAINER" == *"mpeg"* ]]; then
                  NEEDS_FIXUP=true
                  echo "🔄 Detected MPEG-TS container, applying fixup..."
                fi
                
                # Check if file has video stream
                HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                if [ -z "$HAS_VIDEO" ] || [ "$HAS_VIDEO" != "video" ]; then
                  NEEDS_FIXUP=true
                  echo "🔄 File has no video stream, attempting fixup..."
                fi
                
                # Also check for MPEG-TS in the file format string
                if [ "$NEEDS_FIXUP" != true ]; then
                  FORMAT_INFO=$(ffprobe -v error -show_entries format=format_long_name -of default=noprint_wrappers=1:nokey=1 "$OUT_FILE" 2>/dev/null | head -1)
                  if [[ "$FORMAT_INFO" == *"MPEG-TS"* ]] || [[ "$FORMAT_INFO" == *"MPEGTS"* ]]; then
                    NEEDS_FIXUP=true
                    echo "🔄 Detected MPEG-TS format, applying fixup..."
                  fi
                fi
                
                # Apply fixup if needed - DO THIS BEFORE ANY OTHER RETRY
                if [ "$NEEDS_FIXUP" = true ]; then
                  echo "🔧 Fixing MPEG-TS to MP4 container (re-encoding with veryfast preset)..."
                  
                  # Use ffmpeg to fix the file
                  ffmpeg -y -err_detect ignore_err -i "$OUT_FILE" \
                    -c:v libx264 -preset veryfast -crf 23 \
                    -c:a aac -b:a 128k -ar 44100 \
                    -movflags +faststart \
                    -metadata title="Episode $EP_INDEX - $SERIES_TITLE" \
                    -metadata episode_id="$EP_INDEX" \
                    -metadata series="$SERIES_TITLE" \
                    -metadata label="$LABEL" \
                    "$FIXED_FILE" 2>/dev/null
                  
                  if [ -f "$FIXED_FILE" ] && [ -s "$FIXED_FILE" ]; then
                    # Verify the fixed file has video
                    HAS_VIDEO_FIXED=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$FIXED_FILE" 2>/dev/null)
                    if [ -n "$HAS_VIDEO_FIXED" ] && [ "$HAS_VIDEO_FIXED" = "video" ]; then
                      # Check fixed file size
                      FIXED_SIZE=$(stat -c%s "$FIXED_FILE" 2>/dev/null || stat -f%z "$FIXED_FILE" 2>/dev/null || echo "0")
                      if [ "$FIXED_SIZE" -gt 100000 ]; then
                        mv "$FIXED_FILE" "$OUT_FILE"
                        DOWNLOAD_SUCCESS=true
                        FIXED_SIZE_MB=$((FIXED_SIZE / 1024 / 1024))
                        echo "✅ Fixup successful: $OUT_FILE (${FIXED_SIZE_MB}MB)"
                        
                        # Show video info
                        W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                        H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                        echo "✅ Episode $EP_INDEX ready: $OUT_FILE (${FIXED_SIZE_MB}MB, ${W}x${H})"
                      else
                        echo "⚠️ Fixed file too small (${FIXED_SIZE} bytes), keeping original"
                        rm -f "$FIXED_FILE" 2>/dev/null
                        # Try to use original file
                        HAS_VIDEO_ORIG=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                        if [ -n "$HAS_VIDEO_ORIG" ] && [ "$HAS_VIDEO_ORIG" = "video" ]; then
                          DOWNLOAD_SUCCESS=true
                          echo "✅ Using original file: $OUT_FILE"
                        fi
                      fi
                    else
                      echo "⚠️ Fixup produced file without video, keeping original"
                      rm -f "$FIXED_FILE" 2>/dev/null
                      # Try to use original file
                      HAS_VIDEO_ORIG=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                      if [ -n "$HAS_VIDEO_ORIG" ] && [ "$HAS_VIDEO_ORIG" = "video" ]; then
                        DOWNLOAD_SUCCESS=true
                        echo "✅ Using original file: $OUT_FILE"
                      fi
                    fi
                  else
                    echo "⚠️ Fixup failed, using original file"
                    rm -f "$FIXED_FILE" 2>/dev/null
                    # Try to use original file
                    HAS_VIDEO_ORIG=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                    if [ -n "$HAS_VIDEO_ORIG" ] && [ "$HAS_VIDEO_ORIG" = "video" ]; then
                      DOWNLOAD_SUCCESS=true
                      echo "✅ Using original file: $OUT_FILE"
                    fi
                  fi
                else
                  # No fixup needed, file is good
                  HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                  if [ -n "$HAS_VIDEO" ] && [ "$HAS_VIDEO" = "video" ]; then
                    DOWNLOAD_SUCCESS=true
                    FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
                    W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                    H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                    echo "✅ Episode $EP_INDEX ready: $OUT_FILE (${FILE_SIZE_MB}MB, ${W}x${H})"
                  fi
                fi
              else
                echo "⚠️ File too small (${FILE_SIZE} bytes) - likely corrupt"
                rm -f "$OUT_FILE" 2>/dev/null
              fi
            fi
            
            # ------------------------------------------------------------
            # FALLBACK: If fixup didn't work or file is still bad, try yt-dlp with external downloader
            # ------------------------------------------------------------
            if [ "$DOWNLOAD_SUCCESS" != true ]; then
              echo "⚠️ Primary download/fixup failed. Trying yt-dlp with aria2c external..."
              
              rm -f "$OUT_FILE" 2>/dev/null
              
              yt-dlp \
                --extractor-args "generic:impersonate" \
                --impersonate chrome \
                -f "bestvideo+bestaudio/best" \
                --merge-output-format mp4 \
                --hls-use-mpegts \
                --external-downloader aria2c \
                --external-downloader-args "-x 16 -s 16 -k 1M" \
                --no-progress \
                --no-warnings \
                --quiet \
                --geo-bypass \
                -o "$OUT_FILE" \
                "$URL" 2>/dev/null
              
              # Check the fallback download
              if [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
                FILE_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
                if [ "$FILE_SIZE" -gt 100000 ]; then
                  HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                  if [ -n "$HAS_VIDEO" ] && [ "$HAS_VIDEO" = "video" ]; then
                    DOWNLOAD_SUCCESS=true
                    echo "✅ Downloaded with yt-dlp+aria2c: $OUT_FILE"
                  else
                    # Try one more fixup on the fallback download
                    echo "🔄 Fallback download has no video, trying fixup..."
                    ffmpeg -y -err_detect ignore_err -i "$OUT_FILE" \
                      -c:v libx264 -preset veryfast -crf 23 \
                      -c:a aac -b:a 128k -ar 44100 \
                      -movflags +faststart \
                      -metadata title="Episode $EP_INDEX - $SERIES_TITLE" \
                      -metadata episode_id="$EP_INDEX" \
                      -metadata series="$SERIES_TITLE" \
                      -metadata label="$LABEL" \
                      "$FIXED_FILE" 2>/dev/null
                    
                    if [ -f "$FIXED_FILE" ] && [ -s "$FIXED_FILE" ]; then
                      HAS_VIDEO_FIXED=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$FIXED_FILE" 2>/dev/null)
                      if [ -n "$HAS_VIDEO_FIXED" ] && [ "$HAS_VIDEO_FIXED" = "video" ]; then
                        mv "$FIXED_FILE" "$OUT_FILE"
                        DOWNLOAD_SUCCESS=true
                        echo "✅ Fallback fixup successful: $OUT_FILE"
                      fi
                    fi
                    rm -f "$FIXED_FILE" 2>/dev/null
                  fi
                fi
              fi
            fi
            
            # ------------------------------------------------------------
            # CREATE VIDEO FROM AUDIO IF ONLY AUDIO IS AVAILABLE (ULTIMATE FALLBACK)
            # ------------------------------------------------------------
            if [ "$DOWNLOAD_SUCCESS" != true ]; then
              # Check if we have a file with audio but no video
              if [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
                FILE_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
                if [ "$FILE_SIZE" -gt 100000 ]; then
                  HAS_AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$OUT_FILE" 2>/dev/null)
                  
                  if [ -n "$HAS_AUDIO" ] && [ "$HAS_AUDIO" = "audio" ]; then
                    echo "🎵 File has audio but no video. Creating video with static image..."
                    
                    DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUT_FILE" 2>/dev/null || echo "30")
                    
                    # Create a video with black background and the audio
                    TEMP_VIDEO="EP${EP_NUM}_video_temp.mp4"
                    ffmpeg -y -f lavfi -i color=black:size=1280x720:duration="$DURATION" \
                      -i "$OUT_FILE" \
                      -c:v libx264 -preset veryfast -crf 23 \
                      -c:a aac -b:a 128k -ar 44100 \
                      -shortest \
                      -movflags +faststart \
                      "$TEMP_VIDEO" 2>/dev/null
                    
                    if [ -f "$TEMP_VIDEO" ] && [ -s "$TEMP_VIDEO" ]; then
                      mv "$TEMP_VIDEO" "$OUT_FILE"
                      DOWNLOAD_SUCCESS=true
                      echo "✅ Created video from audio for Episode $EP_INDEX"
                    else
                      echo "❌ Failed to create video from audio!"
                    fi
                  else
                    echo "❌ File has neither video nor audio!"
                  fi
                else
                  echo "❌ File too small (${FILE_SIZE} bytes) - likely corrupt"
                fi
              else
                echo "❌ No file downloaded at all!"
              fi
            fi
            
            # ------------------------------------------------------------
            # FINAL VERIFICATION
            # ------------------------------------------------------------
            if [ "$DOWNLOAD_SUCCESS" = true ] && [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
              # Final verification
              FINAL_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
              FINAL_SIZE_MB=$((FINAL_SIZE / 1024 / 1024))
              
              echo "✅ Episode $EP_INDEX ready: $OUT_FILE (${FINAL_SIZE_MB}MB)"
              
              # Quick verify with mediainfo
              if mediainfo "$OUT_FILE" 2>/dev/null | grep -q "Video"; then
                echo "   📹 Video track confirmed"
              else
                echo "   ⚠️ Video track not detected by mediainfo"
              fi
              
              if mediainfo "$OUT_FILE" 2>/dev/null | grep -q "Audio"; then
                echo "   🔊 Audio track confirmed"
              else
                echo "   ⚠️ Audio track not detected by mediainfo"
              fi
            else
              echo "❌ Download failed for Episode $EP_INDEX"
              FAILED_DOWNLOADS="$FAILED_DOWNLOADS $EP_NUM"
              rm -f "$OUT_FILE" 2>/dev/null
            fi
            
            # Clean up temp files
            rm -f "$FIXED_FILE" 2>/dev/null
            
            EP_INDEX=$((EP_INDEX + 1))
            echo ""
          done 3< urls.txt
          
          echo "========================================="
          echo "📊 DOWNLOAD SUMMARY"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Expected: $TOTAL_EPISODES episodes"
          
          TOTAL_FILES=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          echo "✅ Downloaded: $TOTAL_FILES/$TOTAL_EPISODES episodes"
          
          if [ -n "$FAILED_DOWNLOADS" ]; then
            echo "❌ FAILED DOWNLOADS: $FAILED_DOWNLOADS"
            echo "❌ Not all episodes downloaded successfully!"
            echo "   This is an all-or-nothing workflow. Exiting."
            exit 1
          fi
          
          if [ "$TOTAL_FILES" -ne "$TOTAL_EPISODES" ]; then
            echo "❌ Expected $TOTAL_EPISODES episodes, but only $TOTAL_FILES downloaded!"
            echo "❌ Exiting - all episodes required."
            exit 1
          fi
          
          # Final verification of all files
          echo ""
          echo "🔍 Final verification of all episodes..."
          ALL_GOOD=true
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              # Check file size first
              FILE_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "0")
              if [ "$FILE_SIZE" -lt 100000 ]; then
                echo "❌ $f is too small (${FILE_SIZE} bytes) - likely corrupt!"
                ALL_GOOD=false
                continue
              fi
              
              HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$f" 2>/dev/null)
              if [ -z "$HAS_VIDEO" ] || [ "$HAS_VIDEO" != "video" ]; then
                echo "❌ $f has no video stream!"
                ALL_GOOD=false
              else
                W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f" 2>/dev/null)
                H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f" 2>/dev/null)
                
                # Check for invalid resolution
                if [ -z "$W" ] || [ -z "$H" ] || [ "$W" = "0" ] || [ "$H" = "0" ]; then
                  echo "❌ $f has invalid resolution!"
                  ALL_GOOD=false
                else
                  echo "✅ $f: ${W}x${H}"
                fi
              fi
            fi
          done
          
          if [ "$ALL_GOOD" != true ]; then
            echo "❌ Some episodes are missing video streams or are corrupt!"
            echo "❌ Exiting - all episodes must have valid video."
            exit 1
          fi
          
          echo "✅ All $TOTAL_EPISODES episodes downloaded and verified successfully!"
          echo "========================================="

      - name: Compress Episodes Larger Than 80MB (Very Fast Preset)
        timeout-minutes: 120
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ github.event.client_payload.label || 'NONE' }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔧 COMPRESSING EPISODES > 80MB"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "⚡ Using VERY FAST compression preset"
          echo "========================================="
          
          # Create fast compression script
          cat > fast_compress.py << 'EOFCOMPRESS'
          import os
          import sys
          import subprocess
          import shutil
          import json
          import time
          
          def get_video_info(file_path):
              """Get video duration, width, height using ffprobe"""
              try:
                  cmd = [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-show_entries", "stream=width,height,codec_name",
                      "-of", "json",
                      file_path
                  ]
                  result = subprocess.check_output(cmd, text=True)
                  data = json.loads(result)
                  
                  duration = float(data.get('format', {}).get('duration', 0))
                  
                  width, height = 1280, 720
                  for stream in data.get('streams', []):
                      if stream.get('codec_type') == 'video':
                          width = int(stream.get('width', 1280))
                          height = int(stream.get('height', 720))
                          break
                  
                  return duration, width, height
              except:
                  return 0, 1280, 720
          
          def compress_with_veryfast(file_path, target_size_mb=80):
              """
              Compress video using FFmpeg with VERY FAST preset
              This prioritizes speed over compression efficiency
              """
              print(f"  ⚡ Compressing with VERY FAST preset...")
              
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"  📊 Original size: {file_size_mb:.1f}MB")
              
              if file_size_mb <= target_size_mb:
                  print(f"  ✅ File already under {target_size_mb}MB, skipping compression")
                  return True
              
              # Get video info
              duration, width, height = get_video_info(file_path)
              print(f"  📊 Duration: {duration:.1f}s, Resolution: {width}x{height}")
              
              # Calculate target bitrate for target size
              if duration > 0:
                  target_bitrate = (target_size_mb * 8 * 1024) / duration
                  target_bitrate = min(max(target_bitrate, 500), 2000)
              else:
                  target_bitrate = 1000
              
              print(f"  📊 Target bitrate: {int(target_bitrate)}kbps")
              
              base_name = os.path.splitext(file_path)[0]
              temp_file = f"{base_name}_fast.mp4"
              
              # Use VERY FAST preset for maximum speed
              cmd = [
                  "ffmpeg", "-y",
                  "-i", file_path,
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-b:v", f"{int(target_bitrate)}k",
                  "-maxrate", f"{int(target_bitrate * 1.5)}k",
                  "-bufsize", f"{int(target_bitrate * 2)}k",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ar", "44100",
                  "-movflags", "+faststart",
                  "-threads", str(os.cpu_count() or 2),
                  temp_file
              ]
              
              try:
                  print(f"  🔄 Encoding...")
                  start_time = time.time()
                  
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
                  
                  elapsed = time.time() - start_time
                  print(f"  ⏱️  Encoding time: {elapsed:.1f}s")
                  
                  if result.returncode == 0 and os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                      new_size_mb = os.path.getsize(temp_file) / (1024 * 1024)
                      print(f"  ✅ Compressed: {new_size_mb:.1f}MB ({file_size_mb:.1f}MB -> {new_size_mb:.1f}MB)")
                      
                      if new_size_mb <= target_size_mb * 1.1:
                          os.replace(temp_file, file_path)
                          return True
                      else:
                          print(f"  ⚠️ Still too large: {new_size_mb:.1f}MB")
                          
                          # Try even more aggressive compression
                          print(f"  🔄 Trying ULTRA FAST with higher CRF...")
                          temp_file2 = f"{base_name}_ultrafast.mp4"
                          
                          cmd2 = [
                              "ffmpeg", "-y",
                              "-i", file_path,
                              "-c:v", "libx264",
                              "-preset", "ultrafast",
                              "-crf", "28",
                              "-c:a", "aac",
                              "-b:a", "96k",
                              "-ar", "44100",
                              "-movflags", "+faststart",
                              "-threads", str(os.cpu_count() or 2),
                              temp_file2
                          ]
                          
                          result2 = subprocess.run(cmd2, capture_output=True, text=True, timeout=300)
                          
                          if result2.returncode == 0 and os.path.exists(temp_file2) and os.path.getsize(temp_file2) > 0:
                              new_size_mb2 = os.path.getsize(temp_file2) / (1024 * 1024)
                              print(f"  ✅ UltraFast compressed: {new_size_mb2:.1f}MB")
                              
                              if new_size_mb2 < new_size_mb:
                                  os.replace(temp_file2, file_path)
                                  return True
                              else:
                                  os.remove(temp_file2)
                          
                          os.remove(temp_file)
                          return False
                  else:
                      print(f"  ❌ Compression failed: {result.stderr[:200]}")
                      return False
                      
              except subprocess.TimeoutExpired:
                  print(f"  ❌ Compression timeout")
                  return False
              except Exception as e:
                  print(f"  ❌ Compression error: {e}")
                  return False
              finally:
                  # Cleanup temp files
                  for f in [temp_file, f"{base_name}_ultrafast.mp4"]:
                      if os.path.exists(f):
                          try: os.remove(f)
                          except: pass
              
              return False
          
          def process_episode(file_path, target_size_mb=80):
              """Process episode with fast compression"""
              if not os.path.exists(file_path):
                  print(f"❌ File not found: {file_path}")
                  return False
              
              return compress_with_veryfast(file_path, target_size_mb)
          
          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  print("Usage: python fast_compress.py <file_path> [target_size_mb]")
                  sys.exit(1)
              
              file_path = sys.argv[1]
              target_size = int(sys.argv[2]) if len(sys.argv) > 2 else 80
              
              success = process_episode(file_path, target_size)
              sys.exit(0 if success else 1)
          EOFCOMPRESS
          
          # Get list of all episodes sorted numerically
          EPISODE_FILES=()
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              EP_NUM=$(echo "$f" | grep -oE '[0-9]+' | head -1)
              if [ -n "$EP_NUM" ]; then
                EPISODE_FILES+=("$EP_NUM:$f")
              fi
            fi
          done
          
          # Sort by episode number numerically
          IFS=$'\n' SORTED_EPISODES=($(sort -t: -k1 -n <<<"${EPISODE_FILES[*]}"))
          
          TOTAL_EPISODES=${#SORTED_EPISODES[@]}
          COMPRESSED_COUNT=0
          FAILED_COMPRESSIONS=""
          
          echo "📊 Checking episode sizes..."
          echo ""
          
          for entry in "${SORTED_EPISODES[@]}"; do
            f="${entry#*:}"
            if [ ! -f "$f" ]; then continue; fi
            
            FILE_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "0")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            echo "📹 $f: ${FILE_SIZE_MB}MB"
            
            if [ $FILE_SIZE_MB -gt 80 ]; then
              echo "⚠️  $f exceeds 80MB, compressing..."
              
              # Add metadata before compression
              EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
              EPISODE_TITLE="Episode ${EP_NUM} - ${SERIES_TITLE}"
              
              # Compress with very fast preset
              if python3 fast_compress.py "$f" 80 < /dev/null; then
                COMPRESSED_COUNT=$((COMPRESSED_COUNT + 1))
                NEW_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "0")
                NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
                echo "✅ $f compressed: ${NEW_SIZE_MB}MB"
              else
                echo "❌ Failed to compress $f"
                FAILED_COMPRESSIONS="$FAILED_COMPRESSIONS $f"
              fi
            else
              echo "✅ $f already under 80MB, skipping compression"
            fi
            echo ""
          done
          
          echo "========================================="
          echo "📊 COMPRESSION SUMMARY"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $TOTAL_EPISODES"
          echo "📊 Compressed: $COMPRESSED_COUNT episodes"
          
          if [ -n "$FAILED_COMPRESSIONS" ]; then
            echo "❌ FAILED COMPRESSIONS: $FAILED_COMPRESSIONS"
            echo "❌ Not all episodes compressed successfully!"
            echo "   This is an all-or-nothing workflow. Exiting."
            exit 1
          fi
          
          echo "✅ All episodes processed successfully!"
          echo "========================================="
          
          # Show final file sizes
          echo ""
          echo "📊 Final episode sizes:"
          for entry in "${SORTED_EPISODES[@]}"; do
            f="${entry#*:}"
            if [ -f "$f" ]; then
              SIZE_MB=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null | awk '{print $1/1024/1024}')
              printf "   %-10s: %.1f MB\n" "$f" "$SIZE_MB"
            fi
          done
          echo ""

      - name: Smart Merge Episodes with mkvmerge --append-to
        id: merge
        timeout-minutes: 120
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔗 MERGING EPISODES WITH MKVMERGE"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          # Sort episodes numerically
          EPISODE_FILES=()
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              EP_NUM=$(echo "$f" | grep -oE '[0-9]+' | head -1)
              if [ -n "$EP_NUM" ]; then
                EPISODE_FILES+=("$EP_NUM:$f")
              fi
            fi
          done
          
          # Sort by episode number numerically
          IFS=$'\n' SORTED_EPISODES=($(sort -t: -k1 -n <<<"${EPISODE_FILES[*]}"))
          
          # Extract just filenames in correct order
          SORTED_FILES=()
          for entry in "${SORTED_EPISODES[@]}"; do
            filename="${entry#*:}"
            SORTED_FILES+=("$filename")
          done
          
          EP_COUNT=${#SORTED_FILES[@]}
          
          echo "📊 Found $EP_COUNT episodes to merge (sorted numerically)"
          
          # Show first 5 and last 5 for verification
          echo "📋 First 5 episodes:"
          for i in 0 1 2 3 4; do
            if [ $i -lt $EP_COUNT ]; then
              echo "   ${SORTED_FILES[$i]}"
            fi
          done
          echo "📋 Last 5 episodes:"
          for i in $(seq $((EP_COUNT - 5)) $((EP_COUNT - 1))); do
            if [ $i -ge 0 ] && [ $i -lt $EP_COUNT ]; then
              echo "   ${SORTED_FILES[$i]}"
            fi
          done
          
          if [ "$EP_COUNT" -eq 0 ]; then
            echo "❌ No episodes to merge!"
            exit 1
          fi
          
          OUTPUT_FILE="${{ steps.fname.outputs.output_filename }}"
          
          if [ "$EP_COUNT" -eq 1 ]; then
            echo "📦 Only 1 episode - copying to output"
            SINGLE_FILE="${SORTED_FILES[0]}"
            cp "$SINGLE_FILE" "$OUTPUT_FILE"
            echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Verify all files have video streams
          echo "🔍 Checking all files for video streams..."
          NEEDS_REDOWNLOAD=false
          REDOWNLOAD_LIST=""
          
          # Calculate total duration first
          TOTAL_DURATION=0
          
          for f in "${SORTED_FILES[@]}"; do
            if [ ! -f "$f" ]; then continue; fi
            
            # Get duration for this file
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null || echo "0")
            DURATION_INT=${DURATION%.*}
            if [ "$DURATION_INT" -gt 0 ]; then
              TOTAL_DURATION=$((TOTAL_DURATION + DURATION_INT))
            fi
            
            HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$f" 2>/dev/null)
            
            if [ -z "$HAS_VIDEO" ] || [ "$HAS_VIDEO" != "video" ]; then
              echo "⚠️ $f has no video stream!"
              EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
              EP_NUM_CLEAN=$(echo "$EP_NUM" | sed 's/^0*//')
              REDOWNLOAD_LIST="$REDOWNLOAD_LIST $EP_NUM_CLEAN"
              NEEDS_REDOWNLOAD=true
            else
              WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f" 2>/dev/null)
              HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f" 2>/dev/null)
              
              if [ -z "$WIDTH" ] || [ "$WIDTH" = "0" ] || [ -z "$HEIGHT" ] || [ "$HEIGHT" = "0" ]; then
                echo "⚠️ $f has video but invalid resolution (${WIDTH}x${HEIGHT})!"
                EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
                EP_NUM_CLEAN=$(echo "$EP_NUM" | sed 's/^0*//')
                REDOWNLOAD_LIST="$REDOWNLOAD_LIST $EP_NUM_CLEAN"
                NEEDS_REDOWNLOAD=true
              else
                echo "✅ $f: ${WIDTH}x${HEIGHT} video stream OK"
              fi
            fi
          done
          
          echo "📊 Total expected duration: ${TOTAL_DURATION} seconds ($((TOTAL_DURATION / 60)) minutes)"
          
          # Redownload episodes that need it
          if [ "$NEEDS_REDOWNLOAD" = true ]; then
            echo ""
            echo "🔄 Redownloading episodes with yt-dlp to ensure proper video..."
            
            mapfile -t URL_ARRAY < urls.txt
            
            for EP_NUM_CLEAN in $REDOWNLOAD_LIST; do
              EP_NUM_FORMATTED=$(printf "%02d" "$EP_NUM_CLEAN" 2>/dev/null || echo "$EP_NUM_CLEAN")
              FILE="EP${EP_NUM_FORMATTED}.mp4"
              URL_INDEX=$((EP_NUM_CLEAN - 1))
              
              if [ $URL_INDEX -ge 0 ] && [ $URL_INDEX -lt ${#URL_ARRAY[@]} ]; then
                URL="${URL_ARRAY[$URL_INDEX]}"
                echo ""
                echo "🔄 Redownloading Episode $EP_NUM_FORMATTED..."
                
                rm -f "$FILE"
                
                yt-dlp --extractor-args "generic:impersonate" --impersonate chrome \
                  -f "bestvideo+bestaudio/best" \
                  --no-progress --no-warnings \
                  -o "$FILE" "$URL" < /dev/null 2>&1
                
                if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                  HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$FILE" 2>/dev/null)
                  if [ -n "$HAS_VIDEO" ] && [ "$HAS_VIDEO" = "video" ]; then
                    echo "✅ Episode $EP_NUM_FORMATTED redownloaded successfully!"
                  else
                    echo "❌ Redownloaded file still has no video!"
                  fi
                fi
              fi
            done
            echo "✅ Redownload complete!"
          fi
          
          echo ""
          echo "🔍 Analyzing file properties..."
          
          declare -A resolutions
          declare -A has_video
          
          for f in "${SORTED_FILES[@]}"; do
            if [ -f "$f" ]; then
              res=$(mediainfo --Inform="Video;%Width%x%Height%" "$f" 2>/dev/null || echo "")
              
              if [ -z "$res" ] || [ "$res" = "0x0" ] || [ "$res" = "x" ]; then
                width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f" 2>/dev/null || echo "0")
                height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f" 2>/dev/null || echo "0")
                
                if [ "$width" != "0" ] && [ "$height" != "0" ]; then
                  res="${width}x${height}"
                  has_video["$f"]="true"
                else
                  res="0x0"
                  has_video["$f"]="false"
                fi
              else
                has_video["$f"]="true"
              fi
              resolutions["$f"]="$res"
              echo "$f: $res"
            fi
          done
          
          # Verify all files have valid video
          ALL_VALID=true
          for f in "${SORTED_FILES[@]}"; do
            if [ "${has_video[$f]}" != "true" ] || [ "${resolutions[$f]}" = "0x0" ]; then
              echo "❌ $f has no valid video stream!"
              ALL_VALID=false
            fi
          done
          
          if [ "$ALL_VALID" != true ]; then
            echo "❌ Some episodes have no video - cannot merge!"
            exit 1
          fi
          
          echo ""
          echo "✅ All files validated!"
          echo "📊 MERGING: Using mkvmerge with append..."
          
          # ------------------------------------------------------------
          # Build mkvmerge command with proper --append-to
          # Format: --append-to source_file_id:source_track_id:target_file_id:target_track_id
          # ------------------------------------------------------------
          
          # Start with the first file (file ID 0)
          MKVMERGE_CMD="mkvmerge -o \"$OUTPUT_FILE\" \"${SORTED_FILES[0]}\""
          
          # For each subsequent file, append video and audio tracks
          # File IDs start at 0 for the first file, 1 for the second, etc.
          for ((i=1; i<${#SORTED_FILES[@]}; i++)); do
            FILE="${SORTED_FILES[$i]}"
            # Append video track (track 0) from current file to video track (track 0) of the first file
            # Target file ID is always 0 (the first file we're appending to)
            MKVMERGE_CMD="$MKVMERGE_CMD \"$FILE\" --append-to ${i}:0:0:0 ${i}:1:0:1"
          done
          
          MKVMERGE_CMD="$MKVMERGE_CMD --title \"$TITLE\""
          
          echo "🔄 Running mkvmerge with append..."
          
          # Execute mkvmerge
          eval $MKVMERGE_CMD 2>&1
          
          # Check if merge was successful
          if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
            # Verify the merged file has video
            if mediainfo "$OUTPUT_FILE" 2>/dev/null | grep -q "Video"; then
              echo "✅ mkvmerge merge successful!"
              
              # Get the actual merged file duration
              ACTUAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
              ACTUAL_DURATION_INT=${ACTUAL_DURATION%.*}
              echo "📊 Merged file duration: ${ACTUAL_DURATION_INT} seconds ($((ACTUAL_DURATION_INT / 60)) minutes)"
              
              # Generate thumbnails
              echo "🖼️ Generating thumbnails..."
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
                -q:v 2 "thumb.jpg" 2>/dev/null
              
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
                -q:v 2 "square_thumb.jpg" 2>/dev/null
              
              echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
              echo "has_merged=true" >> $GITHUB_ENV
              echo "merge_success=true" >> $GITHUB_OUTPUT
              
              echo ""
              echo "========================================="
              echo "📊 FINAL MERGED FILE"
              echo "========================================="
              echo "📺 Series: $SERIES_TITLE"
              echo "📁 File: $OUTPUT_FILE"
              echo "⏱️  Duration: ${ACTUAL_DURATION_INT} seconds ($((ACTUAL_DURATION_INT / 60)) minutes)"
              ls -lh "$OUTPUT_FILE"
              echo "========================================="
            else
              echo "❌ mkvmerge output has no video stream!"
              exit 1
            fi
          else
            echo "❌ mkvmerge merge failed!"
            
            # ------------------------------------------------------------
            # FALLBACK: Try FFmpeg concat
            # ------------------------------------------------------------
            echo ""
            echo "🔄 Falling back to FFmpeg concat demuxer..."
            
            CONCAT_LIST="concat_list.txt"
            > $CONCAT_LIST
            
            for f in "${SORTED_FILES[@]}"; do
              if [ -f "$f" ] && [ -s "$f" ]; then
                if ffprobe -v error "$f" 2>/dev/null; then
                  echo "file '$f'" >> $CONCAT_LIST
                  echo "✅ Added: $f"
                else
                  echo "⚠️ Skipping invalid file: $f"
                fi
              fi
            done
            
            ffmpeg -f concat -safe 0 -i $CONCAT_LIST \
              -c copy \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "$OUTPUT_FILE" 2>/dev/null
            
            if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
              if mediainfo "$OUTPUT_FILE" 2>/dev/null | grep -q "Video"; then
                echo "✅ FFmpeg merge successful!"
                
                MERGED_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
                MERGED_DURATION_INT=${MERGED_DURATION%.*}
                echo "📊 Merged file duration: ${MERGED_DURATION_INT} seconds ($((MERGED_DURATION_INT / 60)) minutes)"
                
                # Generate thumbnails
                echo "🖼️ Generating thumbnails..."
                ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                  -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
                  -q:v 2 "thumb.jpg" 2>/dev/null
                
                ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                  -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
                  -q:v 2 "square_thumb.jpg" 2>/dev/null
                
                echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
                echo "has_merged=true" >> $GITHUB_ENV
                echo "merge_success=true" >> $GITHUB_OUTPUT
                
                echo ""
                echo "========================================="
                echo "📊 FINAL MERGED FILE (FFmpeg Fallback)"
                echo "========================================="
                echo "📺 Series: $SERIES_TITLE"
                echo "📁 File: $OUTPUT_FILE"
                echo "⏱️  Duration: ${MERGED_DURATION_INT} seconds ($((MERGED_DURATION_INT / 60)) minutes)"
                ls -lh "$OUTPUT_FILE"
                echo "========================================="
              else
                echo "❌ FFmpeg fallback also failed!"
                exit 1
              fi
            else
              echo "❌ FFmpeg fallback failed!"
              exit 1
            fi
          fi

      - name: Verify, Compress if Needed, and Fix Duration
        if: steps.merge.outputs.merge_success == 'true'
        id: verify
        timeout-minutes: 120
        run: |
          cd downloads
          
          OUTPUT_FILE="${{ steps.fname.outputs.output_filename }}"
          
          echo "========================================="
          echo "🔍 VERIFYING MERGED FILE"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📁 File: $OUTPUT_FILE"
          echo "========================================="
          
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "❌ $OUTPUT_FILE not found!"
            exit 1
          fi
          
          FILE_SIZE_BYTES=$(stat -c%s "$OUTPUT_FILE" 2>/dev/null || stat -f%z "$OUTPUT_FILE" 2>/dev/null || echo "0")
          FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))
          
          echo "📊 File size: ${FILE_SIZE_MB} MB"
          
          if [ $FILE_SIZE_MB -gt 1800 ]; then
            echo "⚠️ File exceeds 1.8GB (${FILE_SIZE_MB} MB)"
            echo "🔧 Compressing file with veryfast preset..."
            
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
            DURATION_INT=${DURATION%.*}
            
            if [ "$DURATION_INT" -gt 0 ]; then
              TARGET_SIZE_MB=1500
              TARGET_BITRATE=$((TARGET_SIZE_MB * 8 * 1024 / DURATION_INT))
              if [ $TARGET_BITRATE -lt 500 ]; then
                TARGET_BITRATE=500
              fi
              echo "📊 Target bitrate: ${TARGET_BITRATE}k"
            else
              TARGET_BITRATE=1500
            fi
            
            echo "🔧 Compressing with veryfast preset..."
            
            ffmpeg -y -i "$OUTPUT_FILE" \
              -c:v libx264 -preset veryfast -b:v ${TARGET_BITRATE}k -maxrate ${TARGET_BITRATE}k \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output_compressed.mp4" 2>/dev/null
            
            if [ -f "output_compressed.mp4" ] && [ -s "output_compressed.mp4" ]; then
              NEW_SIZE=$(stat -c%s "output_compressed.mp4" 2>/dev/null || stat -f%z "output_compressed.mp4" 2>/dev/null || echo "0")
              NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
              
              if [ $NEW_SIZE_MB -lt 1800 ]; then
                mv output_compressed.mp4 "$OUTPUT_FILE"
                echo "✅ File compressed! New size: ${NEW_SIZE_MB} MB"
                echo "compressed=true" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Compression didn't reduce enough (${NEW_SIZE_MB} MB), trying CRF..."
                
                ffmpeg -y -i "$OUTPUT_FILE" \
                  -c:v libx264 -preset veryfast -crf 28 \
                  -c:a aac -b:a 96k -ar 44100 \
                  -movflags +faststart \
                  -metadata title="$TITLE" \
                  -metadata series="$SERIES_TITLE" \
                  -metadata label="$LABEL" \
                  -metadata year="$(date +%Y)" \
                  -metadata date="$(date +%Y-%m-%d)" \
                  "output_compressed.mp4" 2>/dev/null
                
                if [ -f "output_compressed.mp4" ] && [ -s "output_compressed.mp4" ]; then
                  NEW_SIZE=$(stat -c%s "output_compressed.mp4" 2>/dev/null || stat -f%z "output_compressed.mp4" 2>/dev/null || echo "0")
                  NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
                  
                  if [ $NEW_SIZE_MB -lt 1800 ]; then
                    mv output_compressed.mp4 "$OUTPUT_FILE"
                    echo "✅ File compressed! New size: ${NEW_SIZE_MB} MB"
                    echo "compressed=true" >> $GITHUB_OUTPUT
                  else
                    echo "❌ Compression failed to reduce file size"
                    rm -f output_compressed.mp4
                    echo "compressed=false" >> $GITHUB_OUTPUT
                  fi
                fi
              fi
            else
              echo "❌ Compression failed"
              echo "compressed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ File size is under 1.8GB, no compression needed"
            echo "compressed=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
            echo "🖼️ Regenerating thumbnails..."
            ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
              -q:v 2 "thumb.jpg" 2>/dev/null
            
            ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
              -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
              -q:v 2 "square_thumb.jpg" 2>/dev/null
          fi
          
          echo "🔧 Fixing duration metadata..."
          ffmpeg -i "$OUTPUT_FILE" -c copy -map_metadata 0 -movflags +faststart output_fixed.mp4 2>/dev/null
          
          if [ -f "output_fixed.mp4" ] && [ -s "output_fixed.mp4" ]; then
            mv output_fixed.mp4 "$OUTPUT_FILE"
            echo "✅ Duration metadata fixed"
          fi
          
          if mediainfo "$OUTPUT_FILE" > /dev/null 2>&1; then
            echo "✅ MediaInfo can read the file"
            echo ""
            mediainfo "$OUTPUT_FILE"
            echo ""
            
            DURATION=$(mediainfo --Inform="General;%Duration/String3%" "$OUTPUT_FILE" 2>/dev/null)
            FINAL_SIZE=$(stat -c%s "$OUTPUT_FILE" 2>/dev/null || stat -f%z "$OUTPUT_FILE" 2>/dev/null || echo "0")
            FINAL_SIZE_MB=$((FINAL_SIZE / 1024 / 1024))
            
            echo "📝 Duration: $DURATION"
            echo "💾 Final size: ${FINAL_SIZE_MB} MB"
            echo "✅ File is valid"
            echo "verify_success=true" >> $GITHUB_OUTPUT
            echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
            
            if [ $FINAL_SIZE_MB -gt 2000 ]; then
              echo "❌ File exceeds 2GB (${FINAL_SIZE_MB} MB)"
              echo "   Telegram limit is 2GB!"
              exit 1
            else
              echo "✅ File size: ${FINAL_SIZE_MB} MB (under 2GB limit)"
            fi
          else
            echo "❌ MediaInfo cannot read the file!"
            echo "🔧 Attempting to repair..."
            
            ffmpeg -y -err_detect ignore_err -i "$OUTPUT_FILE" \
              -c:v libx264 -preset veryfast -crf 23 \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output_repaired.mp4" 2>/dev/null
            
            if [ -f "output_repaired.mp4" ]; then
              REPAIR_SIZE=$(stat -c%s "output_repaired.mp4" 2>/dev/null || echo "0")
              REPAIR_SIZE_MB=$((REPAIR_SIZE / 1024 / 1024))
              if [ "$REPAIR_SIZE" -gt 1000000 ] && [ $REPAIR_SIZE_MB -lt 2000 ]; then
                mv output_repaired.mp4 "$OUTPUT_FILE"
                echo "✅ File repaired!"
                echo "verify_success=true" >> $GITHUB_OUTPUT
                echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
              else
                echo "❌ Repair failed or file still too large"
                rm -f output_repaired.mp4
                exit 1
              fi
            else
              echo "❌ Repair failed"
              exit 1
            fi
          fi

      - name: Start Merged Upload (Background with Fast Upload)
        if: steps.verify.outputs.verify_success == 'true'
        timeout-minutes: 120
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TG_MERGED_CHAT_ID: ${{ secrets.TELEGRAM_MERGED_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TG_MERGED_NAME: ${{ secrets.TELEGRAM_MERGED_NAME }}
          TG_MERGED_INVITE_LINK: ${{ secrets.TELEGRAM_MERGED_INVITE_LINK }}
          MERGED_PATH: ${{ env.merged_file_path }}
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📤 STARTING MERGED UPLOAD TO CHANNEL"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📁 File: ${{ env.merged_file_path }}"
          echo "========================================="
          
          if [ ! -f "${{ env.merged_file_path }}" ] && [ ! -f "${{ steps.fname.outputs.output_filename }}" ]; then
            echo "❌ Merged file not found!"
            exit 1
          fi
          
          if [ -f "${{ env.merged_file_path }}" ]; then
            export MERGED_PATH="${{ env.merged_file_path }}"
          else
            export MERGED_PATH="$(pwd)/${{ steps.fname.outputs.output_filename }}"
            echo "⚠️ Using fallback path: $MERGED_PATH"
          fi
          
          python3 -c "import sys, textwrap; open('upload_merged.py', 'w').write(textwrap.dedent(sys.stdin.read()))" << 'EOFUPLOAD'
          import os
          import sys
          import glob
          import re
          import subprocess
          import asyncio
          import datetime
          import traceback
          import json
          import math

          if hasattr(sys.stdout, "reconfigure"):
              sys.stdout.reconfigure(line_buffering=True)
              sys.stderr.reconfigure(line_buffering=True)

          try:
              from telethon import TelegramClient
              from telethon.sessions import StringSession
              from telethon.errors import FloodWaitError
              from telethon.tl.functions.channels import JoinChannelRequest
              from telethon.tl.functions.messages import ImportChatInviteRequest
              from telethon.tl.types import DocumentAttributeVideo
              import telethon
              print(f"✅ Telethon version: {telethon.__version__}")
          except ImportError as e:
              print(f"❌ Import error: {e}")
              sys.exit(1)

          api_id = os.environ.get("TG_API_ID")
          api_hash = os.environ.get("TG_API_HASH")
          session_string = os.environ.get("TG_SESSION_STRING")
          
          chat_id_raw = os.environ.get("TG_MERGED_CHAT_ID")
          chat_name = os.environ.get("TG_MERGED_NAME")
          invite_link = os.environ.get("TG_MERGED_INVITE_LINK")
          
          video_path = os.environ.get("MERGED_PATH")
          title = os.environ.get("TITLE")
          series_title = os.environ.get("SERIES_TITLE", "Series")
          label = os.environ.get("LABEL", "NONE")

          if not all([api_id, api_hash]):
              print("❌ Missing Telegram API credentials.")
              sys.exit(0)

          if not session_string:
              print("❌ Missing session string!")
              sys.exit(0)

          def parse_chat_id(val):
              if not val:
                  return None
              val = str(val).strip().strip('"').strip("'")
              try:
                  return int(val)
              except ValueError:
                  return val

          def get_video_metadata(file_path):
              try:
                  cmd = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  if result and result.replace('.', '', 1).isdigit():
                      duration = float(result)
                  else:
                      cmd = ["mediainfo", "--Inform=Video;%Duration%", file_path]
                      result = subprocess.check_output(cmd, text=True).strip()
                      duration = float(result) if result.replace('.', '', 1).isdigit() else 0.0
                  
                  cmd = ["mediainfo", "--Inform=Video;%Width%|%Height%", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  parts = result.split('|')
                  
                  if len(parts) >= 2:
                      w = int(parts[0]) if parts[0].isdigit() else 1280
                      h = int(parts[1]) if parts[1].isdigit() else 720
                  else:
                      w, h = 1280, 720
                  
                  return int(duration), w, h
              except:
                  pass
              return 0, 1280, 720

          def generate_thumbnail(file_path):
              try:
                  thumb_path = f"{file_path}_thumb.jpg"
                  cmd = ["mediainfo", "--Inform=Video;%Width%|%Height%", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  parts = result.split('|')
                  
                  if len(parts) >= 2 and parts[0].isdigit() and parts[1].isdigit():
                      w = int(parts[0])
                      h = int(parts[1])
                      ffmpeg_cmd = [
                          "ffmpeg", "-y", "-ss", "00:00:01",
                          "-i", file_path,
                          "-vf", f"crop=min({w},{h}):min({w},{h}),scale=512:512:flags=lanczos",
                          "-vframes", "1",
                          "-q:v", "2",
                          thumb_path
                      ]
                      subprocess.run(ffmpeg_cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
                      return thumb_path if os.path.exists(thumb_path) else None
              except:
                  pass
              return None

          def progress_callback(current, total):
              percent = (current / total) * 100
              mb_uploaded = current / (1024 * 1024)
              mb_total = total / (1024 * 1024)
              if int(percent) % 5 == 0 or int(percent) == 100:
                  print(f"📤 Upload: {percent:.1f}% ({mb_uploaded:.1f}/{mb_total:.1f} MB)")
                  with open("merged_progress.log", "a") as f:
                      f.write(f"{datetime.datetime.now()}: {percent:.1f}% ({mb_uploaded:.1f}/{mb_total:.1f} MB)\n")

          chat_id = parse_chat_id(chat_id_raw)

          print("=" * 60)
          print("📤 Uploading Merged Video to Channel")
          print("=" * 60)
          print(f"📺 Series: {series_title}")
          print(f"📁 File: {video_path}")
          print("=" * 60)

          with open("merged_progress.log", "w") as f:
              f.write(f"{datetime.datetime.now()}: Starting merged upload\n")

          async def join_chat(client, invite_link):
              if not invite_link:
                  return None
              try:
                  return await client.get_entity(invite_link)
              except:
                  return None

          async def resolve_chat(client, chat_id, invite_link, search_name):
              if invite_link:
                  entity = await join_chat(client, invite_link)
                  if entity:
                      return entity
              if chat_id:
                  try:
                      return await client.get_entity(chat_id)
                  except:
                      pass
              if search_name:
                  async for dialog in client.iter_dialogs(limit=50):
                      if search_name.lower() in str(dialog.name).lower():
                          return dialog.entity
              return None

          async def fast_upload_file(client, file_path, progress_callback=None):
              if not os.path.exists(file_path):
                  print(f"❌ File not found: {file_path}")
                  return None
              
              file_size = os.path.getsize(file_path)
              CHUNK_SIZE = 512 * 1024
              NUM_CHUNKS = math.ceil(file_size / CHUNK_SIZE)
              
              print(f"📊 File size: {file_size / (1024*1024):.1f} MB")
              print(f"📊 Chunks: {NUM_CHUNKS} (512KB each)")
              
              try:
                  return await client.upload_file(
                      file_path,
                      part_size_kb=512,
                      file_name=os.path.basename(file_path),
                      progress_callback=progress_callback
                  )
              except Exception as e:
                  print(f"❌ Upload failed: {e}")
                  raise

          async def send_file_with_thumb(client, entity, file_path, caption):
              if not os.path.exists(file_path):
                  print(f"❌ File not found: {file_path}")
                  return False, None
              
              duration, w, h = get_video_metadata(file_path)
              print(f"📊 Video duration: {duration} seconds, {w}x{h}")
              thumb = generate_thumbnail(file_path)
              
              print(f"⬆️ Uploading to channel...")
              try:
                  uploaded_file = await fast_upload_file(
                      client=client,
                      file_path=file_path,
                      progress_callback=progress_callback
                  )
                  
                  if uploaded_file is None:
                      print("❌ Upload returned None")
                      return False, None
                      
                  print("✅ Upload complete!")
                  with open("merged_progress.log", "a") as f:
                      f.write(f"{datetime.datetime.now()}: UPLOAD_COMPLETE\n")
              except Exception as e:
                  print(f"❌ Upload failed: {e}")
                  traceback.print_exc()
                  return False, None
              
              video_attr = DocumentAttributeVideo(
                  duration=duration,
                  w=w,
                  h=h,
                  supports_streaming=True
              )
              
              kwargs = {
                  "entity": entity,
                  "file": uploaded_file,
                  "caption": caption,
                  "attributes": [video_attr],
                  "supports_streaming": True,
                  "force_document": False,
                  "allow_cache": True
              }
              
              if thumb and os.path.exists(thumb):
                  kwargs["thumb"] = thumb
                  print(f"📸 Using thumbnail: {thumb}")
              
              try:
                  result = await client.send_file(**kwargs)
                  print("✅ File sent to Telegram Channel!")
                  return True, result
              except Exception as e:
                  print(f"❌ Send failed: {e}")
                  if "thumb" in kwargs:
                      del kwargs["thumb"]
                      try:
                          result = await client.send_file(**kwargs)
                          return True, result
                      except Exception as e2:
                          print(f"❌ Send failed without thumb: {e2}")
                          return False, None
                  return False, None
              finally:
                  if thumb and os.path.exists(thumb):
                      try: os.remove(thumb)
                      except: pass

          async def upload_merged_video(client, entity):
              video_path = os.environ.get("MERGED_PATH")
              
              if not video_path or not os.path.isfile(video_path):
                  if os.path.exists("${{ steps.fname.outputs.output_filename }}"):
                      video_path = os.path.abspath("${{ steps.fname.outputs.output_filename }}")
                  else:
                      video_files = glob.glob("*.mp4")
                      if video_files:
                          video_path = os.path.abspath(max(video_files, key=lambda f: os.path.getsize(f)))
                      else:
                          return False
              
              if not os.path.isfile(video_path):
                  print(f"❌ Video file not found: {video_path}")
                  return False
              
              file_size_mb = os.path.getsize(video_path) / (1024 * 1024)
              print(f"💾 File size: {file_size_mb:.1f} MB")
              
              if file_size_mb > 2000:
                  print(f"❌ File exceeds 2GB ({file_size_mb:.1f} MB)")
                  return False
              
              now = datetime.datetime.now()
              month_year = now.strftime("%B%Y").upper()
              
              clean_label = str(label).upper().replace("-", "").replace(" ", "").replace("_", "")
              if clean_label == "NONE" or clean_label == "":
                  clean_label = "NONE"
              
              caption = f"{title}\n#UNWATCHED\n#{month_year}\n#{month_year}UNWATCHED\n#{month_year}{clean_label}\n#{clean_label}"
              
              print(f"📤 Uploading merged video to channel...")
              print(f"📝 Caption: {caption[:50]}...")
              
              try:
                  success, result = await send_file_with_thumb(client, entity, video_path, caption)
                  if success:
                      print("✅ Merged video successfully posted to channel!")
                      return True
                  return False
              except FloodWaitError as e:
                  print(f"⏳ Rate limited: waiting {e.seconds}s")
                  await asyncio.sleep(e.seconds)
                  return await send_file_with_thumb(client, entity, video_path, caption)
              except Exception as e:
                  print(f"❌ Merged upload failed: {e}")
                  traceback.print_exc()
                  return False

          async def main():
              try:
                  print("🔌 Connecting to Telegram...")
                  client = TelegramClient(
                      StringSession(session_string), 
                      int(api_id), 
                      api_hash,
                      connection_retries=5,
                      flood_sleep_threshold=180
                  )
                  await client.connect()
                  
                  if not await client.is_user_authorized():
                      print("❌ Session invalid")
                      return
                  
                  me = await client.get_me()
                  print(f"✅ Logged in: {me.first_name}")
                  
                  entity = await resolve_chat(client, chat_id, invite_link, chat_name)
                  if not entity:
                      print("❌ Could not resolve channel for merged video!")
                      return
                  
                  print(f"\n📤 Posting to Channel: {entity.title if hasattr(entity, 'title') else entity.id}")
                  await upload_merged_video(client, entity)
                  
                  await client.disconnect()
                  print("\n✅ Merged channel upload complete!")
              except Exception as e:
                  print(f"❌ Error: {e}")
                  traceback.print_exc()

          if __name__ == '__main__':
              asyncio.run(main())
          EOFUPLOAD
          
          echo "🚀 Starting upload to channel in background..."
          python3 upload_merged.py > merged_upload.log 2>&1 &
          MERGED_PID=$!
          echo "merged_pid=$MERGED_PID" >> $GITHUB_ENV
          echo "✅ Merged upload started with PID: $MERGED_PID"

