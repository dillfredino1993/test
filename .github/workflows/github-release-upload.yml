      - name: Wait for All Uploads with Speed Monitoring and Auto-Restart
        if: steps.verify.outputs.verify_success == 'true'
        timeout-minutes: 240
        env:
          MIN_UPLOAD_SPEED_MBPS: ${{ env.MIN_UPLOAD_SPEED_MBPS }}
          RESTART_ATTEMPTS: ${{ env.RESTART_ATTEMPTS }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "⏳ MONITORING UPLOAD PROGRESS WITH SPEED CHECK"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "⚡ Min Speed: ${MIN_UPLOAD_SPEED_MBPS} MB/s"
          echo "🔄 Max Restarts: ${RESTART_ATTEMPTS}"
          echo "========================================="
          
          # Initialize restart counter
          RESTART_COUNT=0
          RESTART_LOG="restart_log.txt"
          echo "0" > "$RESTART_LOG"
          
          # Function to check if merged upload process is still running
          is_merged_running() {
            if [ -n "$MERGED_PID" ]; then
              if kill -0 "$MERGED_PID" 2>/dev/null; then
                return 0  # Running
              fi
            fi
            return 1  # Not running
          }
          
          # Function to get current speed from progress log
          get_current_speed() {
            if [ -f "merged_progress.log" ]; then
              local last_speed=$(grep -E "SPEED_TOO_SLOW" merged_progress.log | tail -1 | cut -d':' -f2)
              if [ -n "$last_speed" ]; then
                echo "$last_speed"
                return
              fi
              
              local last_progress=$(grep -E "UPLOAD_PROGRESS" merged_progress.log | tail -1)
              if [ -n "$last_progress" ]; then
                local speed=$(echo "$last_progress" | cut -d':' -f5)
                if [ -n "$speed" ]; then
                  echo "$speed"
                  return
                fi
              fi
            fi
            echo "0"
          }
          
          # Function to get current percent
          get_current_percent() {
            if [ -f "merged_progress.log" ]; then
              local last_progress=$(grep -E "UPLOAD_PROGRESS" merged_progress.log | tail -1)
              if [ -n "$last_progress" ]; then
                local percent=$(echo "$last_progress" | cut -d':' -f2)
                if [ -n "$percent" ]; then
                  echo "$percent"
                  return
                fi
              fi
            fi
            echo "0"
          }
          
          # Function to check if speed is too slow
          is_speed_too_slow() {
            local speed=$(get_current_speed)
            local percent=$(get_current_percent)
            
            # Only check speed if we're between 10% and 95% complete
            if [ "$(echo "$percent > 10" | bc)" = "1" ] && [ "$(echo "$percent < 95" | bc)" = "1" ]; then
              local min_speed="${MIN_UPLOAD_SPEED_MBPS:-0.5}"
              if [ "$(echo "$speed < $min_speed" | bc)" = "1" ] && [ "$speed" != "0" ]; then
                return 0  # Speed is too slow
              fi
            fi
            return 1  # Speed is acceptable
          }
          
          # Function to restart merged upload
          restart_merged_upload() {
            local restart_count=$1
            echo ""
            echo "========================================="
            echo "🔄 RESTARTING MERGED UPLOAD (Attempt $restart_count)"
            echo "========================================="
            
            # Kill existing process
            if is_merged_running; then
              echo "🛑 Killing existing upload process (PID: $MERGED_PID)"
              kill -9 "$MERGED_PID" 2>/dev/null || true
              sleep 2
            fi
            
            # Backup old log
            if [ -f "merged_progress.log" ]; then
              cp merged_progress.log "merged_progress_restart_${restart_count}.log"
            fi
            
            # Start new upload
            echo "🚀 Starting new upload attempt..."
            python3 -u upload_merged.py > merged_upload.log 2>&1 &
            MERGED_PID=$!
            echo "merged_pid=$MERGED_PID" >> $GITHUB_ENV
            echo "✅ Restarted merged upload with PID: $MERGED_PID"
            
            # Wait for process to start
            sleep 5
            
            # Check if process is running
            if is_merged_running; then
              echo "✅ Restarted process is running"
              echo "$restart_count" > "$RESTART_LOG"
              return 0
            else
              echo "❌ Restarted process died immediately!"
              return 1
            fi
          }
          
          # Function to parse progress from log files
          get_merged_progress() {
            if [ -f "merged_progress.log" ]; then
              # Check for completion
              if grep -q "MERGED_UPLOAD_COMPLETE" merged_progress.log; then
                echo "100|complete"
                return
              fi
              if grep -q "UPLOAD_COMPLETE" merged_progress.log; then
                echo "100|complete"
                return
              fi
              if grep -q "MERGED_UPLOAD_SUCCESS" merged_progress.log; then
                echo "100|complete"
                return
              fi
              
              # Check for progress
              local last_progress=$(grep -E "UPLOAD_PROGRESS" merged_progress.log | tail -1)
              if [ -n "$last_progress" ]; then
                local percent=$(echo "$last_progress" | cut -d':' -f2)
                local uploaded=$(echo "$last_progress" | cut -d':' -f3)
                local total=$(echo "$last_progress" | cut -d':' -f4)
                echo "$percent|${uploaded}/${total}"
                return
              fi
              
              echo "0|0.0/0.0"
            else
              echo "0|0.0/0.0"
            fi
          }
          
          # Function to get merged status
          get_merged_status() {
            if [ -f "merged_progress.log" ]; then
              if grep -q "MERGED_UPLOAD_COMPLETE" merged_progress.log; then
                echo "✅ COMPLETE"
              elif grep -q "VIDEO_SENT" merged_progress.log; then
                echo "📤 Video sent"
              elif grep -q "UPLOAD_COMPLETE" merged_progress.log; then
                echo "⬆️ Upload complete, sending..."
              elif grep -q "SPEED_TOO_SLOW" merged_progress.log; then
                local speed=$(get_current_speed)
                echo "⚠️ SLOW: ${speed} MB/s"
              elif grep -q "UPLOAD_PROGRESS" merged_progress.log; then
                local last_percent=$(grep "UPLOAD_PROGRESS" merged_progress.log | tail -1 | cut -d':' -f2)
                if [ -n "$last_percent" ]; then
                  echo "⬆️ Uploading: ${last_percent}%"
                else
                  echo "⬆️ Uploading video..."
                fi
              elif grep -q "VIDEO_UPLOAD_STARTED" merged_progress.log; then
                echo "⬆️ Starting video upload"
              elif grep -q "POSTER_SENT" merged_progress.log; then
                echo "✅ Poster sent, uploading video..."
              elif grep -q "POSTER_WILL_BE_SENT" merged_progress.log; then
                echo "🖼️ Sending poster..."
              elif grep -q "UPLOAD_STARTED" merged_progress.log; then
                echo "🔄 Connecting to Telegram..."
              elif grep -q "Starting merged upload" merged_progress.log; then
                echo "🔄 Initializing..."
              else
                echo "⏳ Waiting..."
              fi
            else
              echo "⏳ Starting..."
            fi
          }
          
          # Function to get episode progress
          get_episode_progress() {
            if [ -f "single_episodes_complete.txt" ]; then
              echo "100|complete"
              return
            fi
            
            if [ -f "episode_upload.log" ]; then
              local total_eps=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
              local completed=$(grep -c "COMPLETE_EP_" episode_upload.log 2>/dev/null || echo "0")
              
              if [ "$total_eps" -gt 0 ]; then
                local percent=$((completed * 100 / total_eps))
                echo "$percent|${completed}/${total_eps}"
              else
                echo "0|0/0"
              fi
            else
              echo "0|0/0"
            fi
          }
          
          # Function to calculate ETA
          calculate_eta() {
            local current=$1
            local total=$2
            local elapsed_seconds=$3
            
            if [ "$current" = "0" ] || [ "$total" = "0" ]; then
              echo "Calculating..."
              return
            fi
            
            if command -v bc &> /dev/null; then
              local percent=$(echo "scale=2; ($current / $total) * 100" | bc 2>/dev/null || echo "0")
              if [ "$(echo "$percent > 0" | bc)" = "0" ]; then
                echo "Calculating..."
                return
              fi
              
              local remaining_percent=$(echo "scale=2; 100 - $percent" | bc 2>/dev/null || echo "0")
              if [ "$(echo "$remaining_percent <= 0" | bc)" = "1" ]; then
                echo "0s"
                return
              fi
              
              local elapsed_seconds_float=$(echo "$elapsed_seconds" | bc -l 2>/dev/null || echo "1")
              local rate=$(echo "scale=2; $current / $elapsed_seconds_float" | bc -l 2>/dev/null || echo "1")
              if [ "$(echo "$rate < 0.001" | bc)" = "1" ]; then
                echo "Calculating..."
                return
              fi
              
              local remaining_mb=$(echo "scale=2; $total - $current" | bc -l 2>/dev/null || echo "0")
              local eta_seconds=$(echo "scale=0; $remaining_mb / $rate" | bc -l 2>/dev/null || echo "0")
              
              if [ "$eta_seconds" -lt 1 ]; then
                echo "0s"
              elif [ "$eta_seconds" -lt 60 ]; then
                echo "${eta_seconds}s"
              elif [ "$eta_seconds" -lt 3600 ]; then
                local minutes=$((eta_seconds / 60))
                local seconds=$((eta_seconds % 60))
                echo "${minutes}m ${seconds}s"
              else
                local hours=$((eta_seconds / 3600))
                local minutes=$(((eta_seconds % 3600) / 60))
                echo "${hours}h ${minutes}m"
              fi
            else
              echo "Calculating..."
            fi
          }
          
          # Main monitoring loop
          START_TIME=$(date +%s)
          MERGED_COMPLETE=false
          EPISODES_COMPLETE=false
          SLOW_SPEED_COUNT=0
          MAX_SLOW_CHECKS=3
          
          echo ""
          echo "🔄 Monitoring upload progress..."
          echo "   (Updates every 5 seconds)"
          echo ""
          
          while true; do
            # Check if episodes are complete
            if [ -f "single_episodes_complete.txt" ]; then
              EPISODES_COMPLETE=true
            fi
            
            # Check merged completion
            if [ -f "merged_progress.log" ]; then
              if grep -q "MERGED_UPLOAD_COMPLETE" merged_progress.log; then
                MERGED_COMPLETE=true
              elif grep -q "UPLOAD_COMPLETE" merged_progress.log; then
                MERGED_COMPLETE=true
              elif grep -q "MERGED_UPLOAD_SUCCESS" merged_progress.log; then
                MERGED_COMPLETE=true
              elif ! is_merged_running && [ -f "merged_upload.log" ]; then
                if tail -20 merged_upload.log | grep -q "✅ Merged video successfully posted to channel!"; then
                  MERGED_COMPLETE=true
                  if ! grep -q "MERGED_UPLOAD_COMPLETE" merged_progress.log 2>/dev/null; then
                    echo "$(date): MERGED_UPLOAD_COMPLETE" >> merged_progress.log
                  fi
                fi
              fi
            fi
            
            # If both complete, break
            if [ "$MERGED_COMPLETE" = true ] && [ "$EPISODES_COMPLETE" = true ]; then
              echo ""
              echo "✅ ALL UPLOADS COMPLETED!"
              echo ""
              break
            fi
            
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            # Format elapsed time
            if [ $ELAPSED -lt 60 ]; then
              ELAPSED_STR="${ELAPSED}s"
            elif [ $ELAPSED -lt 3600 ]; then
              ELAPSED_STR="$((ELAPSED / 60))m $((ELAPSED % 60))s"
            else
              ELAPSED_STR="$((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m"
            fi
            
            clear 2>/dev/null || printf "\033c" 2>/dev/null || echo ""
            
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║           📤 UPLOAD PROGRESS MONITOR                        ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║ ⏱️  Elapsed Time: $(printf "%-40s" "$ELAPSED_STR")║"
            echo "║ 📺 Series: $(printf "%-47s" "${{ steps.fname.outputs.series_title }}")║"
            echo "║ 🔄 Restarts: $(printf "%-42s" "$RESTART_COUNT/${{ env.RESTART_ATTEMPTS }}")║"
            echo "║                                                              ║"
            
            # Merged Upload Progress
            MERGED_PROGRESS=$(get_merged_progress)
            MERGED_PERCENT=$(echo "$MERGED_PROGRESS" | cut -d'|' -f1)
            MERGED_DATA=$(echo "$MERGED_PROGRESS" | cut -d'|' -f2)
            MERGE_STATUS=$(get_merged_status)
            CURRENT_SPEED=$(get_current_speed)
            
            echo "║ 📹 Merged Video:                                        ║"
            
            if [ "$MERGED_COMPLETE" = true ] || [ "$MERGED_DATA" = "complete" ] || [ "$MERGED_PERCENT" = "100" ]; then
              MERGED_COMPLETE=true
              echo "║    Status: ✅ COMPLETE                                   ║"
              echo "║    Progress: 100%                                       ║"
              BAR_LENGTH=40
              BAR=""
              for ((i=0; i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
              echo "║    [${BAR}] ║"
              echo "║                                                              ║"
            elif [ -n "$MERGED_PERCENT" ] && [ "$MERGED_PERCENT" != "0" ] && [ "$MERGED_PERCENT" != "100" ]; then
              echo "║    Status: ${MERGE_STATUS}                                 ║"
              echo "║    Progress: $(printf "%-51s" "${MERGED_PERCENT}%")║"
              
              BAR_LENGTH=40
              FILLED=$(echo "scale=0; ($MERGED_PERCENT * $BAR_LENGTH) / 100" | bc 2>/dev/null || echo "0")
              BAR=""
              for ((i=0; i<$FILLED && i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
              for ((i=$FILLED; i<$BAR_LENGTH; i++)); do BAR="${BAR}░"; done
              echo "║    [${BAR}] ║"
              
              # Show speed and ETA
              if [ "$CURRENT_SPEED" != "0" ]; then
                echo "║    Speed: $(printf "%-49s" "${CURRENT_SPEED} MB/s")║"
              fi
              
              if [[ "$MERGED_DATA" == *"/"* ]]; then
                UPLOADED=$(echo "$MERGED_DATA" | cut -d'/' -f1)
                TOTAL=$(echo "$MERGED_DATA" | cut -d'/' -f2)
                
                if [[ "$UPLOADED" =~ ^[0-9.]+$ ]] && [[ "$TOTAL" =~ ^[0-9.]+$ ]] && [ "$ELAPSED" -gt 2 ]; then
                  ETA=$(calculate_eta "$UPLOADED" "$TOTAL" "$ELAPSED")
                  echo "║    ETA: $(printf "%-51s" "$ETA")║"
                fi
              fi
              
              # Show speed warning if too slow
              if is_speed_too_slow; then
                echo "║    ⚠️  Speed below minimum (${MIN_UPLOAD_SPEED_MBPS} MB/s)    ║"
                SLOW_SPEED_COUNT=$((SLOW_SPEED_COUNT + 1))
                
                # Check if we should restart
                if [ $SLOW_SPEED_COUNT -ge $MAX_SLOW_CHECKS ] && [ $RESTART_COUNT -lt ${{ env.RESTART_ATTEMPTS }} ]; then
                  echo "║    🔄 Restarting due to slow speed...                    ║"
                  SLOW_SPEED_COUNT=0
                  RESTART_COUNT=$((RESTART_COUNT + 1))
                  
                  # Restart the upload
                  if restart_merged_upload "$RESTART_COUNT"; then
                    echo "║    ✅ Restart successful                                ║"
                  else
                    echo "║    ❌ Restart failed                                   ║"
                  fi
                fi
              else
                SLOW_SPEED_COUNT=0
              fi
              echo "║                                                              ║"
            elif is_merged_running; then
              echo "║    Status: ${MERGE_STATUS}                                 ║"
              echo "║                                                              ║"
            else
              echo "║    Status: ${MERGE_STATUS}                                 ║"
              echo "║                                                              ║"
            fi
            
            # Episode Upload Progress
            echo "║ 📺 Single Episodes:                                        ║"
            
            EP_PROGRESS=$(get_episode_progress)
            EP_PERCENT=$(echo "$EP_PROGRESS" | cut -d'|' -f1)
            EP_DATA=$(echo "$EP_PROGRESS" | cut -d'|' -f2)
            
            if [ "$EPISODES_COMPLETE" = true ] || [ "$EP_DATA" = "complete" ]; then
              EPISODES_COMPLETE=true
              echo "║    Status: ✅ COMPLETE                                     ║"
              BAR_LENGTH=40
              BAR=""
              for ((i=0; i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
              echo "║    [${BAR}] ║"
            else
              TOTAL_EPISODES=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
              COMPLETED=$(echo "$EP_DATA" | cut -d'/' -f1 2>/dev/null || echo "0")
              
              if [ "$TOTAL_EPISODES" -gt 0 ]; then
                echo "║    Progress: $(printf "%-51s" "${EP_PERCENT}% (${COMPLETED}/${TOTAL_EPISODES} episodes)")║"
                
                BAR_LENGTH=40
                FILLED=$((EP_PERCENT * BAR_LENGTH / 100))
                BAR=""
                for ((i=0; i<$FILLED && i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
                for ((i=$FILLED; i<$BAR_LENGTH; i++)); do BAR="${BAR}░"; done
                echo "║    [${BAR}] ║"
                
                if [ "$COMPLETED" -gt 0 ] && [ "$ELAPSED" -gt 10 ]; then
                  AVG_TIME_PER_EP=$((ELAPSED / COMPLETED))
                  REMAINING=$((TOTAL_EPISODES - COMPLETED))
                  ETA_SECONDS=$((AVG_TIME_PER_EP * REMAINING))
                  if [ $ETA_SECONDS -lt 60 ]; then
                    EP_ETA="${ETA_SECONDS}s"
                  elif [ $ETA_SECONDS -lt 3600 ]; then
                    EP_ETA="$((ETA_SECONDS / 60))m $((ETA_SECONDS % 60))s"
                  else
                    EP_ETA="$((ETA_SECONDS / 3600))h $(((ETA_SECONDS % 3600) / 60))m"
                  fi
                  echo "║    ETA: $(printf "%-51s" "$EP_ETA")║"
                fi
              else
                echo "║    Status: No episodes found                             ║"
              fi
            fi
            echo "║                                                              ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            
            # Check for errors in logs
            if [ -f "merged_upload.log" ]; then
              if tail -3 merged_upload.log 2>/dev/null | grep -q "❌"; then
                echo ""
                echo "⚠️  Errors detected in merged upload log"
                echo "   Last 5 lines:"
                tail -5 merged_upload.log | sed 's/^/   /'
              fi
            fi
            
            sleep 5
          done
          
          echo "========================================="
          echo "✅ ALL UPLOADS COMPLETED SUCCESSFULLY!"
          echo "========================================="
          
          # Show final logs
          if [ -f "merged_upload.log" ]; then
            echo ""
            echo "📋 Final merged upload log:"
            echo "========================================="
            tail -20 merged_upload.log
            echo "========================================="
          fi
          
          echo ""
          echo "📊 Upload Summary:"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "⏱️  Total Time: $ELAPSED_STR"
          echo "🔄 Total Restarts: $RESTART_COUNT"
          
          # Get final merged file size
          if [ -f "merged_progress.log" ]; then
            FINAL_SIZE=$(grep -E "UPLOAD_PROGRESS" merged_progress.log | tail -1 | cut -d':' -f4)
            if [ -n "$FINAL_SIZE" ]; then
              echo "📹 Merged Video Size: ${FINAL_SIZE} MB"
            fi
          fi
          
          EP_COUNT=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          if [ -f "single_episodes_complete.txt" ]; then
            echo "📺 Episodes Uploaded: $EP_COUNT"
          fi
          
          echo "========================================="
          if [ -f "single_episodes_complete.txt" ] && [ -f "merged_progress.log" ] && grep -q "MERGED_UPLOAD_COMPLETE" merged_progress.log; then
            echo "🎉 All uploads completed successfully!"
          fi
          echo "========================================="

      - name: Cleanup - Delete Workflow Run if Successful
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const runId = context.runId;
            const repo = context.repo;
            
            console.log(`🧹 Cleaning up workflow run ${runId}`);
            console.log(`📦 Repository: ${repo.owner}/${repo.repo}`);
            
            try {
              await github.rest.actions.deleteWorkflowRun({
                owner: repo.owner,
                repo: repo.repo,
                run_id: runId
              });
              console.log(`✅ Successfully deleted workflow run ${runId}`);
            } catch (error) {
              console.log(`❌ Failed to delete workflow run: ${error.message}`);
              if (error.status === 403) {
                console.log('⚠️ Permission denied. The token may not have "actions: write" permission.');
                console.log('ℹ️ You may need to manually delete this workflow run.');
              } else if (error.status === 404) {
                console.log('⚠️ Workflow run not found. It may have been already deleted.');
              } else {
                console.log(`⚠️ Error details: ${JSON.stringify(error, null, 2)}`);
              }
              console.log('ℹ️ Continuing workflow execution...');
            }
