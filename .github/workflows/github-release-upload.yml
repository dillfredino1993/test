name: GitHub Telegram & Media Pipeline

on:
  repository_dispatch:
    types: [github_release_upload]

# ONLY ONE WORKFLOW RUN AT A TIME
concurrency:
  group: media-pipeline-processor
  cancel-in-progress: false
  queue: max

# Add permissions for deleting workflow runs
permissions:
  actions: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Series Information & Setup
        run: |
          echo "========================================="
          echo "📋 SERIES INFORMATION"
          echo "========================================="
          
          # Extract series information from payload
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Unknown Series' }}"
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          EPISODE_COUNT="${{ github.event.client_payload.episode_count || 'Unknown' }}"
          
          echo "📺 Series Title: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "📊 Episode Count: $EPISODE_COUNT"
          echo "⏰ Started at: $(date)"
          echo "========================================="
          
          # Store for later use
          echo "series_title=$SERIES" >> $GITHUB_ENV
          echo "label=$LABEL" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Tools
        run: |
          echo "========================================="
          echo "🔧 INSTALLING TOOLS"
          echo "========================================="
          echo "📺 Series: ${{ env.series_title }}"
          echo "========================================="
          
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 curl python3-pip jq mkvtoolnix bc wget mediainfo exiftool
          pip3 install --upgrade pip
          pip3 install telethon qrcode requests aiohttp python-socks[asyncio] cloudscraper beautifulsoup4 lxml
          python3 -c "import telethon; print(f'✅ Telethon version: {telethon.__version__}')"
          
          echo "========================================="
          echo "✅ INSTALLATION COMPLETE"
          echo "========================================="

      - name: Compute Dynamic Formatted Output Filename & Label
        id: fname
        run: |
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Series' }}"
          
          echo "========================================="
          echo "📝 COMPUTING FILENAME"
          echo "========================================="
          echo "📺 Series: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "========================================="
          
          CLEAN_LABEL=$(echo "$LABEL" | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          CLEAN_SERIES_TITLE=$(echo "$SERIES" | sed -e 's/[\/:*?"<>|]/_/g' -e 's/^ *//' -e 's/ *$//')
          CLEAN_SERIES_TAG=$(echo "$CLEAN_SERIES_TITLE" | tr ' ' '_')
          
          DATE_STR=$(date +'%Y-%m-%d')
          
          TAG_NAME="${DATE_STR}-${CLEAN_LABEL}-${CLEAN_SERIES_TAG}"
          FORMATTED_TITLE="[${DATE_STR}]-[${CLEAN_LABEL}]-${CLEAN_SERIES_TITLE}"
          
          echo "📄 Formatted Title: $FORMATTED_TITLE"
          echo "🏷️  Tag Name: $TAG_NAME"
          echo "========================================="
          
          echo "formatted_title=${FORMATTED_TITLE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "series_title=${CLEAN_SERIES_TITLE}" >> $GITHUB_OUTPUT
          echo "clean_label=${CLEAN_LABEL}" >> $GITHUB_OUTPUT

      - name: Parse URLs with jq (Clean & Uncorrupted)
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "========================================="
          echo "📋 PARSING URLs"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          mkdir -p downloads && cd downloads
          
          # Extract URLs cleanly: remove \r carriage returns and trim whitespace
          echo "$CLIENT_PAYLOAD" | tr -d '\r' | jq -r '
            (.episodes[]?.url // .video_urls[]? // .video_url // .url // empty)
            | tostring | gsub("^\\s+|\\s+$"; "")
          ' > urls.txt
          
          # Remove empty lines
          sed -i '/^$/d' urls.txt
          
          echo "========================================="
          echo "📋 URLs to download:"
          cat urls.txt
          echo "========================================="
          
          echo "total_episodes=$(cat urls.txt | wc -l)" >> $GITHUB_ENV
          
          if [ ! -s urls.txt ]; then
            echo "❌ No valid URLs found!"
            exit 1
          fi
          
          echo "✅ Found $(cat urls.txt | wc -l) URLs"

      - name: Create Streamtape Downloader Script
        run: |
          cd downloads
          
          cat > streamtape_downloader.py << 'EOFSTREAMTAPE'
          import os
          import sys
          import re
          import json
          import time
          import subprocess
          import base64
          from urllib.parse import urlparse, parse_qs, unquote, urljoin
          from typing import Optional, Dict, List
          
          try:
              import cloudscraper
              print("✅ cloudscraper loaded")
          except ImportError:
              print("❌ cloudscraper not available")
              sys.exit(1)
          
          try:
              from bs4 import BeautifulSoup
              print("✅ BeautifulSoup loaded")
          except ImportError:
              print("⚠️ BeautifulSoup not available")
              BeautifulSoup = None
          
          class StreamtapeExtractor:
              """
              Streamtape video extractor - based on the StreamtapeExtractor class
              from GitHub repositories
              """
              
              def __init__(self, url: str):
                  self.url = url
                  self.session = self._create_session()
                  self.html = None
                  self.headers = self._get_headers()
                  
              def _create_session(self):
                  """Create a cloudscraper session with proper browser fingerprint"""
                  return cloudscraper.create_scraper(
                      browser={
                          'browser': 'chrome',
                          'platform': 'windows',
                          'mobile': False,
                          'desktop': True
                      },
                      interpreter='nodejs',
                      delay=1
                  )
              
              def _get_headers(self):
                  """Get headers for streamtape requests"""
                  return {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                      'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8',
                      'Accept-Language': 'en-US,en;q=0.9',
                      'Accept-Encoding': 'gzip, deflate, br',
                      'Connection': 'keep-alive',
                      'Upgrade-Insecure-Requests': '1',
                      'Sec-Fetch-Dest': 'document',
                      'Sec-Fetch-Mode': 'navigate',
                      'Sec-Fetch-Site': 'none',
                      'Sec-Fetch-User': '?1',
                      'Cache-Control': 'max-age=0',
                      'Referer': 'https://streamtape.com/',
                      'Origin': 'https://streamtape.com',
                      'DNT': '1',
                  }
              
              def _fetch_page(self) -> bool:
                  """Fetch the streamtape page"""
                  try:
                      print("📡 Fetching Streamtape page...")
                      response = self.session.get(self.url, headers=self.headers, timeout=45)
                      response.raise_for_status()
                      self.html = response.text
                      
                      # Save HTML for debugging
                      with open("streamtape_page.html", "w", encoding="utf-8") as f:
                          f.write(self.html)
                      
                      return True
                  except Exception as e:
                      print(f"❌ Failed to fetch page: {e}")
                      return False
              
              def _extract_video_id_token(self) -> Optional[Dict[str, str]]:
                  """
                  Extract video ID and token from the page
                  Based on StreamtapeExtractor implementation
                  """
                  if not self.html:
                      return None
                  
                  print("🔍 Extracting video ID and token...")
                  
                  # Pattern 1: Look for get_video function call
                  # Common pattern: get_video('token', 'video_id')
                  pattern1 = r'get_video\s*\(\s*["\']([^"\']+)["\']\s*,\s*["\']([^"\']+)["\']\s*\)'
                  match = re.search(pattern1, self.html)
                  if match:
                      token = match.group(1)
                      video_id = match.group(2)
                      print(f"✅ Found via get_video(): token={token[:10]}..., id={video_id[:10]}...")
                      return {'token': token, 'video_id': video_id}
                  
                  # Pattern 2: Look for video_token and video_id variables
                  token_match = re.search(r'video_token\s*=\s*["\']([^"\']+)["\']', self.html)
                  id_match = re.search(r'video_id\s*=\s*["\']([^"\']+)["\']', self.html)
                  
                  if token_match and id_match:
                      token = token_match.group(1)
                      video_id = id_match.group(1)
                      print(f"✅ Found via variables: token={token[:10]}..., id={video_id[:10]}...")
                      return {'token': token, 'video_id': video_id}
                  
                  # Pattern 3: Look for token in script tags
                  script_pattern = r'<script[^>]*>([\s\S]*?)</script>'
                  script_tags = re.findall(script_pattern, self.html)
                  
                  for script in script_tags:
                      # Look for token pattern
                      token_match = re.search(r'["\']token["\']\s*:\s*["\']([^"\']+)["\']', script)
                      if token_match:
                          token = token_match.group(1)
                          # Try to find video_id nearby
                          id_match = re.search(r'["\']id["\']\s*:\s*["\']([^"\']+)["\']', script)
                          if id_match:
                              video_id = id_match.group(1)
                              print(f"✅ Found in script: token={token[:10]}..., id={video_id[:10]}...")
                              return {'token': token, 'video_id': video_id}
                  
                  # Pattern 4: Look for URL parameters in the page URL
                  parsed = urlparse(self.url)
                  params = parse_qs(parsed.query)
                  
                  if 'token' in params and 'id' in params:
                      token = params['token'][0]
                      video_id = params['id'][0]
                      print(f"✅ Found in URL params: token={token[:10]}..., id={video_id[:10]}...")
                      return {'token': token, 'video_id': video_id}
                  
                  # Pattern 5: Search for any token-like string
                  token_patterns = [
                      r'["\']token["\']\s*:\s*["\']([a-zA-Z0-9_-]+)["\']',
                      r'token=([a-zA-Z0-9_-]+)',
                      r'["\']([a-zA-Z0-9_-]{10,})["\']\s*:\s*["\']token["\']',
                  ]
                  
                  for pattern in token_patterns:
                      matches = re.findall(pattern, self.html)
                      if matches:
                          # Get the first match as token
                          token = matches[0]
                          # Try to find video_id separately
                          id_patterns = [
                              r'["\']id["\']\s*:\s*["\']([a-zA-Z0-9_-]+)["\']',
                              r'video_id=([a-zA-Z0-9_-]+)',
                              r'["\']([a-zA-Z0-9_-]{5,})["\']\s*:\s*["\']id["\']',
                          ]
                          for id_pattern in id_patterns:
                              id_match = re.search(id_pattern, self.html)
                              if id_match:
                                  video_id = id_match.group(1)
                                  print(f"✅ Found token via pattern: token={token[:10]}..., id={video_id[:10]}...")
                                  return {'token': token, 'video_id': video_id}
                  
                  return None
              
              def _build_video_url(self, token: str, video_id: str) -> Optional[str]:
                  """
                  Build the direct video URL using token and video_id
                  Based on StreamtapeExtractor implementation
                  """
                  # Try different URL patterns
                  url_patterns = [
                      f"https://streamtape.com/get_video?id={video_id}&token={token}",
                      f"https://streamtape.com/get_video?{video_id}&{token}",
                      f"https://streamtape.com/video/{video_id}/{token}",
                      f"https://streamtape.com/d/{video_id}?token={token}",
                      f"https://streamtape.com/get_video?video_id={video_id}&token={token}",
                  ]
                  
                  print(f"🔍 Testing {len(url_patterns)} URL patterns...")
                  
                  for pattern in url_patterns:
                      print(f"🔄 Testing: {pattern[:80]}...")
                      try:
                          # Use HEAD request first to check if it's a valid video
                          head_response = self.session.head(pattern, headers=self.headers, timeout=10)
                          
                          # Check if it's a video file or redirects to one
                          if head_response.status_code == 200:
                              content_type = head_response.headers.get('Content-Type', '')
                              if 'video' in content_type or 'mp4' in content_type or 'm3u8' in content_type:
                                  print(f"✅ Found video URL: {pattern[:100]}...")
                                  return pattern
                          elif head_response.status_code in [301, 302, 307, 308]:
                              redirect_url = head_response.headers.get('Location', '')
                              if redirect_url and ('.mp4' in redirect_url or '.m3u8' in redirect_url or 'video' in redirect_url):
                                  print(f"✅ Found video via redirect: {redirect_url[:100]}...")
                                  return redirect_url
                          
                          # Try GET request
                          get_response = self.session.get(pattern, headers=self.headers, timeout=15)
                          if get_response.status_code == 200:
                              # Check if response is a video
                              if 'video' in get_response.headers.get('Content-Type', ''):
                                  print(f"✅ Found video URL via GET: {pattern[:100]}...")
                                  return pattern
                              # Check if response contains video URL
                              content = get_response.text
                              src_match = re.search(r'<source[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']', content)
                              if src_match:
                                  video_url = src_match.group(1)
                                  print(f"✅ Found video URL in response: {video_url[:100]}...")
                                  return video_url
                      except Exception as e:
                          print(f"⚠️ Pattern failed: {e}")
                  
                  return None
              
              def _extract_from_js(self) -> Optional[str]:
                  """
                  Extract video URL directly from JavaScript
                  """
                  if not self.html:
                      return None
                  
                  print("🔍 Searching JavaScript for video URL...")
                  
                  patterns = [
                      r'(?:file|video|src|url)\s*:\s*["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
                      r'<source[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
                      r'<video[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
                      r'data-video\s*=\s*["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
                      r'data-src\s*=\s*["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
                      r'https?://[^"\']*streamtape[^"\']*\.(?:mp4|m3u8)[^"\']*',
                      r'https?://[^"\']*cdn[^"\']*streamtape[^"\']*\.(?:mp4|m3u8)[^"\']*',
                  ]
                  
                  for pattern in patterns:
                      matches = re.findall(pattern, self.html, re.IGNORECASE)
                      for match in matches:
                          if match and match.startswith('http') and ('.mp4' in match or '.m3u8' in match):
                              print(f"✅ Found video URL in JavaScript: {match[:100]}...")
                              return match
                  
                  return None
              
              def _extract_from_beautifulsoup(self) -> Optional[str]:
                  """
                  Extract video URL using BeautifulSoup
                  """
                  if not self.html or not BeautifulSoup:
                      return None
                  
                  print("🔍 Using BeautifulSoup to extract video URL...")
                  
                  try:
                      soup = BeautifulSoup(self.html, 'html.parser')
                      
                      # Look for video tags
                      for video_tag in soup.find_all(['video', 'source']):
                          for attr in ['src', 'data-src', 'data-video']:
                              src = video_tag.get(attr)
                              if src and src.startswith('http') and ('.mp4' in src or '.m3u8' in src):
                                  print(f"✅ Found video URL from video tag: {src[:100]}...")
                                  return src
                      
                      # Look for divs with data attributes
                      for div in soup.find_all('div'):
                          for attr in ['data-video', 'data-url', 'data-src']:
                              src = div.get(attr)
                              if src and src.startswith('http') and ('.mp4' in src or '.m3u8' in src):
                                  print(f"✅ Found video URL from data attribute: {src[:100]}...")
                                  return src
                      
                      # Look for iframes
                      for iframe in soup.find_all('iframe'):
                          src = iframe.get('src')
                          if src and 'streamtape' in src:
                              print(f"🔄 Found iframe: {src}")
                              try:
                                  iframe_response = self.session.get(src, headers=self.headers, timeout=30)
                                  iframe_html = iframe_response.text
                                  # Search for video URL in iframe
                                  iframe_patterns = [
                                      r'(?:file|video|src|url)\s*:\s*["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
                                      r'<source[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
                                  ]
                                  for pattern in iframe_patterns:
                                      matches = re.findall(pattern, iframe_html, re.IGNORECASE)
                                      for match in matches:
                                          if match and match.startswith('http'):
                                              print(f"✅ Found video URL in iframe: {match[:100]}...")
                                              return match
                              except Exception as e:
                                  print(f"⚠️ Could not process iframe: {e}")
                  except Exception as e:
                      print(f"⚠️ BeautifulSoup error: {e}")
                  
                  return None
              
              def extract_video_url(self) -> Optional[str]:
                  """
                  Main method to extract video URL from Streamtape
                  """
                  print(f"🎯 Extracting video from: {self.url}")
                  
                  # Step 1: Fetch the page
                  if not self._fetch_page():
                      return None
                  
                  # Step 2: Try token-based extraction (most reliable)
                  token_data = self._extract_video_id_token()
                  if token_data:
                      token = token_data.get('token')
                      video_id = token_data.get('video_id')
                      if token and video_id:
                          video_url = self._build_video_url(token, video_id)
                          if video_url:
                              return video_url
                  
                  # Step 3: Try JavaScript extraction
                  video_url = self._extract_from_js()
                  if video_url:
                      return video_url
                  
                  # Step 4: Try BeautifulSoup extraction
                  video_url = self._extract_from_beautifulsoup()
                  if video_url:
                      return video_url
                  
                  # Step 5: Look for meta refresh
                  if self.html:
                      meta_refresh = re.search(
                          r'<meta[^>]+http-equiv=["\']refresh["\'][^>]+content=["\'][^"\']+url=([^"\']+)["\']',
                          self.html, re.IGNORECASE
                      )
                      if meta_refresh:
                          redirect_url = meta_refresh.group(1)
                          if redirect_url.startswith('http') and ('.mp4' in redirect_url or '.m3u8' in redirect_url):
                              print(f"✅ Found video URL in meta refresh: {redirect_url[:100]}...")
                              return redirect_url
                  
                  print("❌ Could not extract video URL from page")
                  return None
          
          def download_streamtape_video(url, output_path, max_retries=3):
              """
              Download video from streamtape.com with retries
              """
              print(f"📥 Downloading from streamtape: {url}")
              print(f"💾 Output: {output_path}")
              
              retry_count = 0
              while retry_count < max_retries:
                  if retry_count > 0:
                      print(f"🔄 Retry {retry_count}/{max_retries}...")
                      time.sleep(3 * retry_count)
                  
                  # Get the actual video URL using StreamtapeExtractor
                  extractor = StreamtapeExtractor(url)
                  video_url = extractor.extract_video_url()
                  
                  if not video_url:
                      print(f"❌ Could not extract video URL (attempt {retry_count + 1})")
                      retry_count += 1
                      continue
                  
                  print(f"✅ Extracted video URL: {video_url[:100]}...")
                  
                  # Try different download methods
                  download_success = False
                  
                  # Method 1: aria2 with proper headers
                  print("⏬ Method 1: Trying aria2...")
                  cmd = [
                      "aria2c",
                      "-x", "16",
                      "-s", "16",
                      "-k", "1M",
                      "--continue=true",
                      "--console-log-level=error",
                      "--referer", url,
                      "--header", "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                      "--header", "Accept: */*",
                      "--header", "Connection: keep-alive",
                      "-o", output_path,
                      video_url
                  ]
                  
                  try:
                      result = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                      if result.returncode == 0 and os.path.exists(output_path) and os.path.getsize(output_path) > 0:
                          file_size = os.path.getsize(output_path) / (1024 * 1024)
                          print(f"✅ Download successful with aria2! Size: {file_size:.1f} MB")
                          return True
                      else:
                          print(f"⚠️ aria2 failed: {result.stderr[:200] if result.stderr else 'Unknown error'}")
                  except Exception as e:
                      print(f"⚠️ aria2 error: {e}")
                  
                  # Method 2: curl as fallback
                  print("⏬ Method 2: Trying curl...")
                  curl_cmd = [
                      "curl",
                      "-L",
                      "-o", output_path,
                      "--referer", url,
                      "-H", "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                      "-H", "Accept: */*",
                      "-H", "Connection: keep-alive",
                      video_url
                  ]
                  
                  try:
                      result = subprocess.run(curl_cmd, capture_output=True, text=True, timeout=600)
                      if result.returncode == 0 and os.path.exists(output_path) and os.path.getsize(output_path) > 0:
                          file_size = os.path.getsize(output_path) / (1024 * 1024)
                          print(f"✅ Download successful with curl! Size: {file_size:.1f} MB")
                          return True
                      else:
                          print(f"⚠️ curl failed: {result.stderr[:200] if result.stderr else 'Unknown error'}")
                  except Exception as e:
                      print(f"⚠️ curl error: {e}")
                  
                  # Method 3: ffmpeg for HLS streams
                  if '.m3u8' in video_url:
                      print("⏬ Method 3: Trying ffmpeg for HLS...")
                      ffmpeg_cmd = [
                          "ffmpeg",
                          "-i", video_url,
                          "-c", "copy",
                          "-bsf:a", "aac_adtstoasc",
                          output_path
                      ]
                      try:
                          result = subprocess.run(ffmpeg_cmd, capture_output=True, text=True, timeout=600)
                          if result.returncode == 0 and os.path.exists(output_path) and os.path.getsize(output_path) > 0:
                              file_size = os.path.getsize(output_path) / (1024 * 1024)
                              print(f"✅ Download successful with ffmpeg! Size: {file_size:.1f} MB")
                              return True
                      except Exception as e:
                          print(f"⚠️ ffmpeg error: {e}")
                  
                  retry_count += 1
                  print(f"❌ Download attempt {retry_count} failed")
              
              print(f"❌ All {max_retries} download attempts failed")
              return False
          
          if __name__ == "__main__":
              if len(sys.argv) < 3:
                  print("Usage: python streamtape_downloader.py <url> <output_path>")
                  sys.exit(1)
              
              url = sys.argv[1]
              output_path = sys.argv[2]
              
              success = download_streamtape_video(url, output_path)
              sys.exit(0 if success else 1)
          EOFSTREAMTAPE
          
          echo "✅ Streamtape downloader script created"

      - name: Download All Episodes First
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ github.event.client_payload.label || 'NONE' }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📥 DOWNLOADING ALL EPISODES"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $(cat urls.txt | wc -l)"
          echo "========================================="
          
          TOTAL_EPISODES=$(cat urls.txt | wc -l)
          EP_INDEX=1
          FAILED_DOWNLOADS=""
          
          # Store URLs in array for redownload if needed
          declare -a URL_ARRAY
          while IFS= read -r line; do
            URL_ARRAY+=("$line")
          done < urls.txt
          
          while IFS= read -u 3 -r URL || [ -n "$URL" ]; do
            URL=$(echo "$URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$URL" ]; then continue; fi
            
            EP_NUM=$(printf "%02d" $EP_INDEX)
            OUT_FILE="EP${EP_NUM}.mp4"
            
            echo "========================================="
            echo "📥 Downloading Episode $EP_INDEX/$TOTAL_EPISODES"
            echo "📎 URL: $URL"
            echo "💾 Output: $OUT_FILE"
            echo "========================================="
            
            # Check if it's a streamtape link
            if [[ "$URL" == *"streamtape.com"* ]] || [[ "$URL" == *"streamtape.cc"* ]] || [[ "$URL" == *"streamtape.to"* ]] || [[ "$URL" == *"streamtape.net"* ]]; then
              echo "🎬 Streamtape detected - Using specialized downloader"
              if python3 streamtape_downloader.py "$URL" "$OUT_FILE"; then
                echo "✅ Streamtape download completed successfully"
              else
                echo "⚠️ Streamtape downloader failed, trying alternative methods..."
                echo "🔄 Trying yt-dlp for streamtape..."
                yt-dlp -f "bestvideo+bestaudio/best" \
                  --no-progress --no-warnings \
                  -o "$OUT_FILE" "$URL" < /dev/null 2>&1
                
                if [ ! -f "$OUT_FILE" ] || [ $(stat -c%s "$OUT_FILE" 2>/dev/null || echo "0") -lt 100000 ]; then
                  echo "🔄 Trying with wget..."
                  rm -f "$OUT_FILE"
                  wget --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                       --header="Referer: https://streamtape.com/" \
                       --header="Accept: */*" \
                       -O "$OUT_FILE" "$URL" 2>/dev/null
                fi
              fi
            elif [[ "$URL" == *".m3u8"* ]]; then
              echo "📺 HLS stream - Using ffmpeg"
              ffmpeg -i "$URL" -c copy -bsf:a aac_adtstoasc "$OUT_FILE" 2>/dev/null
            else
              echo "🎬 Direct file - Using aria2c"
              aria2c -x 16 -s 16 -k 1M --continue=true \
                --console-log-level=error \
                -o "$OUT_FILE" "$URL" < /dev/null 2>/dev/null || \
              curl -sSL "$URL" -o "$OUT_FILE" < /dev/null 2>/dev/null
            fi
            
            # If download failed or file is too small, try alternatives
            if [ ! -f "$OUT_FILE" ] || [ $(stat -c%s "$OUT_FILE" 2>/dev/null || echo "0") -lt 100000 ]; then
              echo "⚠️ Initial download failed or file too small, trying alternatives..."
              rm -f "$OUT_FILE"
              
              if [[ "$URL" == *"streamtape.com"* ]] || [[ "$URL" == *"streamtape.cc"* ]]; then
                echo "🔄 Trying ffmpeg for streamtape..."
                ffmpeg -i "$URL" -c copy -bsf:a aac_adtstoasc "$OUT_FILE" 2>/dev/null
              else
                echo "🔄 Trying yt-dlp..."
                yt-dlp -f "bestvideo+bestaudio/best" \
                  --no-progress --no-warnings \
                  -o "$OUT_FILE" "$URL" < /dev/null 2>&1
              fi
            fi
            
            if [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
              FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
              echo "✅ Downloaded: $OUT_FILE (${FILE_SIZE_MB}MB)"
            else
              echo "❌ Download failed for Episode $EP_INDEX"
              FAILED_DOWNLOADS="$FAILED_DOWNLOADS $EP_NUM"
              rm -f "$OUT_FILE"
            fi
            
            EP_INDEX=$((EP_INDEX + 1))
            echo ""
          done 3< urls.txt
          
          echo "========================================="
          echo "📊 DOWNLOAD SUMMARY"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Expected: $TOTAL_EPISODES episodes"
          
          TOTAL_FILES=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          echo "✅ Downloaded: $TOTAL_FILES/$TOTAL_EPISODES episodes"
          
          if [ -n "$FAILED_DOWNLOADS" ]; then
            echo "❌ FAILED DOWNLOADS: $FAILED_DOWNLOADS"
            echo "❌ Not all episodes downloaded successfully!"
            echo "   This is an all-or-nothing workflow. Exiting."
            exit 1
          fi
          
          if [ "$TOTAL_FILES" -ne "$TOTAL_EPISODES" ]; then
            echo "❌ Expected $TOTAL_EPISODES episodes, but only $TOTAL_FILES downloaded!"
            echo "❌ Exiting - all episodes required."
            exit 1
          fi
          
          echo "✅ All $TOTAL_EPISODES episodes downloaded successfully!"
          echo "========================================="

      - name: Compress Episodes Larger Than 80MB
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔧 COMPRESSING EPISODES > 80MB"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "⚡ Using VERY FAST compression preset"
          echo "========================================="
          
          # Get list of all episodes
          EPISODE_FILES=$(ls -1 EP*.mp4 2>/dev/null)
          TOTAL_EPISODES=$(echo "$EPISODE_FILES" | wc -l)
          COMPRESSED_COUNT=0
          FAILED_COMPRESSIONS=""
          
          echo "📊 Checking episode sizes..."
          echo ""
          
          for f in $EPISODE_FILES; do
            if [ ! -f "$f" ]; then continue; fi
            
            FILE_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "0")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            echo "📹 $f: ${FILE_SIZE_MB}MB"
            
            if [ $FILE_SIZE_MB -gt 80 ]; then
              echo "⚠️  $f exceeds 80MB, compressing..."
              
              # Compress with ffmpeg veryfast preset
              TEMP_FILE="${f}.temp.mp4"
              ffmpeg -i "$f" -c:v libx264 -preset veryfast -crf 28 -c:a aac -b:a 128k -movflags +faststart "$TEMP_FILE" 2>/dev/null
              
              if [ -f "$TEMP_FILE" ] && [ -s "$TEMP_FILE" ]; then
                NEW_SIZE=$(stat -c%s "$TEMP_FILE" 2>/dev/null || stat -f%z "$TEMP_FILE" 2>/dev/null || echo "0")
                NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
                
                # Only replace if compressed file is smaller
                if [ $NEW_SIZE -lt $FILE_SIZE ]; then
                  mv "$TEMP_FILE" "$f"
                  echo "✅ $f compressed: ${NEW_SIZE_MB}MB"
                  COMPRESSED_COUNT=$((COMPRESSED_COUNT + 1))
                else
                  rm -f "$TEMP_FILE"
                  echo "⚠️ Compression didn't reduce size, keeping original"
                fi
              else
                rm -f "$TEMP_FILE"
                echo "❌ Failed to compress $f"
                FAILED_COMPRESSIONS="$FAILED_COMPRESSIONS $f"
              fi
            else
              echo "✅ $f already under 80MB, skipping compression"
            fi
            echo ""
          done
          
          echo "========================================="
          echo "📊 COMPRESSION SUMMARY"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📊 Total Episodes: $TOTAL_EPISODES"
          echo "📊 Compressed: $COMPRESSED_COUNT episodes"
          
          if [ -n "$FAILED_COMPRESSIONS" ]; then
            echo "❌ FAILED COMPRESSIONS: $FAILED_COMPRESSIONS"
            echo "❌ Not all episodes compressed successfully!"
            echo "   This is an all-or-nothing workflow. Exiting."
            exit 1
          fi
          
          echo "✅ All episodes processed successfully!"
          echo "========================================="

      - name: Smart Merge Episodes
        id: merge
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔗 MERGING EPISODES"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📊 Episodes: $(ls -1 EP*.mp4 2>/dev/null | wc -l)"
          echo "========================================="
          
          EP_COUNT=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          if [ "$EP_COUNT" -eq 0 ]; then
            echo "❌ No episodes to merge!"
            exit 1
          fi
          
          if [ "$EP_COUNT" -eq 1 ]; then
            echo "📦 Only 1 episode - skipping merge"
            SINGLE_FILE=$(ls EP*.mp4 | head -1)
            cp "$SINGLE_FILE" "output.mp4"
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📊 Found $EP_COUNT episodes to merge"
          
          # Create concat list
          CONCAT_LIST="concat_list.txt"
          > $CONCAT_LIST
          
          for f in $(ls -1 EP*.mp4 | sort -V); do
            if [ -f "$f" ] && [ -s "$f" ]; then
              echo "file '$f'" >> $CONCAT_LIST
              echo "✅ Added: $f"
            fi
          done
          
          echo "🔄 Concatenating files..."
          ffmpeg -f concat -safe 0 -i $CONCAT_LIST -c copy -movflags +faststart "output.mp4" 2>/dev/null
          
          if [ -f "output.mp4" ] && [ -s "output.mp4" ]; then
            echo "✅ Merge successful!"
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            
            echo ""
            echo "========================================="
            echo "📊 FINAL MERGED FILE"
            echo "========================================="
            echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
            echo "📁 File: output.mp4"
            ls -lh output.mp4
            echo "========================================="
          else
            echo "❌ Merge failed!"
            exit 1
          fi

      - name: Verify Merged File
        if: steps.merge.outputs.merge_success == 'true'
        id: verify
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔍 VERIFYING MERGED FILE"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          if [ ! -f "output.mp4" ]; then
            echo "❌ output.mp4 not found!"
            exit 1
          fi
          
          FILE_SIZE_BYTES=$(stat -c%s "output.mp4" 2>/dev/null || stat -f%z "output.mp4" 2>/dev/null || echo "0")
          FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))
          
          echo "📊 File size: ${FILE_SIZE_MB} MB"
          
          if [ $FILE_SIZE_MB -gt 2000 ]; then
            echo "❌ File exceeds 2GB (${FILE_SIZE_MB} MB)"
            echo "   Telegram limit is 2GB!"
            exit 1
          else
            echo "✅ File size: ${FILE_SIZE_MB} MB (under 2GB limit)"
          fi
          
          echo "verify_success=true" >> $GITHUB_OUTPUT
          echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV

      - name: Start Merged Upload
        if: steps.verify.outputs.verify_success == 'true'
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TG_MERGED_CHAT_ID: ${{ secrets.TELEGRAM_MERGED_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TG_MERGED_NAME: ${{ secrets.TELEGRAM_MERGED_NAME }}
          TG_MERGED_INVITE_LINK: ${{ secrets.TELEGRAM_MERGED_INVITE_LINK }}
          MERGED_PATH: ${{ env.merged_file_path }}
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📤 STARTING MERGED UPLOAD"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📁 File: ${{ env.merged_file_path }}"
          echo "========================================="
          
          if [ ! -f "${{ env.merged_file_path }}" ] && [ ! -f "output.mp4" ]; then
            echo "❌ output.mp4 not found!"
            exit 1
          fi
          
          if [ -f "${{ env.merged_file_path }}" ]; then
            export MERGED_PATH="${{ env.merged_file_path }}"
          else
            export MERGED_PATH="$(pwd)/output.mp4"
            echo "⚠️ Using fallback path: $MERGED_PATH"
          fi
          
          echo "📁 Final MERGED_PATH: $MERGED_PATH"
          
          cat > upload_merged.py << 'EOFUPLOAD'
          import os
          import sys
          import subprocess
          import asyncio
          import datetime
          
          try:
              from telethon import TelegramClient
              from telethon.sessions import StringSession
              from telethon.errors import FloodWaitError
              from telethon.tl.types import DocumentAttributeVideo
              import telethon
              print(f"✅ Telethon version: {telethon.__version__}")
          except ImportError as e:
              print(f"❌ Import error: {e}")
              sys.exit(1)
          
          api_id = os.environ.get("TG_API_ID")
          api_hash = os.environ.get("TG_API_HASH")
          session_string = os.environ.get("TG_SESSION_STRING")
          chat_id = int(os.environ.get("TG_MERGED_CHAT_ID")) if os.environ.get("TG_MERGED_CHAT_ID") else None
          video_path = os.environ.get("MERGED_PATH")
          title = os.environ.get("TITLE")
          series_title = os.environ.get("SERIES_TITLE", "Series")
          label = os.environ.get("LABEL", "NONE")
          
          if not all([api_id, api_hash, session_string, chat_id]):
              print("❌ Missing Telegram credentials.")
              sys.exit(0)
          
          async def main():
              try:
                  client = TelegramClient(StringSession(session_string), int(api_id), api_hash)
                  await client.connect()
                  
                  if not await client.is_user_authorized():
                      print("❌ Session invalid")
                      return
                  
                  me = await client.get_me()
                  print(f"✅ Logged in: {me.first_name}")
                  
                  entity = await client.get_entity(chat_id)
                  
                  file_size = os.path.getsize(video_path) / (1024 * 1024)
                  print(f"📤 Uploading {file_size:.1f} MB...")
                  
                  caption = f"{title}\n#UNWATCHED\n#{datetime.datetime.now().strftime('%B%Y').upper()}"
                  
                  await client.send_file(
                      entity,
                      video_path,
                      caption=caption,
                      supports_streaming=True
                  )
                  
                  print("✅ Upload complete!")
                  
              except Exception as e:
                  print(f"❌ Error: {e}")
              
              await client.disconnect()
          
          if __name__ == '__main__':
              asyncio.run(main())
          EOFUPLOAD
          
          nohup python3 -u upload_merged.py > merged_upload.log 2>&1 &
          MERGED_PID=$!
          echo "merged_pid=$MERGED_PID" >> $GITHUB_ENV
          echo "✅ Merged upload started (PID: $MERGED_PID)"

      - name: Upload Single Episodes
        if: steps.verify.outputs.verify_success == 'true'
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TG_SINGLE_EPISODES_CHAT_ID: ${{ secrets.TELEGRAM_SINGLE_EPISODES_CHAT_ID }}
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📤 UPLOADING SINGLE EPISODES"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📊 Episodes: $(ls -1 EP*.mp4 2>/dev/null | wc -l)"
          echo "========================================="
          
          cat > upload_single.py << 'EOFUPLOAD'
          import os
          import sys
          import glob
          import re
          import subprocess
          import asyncio
          import datetime
          
          try:
              from telethon import TelegramClient
              from telethon.sessions import StringSession
              from telethon.errors import FloodWaitError
              from telethon.tl.types import DocumentAttributeVideo
              import telethon
              print(f"✅ Telethon version: {telethon.__version__}")
          except ImportError as e:
              print(f"❌ Import error: {e}")
              sys.exit(1)
          
          api_id = os.environ.get("TG_API_ID")
          api_hash = os.environ.get("TG_API_HASH")
          session_string = os.environ.get("TG_SESSION_STRING")
          chat_id = int(os.environ.get("TG_SINGLE_EPISODES_CHAT_ID")) if os.environ.get("TG_SINGLE_EPISODES_CHAT_ID") else None
          series_title = os.environ.get("SERIES_TITLE", "Series")
          
          if not all([api_id, api_hash, session_string, chat_id]):
              print("❌ Missing Telegram credentials.")
              sys.exit(0)
          
          async def main():
              try:
                  client = TelegramClient(StringSession(session_string), int(api_id), api_hash)
                  await client.connect()
                  
                  if not await client.is_user_authorized():
                      print("❌ Session invalid")
                      return
                  
                  me = await client.get_me()
                  print(f"✅ Logged in: {me.first_name}")
                  
                  entity = await client.get_entity(chat_id)
                  
                  ep_files = sorted(glob.glob("EP*.mp4"), 
                      key=lambda f: int(re.search(r'EP(\d+)\.mp4', f).group(1)) if re.search(r'EP(\d+)\.mp4', f) else 0)
                  
                  if not ep_files:
                      print("❌ No episode files found!")
                      return
                  
                  print(f"📊 Found {len(ep_files)} episodes to upload")
                  
                  for ep_file in ep_files:
                      ep_match = re.search(r'EP(\d+)\.mp4', ep_file)
                      if not ep_match:
                          continue
                      ep_num = int(ep_match.group(1))
                      
                      file_size = os.path.getsize(ep_file) / (1024 * 1024)
                      print(f"📤 Uploading Episode {ep_num} ({file_size:.1f} MB)...")
                      
                      caption = f"📺 Episode {ep_num} - {series_title}"
                      
                      try:
                          await client.send_file(
                              entity,
                              ep_file,
                              caption=caption,
                              supports_streaming=True
                          )
                          print(f"✅ Episode {ep_num} uploaded")
                      except FloodWaitError as e:
                          print(f"⏳ Rate limited: waiting {e.seconds}s")
                          await asyncio.sleep(e.seconds)
                          await client.send_file(
                              entity,
                              ep_file,
                              caption=caption,
                              supports_streaming=True
                          )
                          print(f"✅ Episode {ep_num} uploaded")
                      except Exception as e:
                          print(f"❌ Episode {ep_num} error: {e}")
                      
                      await asyncio.sleep(1)
                  
                  print("✅ All episodes uploaded!")
                  
              except Exception as e:
                  print(f"❌ Error: {e}")
              
              await client.disconnect()
          
          if __name__ == '__main__':
              asyncio.run(main())
          EOFUPLOAD
          
          python3 -u upload_single.py
          echo "done" > single_episodes_complete.txt

      - name: Wait for Uploads
        if: steps.verify.outputs.verify_success == 'true'
        run: |
          cd downloads
          
          echo "========================================="
          echo "⏳ WAITING FOR UPLOADS TO COMPLETE"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          # Wait for merged upload
          if [ -n "${{ env.merged_pid }}" ]; then
            echo "⏳ Waiting for merged upload (PID: ${{ env.merged_pid }})..."
            tail -f merged_upload.log &
            wait ${{ env.merged_pid }} 2>/dev/null || true
            echo "✅ Merged upload complete!"
          fi
          
          # Wait for single episodes
          echo "⏳ Waiting for single episodes..."
          while [ ! -f "single_episodes_complete.txt" ]; do
            sleep 2
          done
          echo "✅ Single episodes complete!"
          
          echo "========================================="
          echo "✅ ALL UPLOADS COMPLETED!"
          echo "========================================="

      - name: Cleanup - Delete Workflow Run if Successful
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const runId = context.runId;
            const repo = context.repo;
            
            console.log(`🧹 Cleaning up workflow run ${runId}`);
            console.log(`📦 Repository: ${repo.owner}/${repo.repo}`);
            
            try {
              await github.rest.actions.deleteWorkflowRun({
                owner: repo.owner,
                repo: repo.repo,
                run_id: runId
              });
              console.log(`✅ Successfully deleted workflow run ${runId}`);
            } catch (error) {
              console.log(`❌ Failed to delete workflow run: ${error.message}`);
              if (error.status === 403) {
                console.log('⚠️ Permission denied. The token may not have "actions: write" permission.');
                console.log('ℹ️ You may need to manually delete this workflow run.');
              } else if (error.status === 404) {
                console.log('⚠️ Workflow run not found. It may have been already deleted.');
              } else {
                console.log(`⚠️ Error details: ${JSON.stringify(error, null, 2)}`);
              }
              console.log('ℹ️ Continuing workflow execution...');
            }
