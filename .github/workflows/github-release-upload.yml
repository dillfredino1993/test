      - name: Wait for All Uploads with Enhanced Progress Monitoring
        if: steps.verify.outputs.verify_success == 'true'
        run: |
          cd downloads
          
          echo "========================================="
          echo "⏳ MONITORING UPLOAD PROGRESS"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          # Function to check if merged upload process is still running
          is_merged_running() {
            if [ -n "${{ env.merged_pid }}" ]; then
              if kill -0 ${{ env.merged_pid }} 2>/dev/null; then
                return 0  # Running
              fi
            fi
            return 1  # Not running
          }
          
          # Function to parse progress from log files
          get_merged_progress() {
            if [ -f "merged_progress.log" ]; then
              # Check if upload is complete first
              if grep -q "UPLOAD_COMPLETE" merged_progress.log; then
                echo "100|complete"
                return
              fi
              
              # Look for progress lines
              local last_progress=$(grep -E "[0-9]+\.[0-9]+%.*[0-9]+\.[0-9]+/[0-9]+\.[0-9]+ MB" merged_progress.log | tail -1)
              if [ -n "$last_progress" ]; then
                # Extract percentage
                local percent=$(echo "$last_progress" | grep -oE "[0-9.]+\%" | sed 's/%//')
                # Extract uploaded and total
                local uploaded=$(echo "$last_progress" | grep -oE "[0-9.]+\/[0-9.]+ MB" | sed 's/ MB//')
                echo "$percent|$uploaded"
              else
                echo "0|0.0/0.0"
              fi
            else
              echo "0|0.0/0.0"
            fi
          }
          
          # Function to get episode upload progress
          get_episode_progress() {
            if [ -f "single_episodes_complete.txt" ]; then
              echo "100|complete"
              return
            fi
            
            if [ -f "episode_upload.log" ]; then
              # Count total episodes
              local total_eps=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
              # Count completed episodes
              local completed=$(grep -c "COMPLETE_EP_" episode_upload.log 2>/dev/null || echo "0")
              
              if [ "$total_eps" -gt 0 ]; then
                local percent=$((completed * 100 / total_eps))
                echo "$percent|${completed}/${total_eps}"
              else
                echo "0|0/0"
              fi
            else
              echo "0|0/0"
            fi
          }
          
          # Function to calculate ETA
          calculate_eta() {
            local current=$1
            local total=$2
            local elapsed_seconds=$3
            
            if [ "$current" = "0" ] || [ "$total" = "0" ]; then
              echo "Calculating..."
              return
            fi
            
            local percent=$(echo "scale=2; ($current / $total) * 100" | bc 2>/dev/null || echo "0")
            if [ "$(echo "$percent > 0" | bc)" = "0" ]; then
              echo "Calculating..."
              return
            fi
            
            local remaining_percent=$(echo "scale=2; 100 - $percent" | bc 2>/dev/null || echo "0")
            if [ "$(echo "$remaining_percent <= 0" | bc)" = "1" ]; then
              echo "0s"
              return
            fi
            
            local elapsed_seconds_float=$(echo "$elapsed_seconds" | bc -l 2>/dev/null || echo "1")
            local rate=$(echo "scale=2; $current / $elapsed_seconds_float" | bc -l 2>/dev/null || echo "1")
            if [ "$(echo "$rate < 0.001" | bc)" = "1" ]; then
              echo "Calculating..."
              return
            fi
            
            local remaining_mb=$(echo "scale=2; $total - $current" | bc -l 2>/dev/null || echo "0")
            local eta_seconds=$(echo "scale=0; $remaining_mb / $rate" | bc -l 2>/dev/null || echo "0")
            
            if [ "$eta_seconds" -lt 1 ]; then
              echo "0s"
            elif [ "$eta_seconds" -lt 60 ]; then
              echo "${eta_seconds}s"
            elif [ "$eta_seconds" -lt 3600 ]; then
              local minutes=$((eta_seconds / 60))
              local seconds=$((eta_seconds % 60))
              echo "${minutes}m ${seconds}s"
            else
              local hours=$((eta_seconds / 3600))
              local minutes=$(((eta_seconds % 3600) / 60))
              echo "${hours}h ${minutes}m"
            fi
          }
          
          # Function to get current episode
          get_current_episode() {
            if [ -f "episode_upload.log" ]; then
              local current=$(grep "STARTING_EP_" episode_upload.log 2>/dev/null | tail -1 | grep -oE "[0-9]+" | head -1)
              if [ -n "$current" ]; then
                echo "$current"
              else
                echo "-"
              fi
            else
              echo "-"
            fi
          }
          
          # Main monitoring loop
          START_TIME=$(date +%s)
          MERGED_COMPLETE=false
          EPISODES_COMPLETE=false
          NO_PROGRESS_COUNT=0
          LAST_MERGED_PERCENT=-1
          
          echo ""
          echo "🔄 Monitoring upload progress..."
          echo "   (Updates every 5 seconds)"
          echo ""
          
          while true; do
            # Check if both are complete first
            if [ -f "single_episodes_complete.txt" ]; then
              EPISODES_COMPLETE=true
            fi
            
            # Check merged completion - either from log or process ended
            if [ -f "merged_progress.log" ] && grep -q "UPLOAD_COMPLETE" merged_progress.log; then
              MERGED_COMPLETE=true
            elif ! is_merged_running && [ -f "merged_upload.log" ]; then
              # Process ended, check if it was successful
              if tail -20 merged_upload.log | grep -q "✅ Merged video uploaded!"; then
                MERGED_COMPLETE=true
                # Write completion marker if missing
                if ! grep -q "UPLOAD_COMPLETE" merged_progress.log 2>/dev/null; then
                  echo "$(date): UPLOAD_COMPLETE" >> merged_progress.log
                fi
              fi
            fi
            
            # If both complete, break out of loop
            if [ "$MERGED_COMPLETE" = true ] && [ "$EPISODES_COMPLETE" = true ]; then
              echo ""
              echo "✅ ALL UPLOADS COMPLETED!"
              echo ""
              break
            fi
            
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            # Format elapsed time
            if [ $ELAPSED -lt 60 ]; then
              ELAPSED_STR="${ELAPSED}s"
            elif [ $ELAPSED -lt 3600 ]; then
              ELAPSED_STR="$((ELAPSED / 60))m $((ELAPSED % 60))s"
            else
              ELAPSED_STR="$((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m"
            fi
            
            clear 2>/dev/null || printf "\033c" 2>/dev/null || echo ""
            
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║           📤 UPLOAD PROGRESS MONITOR                        ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║ ⏱️  Elapsed Time: $(printf "%-40s" "$ELAPSED_STR")║"
            echo "║ 📺 Series: $(printf "%-47s" "${{ steps.fname.outputs.series_title }}")║"
            echo "║                                                              ║"
            
            # Merged Upload Progress
            MERGED_PROGRESS=$(get_merged_progress)
            MERGED_PERCENT=$(echo "$MERGED_PROGRESS" | cut -d'|' -f1)
            MERGED_DATA=$(echo "$MERGED_PROGRESS" | cut -d'|' -f2)
            
            if [ "$MERGED_COMPLETE" = true ] || [ "$MERGED_DATA" = "complete" ]; then
              MERGED_COMPLETE=true
              echo "║ 📹 Merged Video:                                        ║"
              echo "║    Status: ✅ COMPLETE                                   ║"
              echo "║    Progress: 100%                                       ║"
              BAR_LENGTH=40
              BAR=""
              for ((i=0; i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
              echo "║    [${BAR}] ║"
              echo "║                                                              ║"
            elif [ "$MERGED_PERCENT" != "0" ] && [ "$MERGED_PERCENT" != "100" ]; then
              echo "║ 📹 Merged Video:                                        ║"
              echo "║    Progress: $(printf "%-51s" "${MERGED_PERCENT}%")║"
              
              # Create progress bar
              BAR_LENGTH=40
              FILLED=$(echo "scale=0; ($MERGED_PERCENT * $BAR_LENGTH) / 100" | bc 2>/dev/null || echo "0")
              BAR=""
              for ((i=0; i<$FILLED && i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
              for ((i=$FILLED; i<$BAR_LENGTH; i++)); do BAR="${BAR}░"; done
              echo "║    [${BAR}] ║"
              
              # ETA calculation
              if [[ "$MERGED_DATA" == *"/"* ]]; then
                UPLOADED=$(echo "$MERGED_DATA" | cut -d'/' -f1)
                TOTAL=$(echo "$MERGED_DATA" | cut -d'/' -f2)
                
                if [[ "$UPLOADED" =~ ^[0-9.]+$ ]] && [[ "$TOTAL" =~ ^[0-9.]+$ ]]; then
                  ETA=$(calculate_eta "$UPLOADED" "$TOTAL" "$ELAPSED")
                  SPEED=$(echo "scale=2; $UPLOADED / $ELAPSED" | bc -l 2>/dev/null || echo "0")
                  if [ "$SPEED" != "0" ] && [ "$SPEED" != ".00" ]; then
                    echo "║    Speed: $(printf "%-49s" "${SPEED} MB/s")║"
                  fi
                  echo "║    ETA: $(printf "%-51s" "$ETA")║"
                fi
              fi
              echo "║                                                              ║"
            elif is_merged_running; then
              echo "║ 📹 Merged Video: Uploading...                           ║"
              echo "║    Status: ⏳ In Progress                                 ║"
              echo "║                                                              ║"
            else
              echo "║ 📹 Merged Video: Starting...                             ║"
              echo "║                                                              ║"
            fi
            
            # Episode Upload Progress
            echo "║ 📺 Single Episodes:                                        ║"
            
            EP_PROGRESS=$(get_episode_progress)
            EP_PERCENT=$(echo "$EP_PROGRESS" | cut -d'|' -f1)
            EP_DATA=$(echo "$EP_PROGRESS" | cut -d'|' -f2)
            
            if [ "$EPISODES_COMPLETE" = true ] || [ "$EP_DATA" = "complete" ]; then
              EPISODES_COMPLETE=true
              echo "║    Status: ✅ COMPLETE                                     ║"
              BAR_LENGTH=40
              BAR=""
              for ((i=0; i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
              echo "║    [${BAR}] ║"
            else
              TOTAL_EPISODES=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
              COMPLETED=$(echo "$EP_DATA" | cut -d'/' -f1 2>/dev/null || echo "0")
              
              if [ "$TOTAL_EPISODES" -gt 0 ]; then
                echo "║    Progress: $(printf "%-51s" "${EP_PERCENT}% (${COMPLETED}/${TOTAL_EPISODES} episodes)")║"
                
                # Create progress bar
                BAR_LENGTH=40
                FILLED=$((EP_PERCENT * BAR_LENGTH / 100))
                BAR=""
                for ((i=0; i<$FILLED && i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
                for ((i=$FILLED; i<$BAR_LENGTH; i++)); do BAR="${BAR}░"; done
                echo "║    [${BAR}] ║"
                
                # Get current episode
                CURRENT_EP=$(get_current_episode)
                if [ "$CURRENT_EP" != "-" ]; then
                  echo "║    Current: Episode $(printf "%-42s" "$CURRENT_EP")║"
                fi
                
                # ETA for episodes
                if [ "$COMPLETED" -gt 0 ] && [ "$ELAPSED" -gt 10 ]; then
                  AVG_TIME_PER_EP=$((ELAPSED / COMPLETED))
                  REMAINING=$((TOTAL_EPISODES - COMPLETED))
                  ETA_SECONDS=$((AVG_TIME_PER_EP * REMAINING))
                  if [ $ETA_SECONDS -lt 60 ]; then
                    EP_ETA="${ETA_SECONDS}s"
                  elif [ $ETA_SECONDS -lt 3600 ]; then
                    EP_ETA="$((ETA_SECONDS / 60))m $((ETA_SECONDS % 60))s"
                  else
                    EP_ETA="$((ETA_SECONDS / 3600))h $(((ETA_SECONDS % 3600) / 60))m"
                  fi
                  echo "║    ETA: $(printf "%-51s" "$EP_ETA")║"
                fi
              else
                echo "║    Status: No episodes found                             ║"
              fi
            fi
            echo "║                                                              ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            
            # Check for errors (brief check)
            if [ -f "merged_upload.log" ]; then
              if tail -5 merged_upload.log 2>/dev/null | grep -q "❌"; then
                echo ""
                echo "⚠️  Warning: Possible errors detected in merged upload log"
