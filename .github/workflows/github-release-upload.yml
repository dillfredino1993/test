                BAR=""
                for ((i=0; i<$FILLED && i<$BAR_LENGTH; i++)); do BAR="${BAR}█"; done
                for ((i=$FILLED; i<$BAR_LENGTH; i++)); do BAR="${BAR}░"; done
                echo "║    [${BAR}] ║"
                
                # Get current episode
                CURRENT_EP=$(get_current_episode)
                if [ "$CURRENT_EP" != "-" ]; then
                  echo "║    Current: Episode $(printf "%-42s" "$CURRENT_EP")║"
                fi
                
                # ETA for episodes
                if [ "$COMPLETED" -gt 0 ] && [ "$ELAPSED" -gt 10 ]; then
                  AVG_TIME_PER_EP=$((ELAPSED / COMPLETED))
                  REMAINING=$((TOTAL_EPISODES - COMPLETED))
                  ETA_SECONDS=$((AVG_TIME_PER_EP * REMAINING))
                  if [ $ETA_SECONDS -lt 60 ]; then
                    EP_ETA="${ETA_SECONDS}s"
                  elif [ $ETA_SECONDS -lt 3600 ]; then
                    EP_ETA="$((ETA_SECONDS / 60))m $((ETA_SECONDS % 60))s"
                  else
                    EP_ETA="$((ETA_SECONDS / 3600))h $(((ETA_SECONDS % 3600) / 60))m"
                  fi
                  echo "║    ETA: $(printf "%-51s" "$EP_ETA")║"
                fi
              else
                echo "║    Status: No episodes found                             ║"
              fi
            fi
            echo "║                                                              ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            
            # Check for errors (brief check)
            if [ -f "merged_upload.log" ]; then
              if tail -5 merged_upload.log 2>/dev/null | grep -q "❌"; then
                echo ""
                echo "⚠️  Warning: Possible errors detected in merged upload log"
                echo "   Check merged_upload.log for details"
              fi
            fi
            
            # If merged upload is at 100% but not marked complete for a while, force complete
            if [ "$MERGED_PERCENT" = "100" ] && [ "$MERGED_COMPLETE" = false ]; then
              NO_PROGRESS_COUNT=$((NO_PROGRESS_COUNT + 1))
              if [ $NO_PROGRESS_COUNT -gt 6 ]; then  # After 30 seconds (6 * 5s)
                echo ""
                echo "⚠️  Merged upload at 100% but not marked complete..."
                echo "   Checking if process is still running..."
                
                if ! is_merged_running; then
                  echo "✅ Process ended, marking as complete..."
                  echo "$(date): UPLOAD_COMPLETE" >> merged_progress.log
                  MERGED_COMPLETE=true
                else
                  echo "⚠️  Process still running, waiting..."
                  NO_PROGRESS_COUNT=0
                fi
              fi
            else
              NO_PROGRESS_COUNT=0
            fi
            
            sleep 5
          done
          
          echo "========================================="
          echo "✅ ALL UPLOADS COMPLETED SUCCESSFULLY!"
          echo "========================================="
          
          # Show final logs
          if [ -f "merged_upload.log" ]; then
            echo ""
            echo "📋 Final merged upload log:"
            echo "========================================="
            tail -20 merged_upload.log
            echo "========================================="
          fi
          
          echo ""
          echo "📊 Upload Summary:"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "⏱️  Total Time: $ELAPSED_STR"
          
          # Get final merged file size
          if [ -f "merged_progress.log" ]; then
            FINAL_SIZE=$(grep -E "[0-9]+\.[0-9]+/[0-9]+\.[0-9]+ MB" merged_progress.log | tail -1 | grep -oE "[0-9.]+\/[0-9.]+ MB" | tail -1)
            if [ -n "$FINAL_SIZE" ]; then
              echo "📹 Merged Video Size: $FINAL_SIZE"
            fi
          fi
          
          EP_COUNT=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          if [ -f "single_episodes_complete.txt" ]; then
            echo "📺 Episodes Uploaded: $EP_COUNT"
          fi
          
          echo "========================================="
          if [ -f "single_episodes_complete.txt" ] && [ -f "merged_progress.log" ] && grep -q "UPLOAD_COMPLETE" merged_progress.log; then
            echo "🎉 All uploads completed successfully!"
          fi
          echo "========================================="

      - name: Cleanup - Delete Workflow Run if Successful
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const runId = context.runId;
            const repo = context.repo;
            
            console.log(`🧹 Cleaning up workflow run ${runId}`);
            console.log(`📦 Repository: ${repo.owner}/${repo.repo}`);
            
            try {
              await github.rest.actions.deleteWorkflowRun({
                owner: repo.owner,
                repo: repo.repo,
                run_id: runId
              });
              console.log(`✅ Successfully deleted workflow run ${runId}`);
            } catch (error) {
              console.log(`❌ Failed to delete workflow run: ${error.message}`);
              if (error.status === 403) {
                console.log('⚠️ Permission denied. The token may not have "actions: write" permission.');
                console.log('ℹ️ You may need to manually delete this workflow run.');
              } else if (error.status === 404) {
                console.log('⚠️ Workflow run not found. It may have been already deleted.');
              } else {
                console.log(`⚠️ Error details: ${JSON.stringify(error, null, 2)}`);
              }
              console.log('ℹ️ Continuing workflow execution...');
            }
