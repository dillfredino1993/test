      - name: Cleanup - Delete Workflow Run if Successful
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const runId = context.runId;
            const repo = context.repo;
            
            console.log(`🧹 Cleaning up workflow run ${runId}`);
            console.log(`📦 Repository: ${repo.owner}/${repo.repo}`);
            
            try {
              await github.rest.actions.deleteWorkflowRun({
                owner: repo.owner,
                repo: repo.repo,
                run_id: runId
              });
              console.log(`✅ Successfully deleted workflow run ${runId}`);
            } catch (error) {
              console.log(`❌ Failed to delete workflow run: ${error.message}`);
              if (error.status === 403) {
                console.log('⚠️ Permission denied. The token may not have "actions: write" permission.');
                console.log('ℹ️ You may need to manually delete this workflow run.');
              } else if (error.status === 404) {
                console.log('⚠️ Workflow run not found. It may have been already deleted.');
              } else {
                console.log(`⚠️ Error details: ${JSON.stringify(error, null, 2)}`);
              }
              console.log('ℹ️ Continuing workflow execution...');
            }
