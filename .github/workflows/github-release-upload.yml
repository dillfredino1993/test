name: GitHub Telegram & Media Pipeline

on:
  repository_dispatch:
    types: [github_release_upload]

# ONLY ONE WORKFLOW RUN AT A TIME
concurrency:
  group: media-pipeline-processor
  cancel-in-progress: false
  queue: max

# Add permissions for deleting workflow runs
permissions:
  actions: write
  contents: read

# ⏳ Seconds to wait between each episode download.
# Change the default here, or override per run by sending
# "download_delay": <seconds> in the repository_dispatch payload.
env:
  DOWNLOAD_DELAY: 15
  MIN_UPLOAD_SPEED_MBPS: 0.5  # Minimum speed in MB/s before considering slow
  RESTART_ATTEMPTS: 3         # Max restart attempts

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📋 Series Information & Setup
        run: |
          echo "========================================="
          echo "📋 SERIES INFORMATION"
          echo "========================================="
          
          # Extract series information from payload
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Unknown Series' }}"
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          EPISODE_COUNT="${{ github.event.client_payload.episode_count || 'Unknown' }}"
          
          echo "📺 Series Title: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "📊 Episode Count: $EPISODE_COUNT"
          echo "⏰ Started at: $(date)"
          echo "========================================="
          
          # Store for later use
          echo "series_title=$SERIES" >> $GITHUB_ENV
          echo "label=$LABEL" >> $GITHUB_ENV
          
          # Create a file to track workflow progress
          echo "STARTED" > workflow_status.txt

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Tools & Dependencies
        timeout-minutes: 5
        id: install_tools
        run: |
          echo "========================================="
          echo "🔧 INSTALLING TOOLS"
          echo "========================================="
          
          # Prevent interactive debconf prompts and disable needrestart hangs
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          export NEEDRESTART_SUSPEND=1
          sudo rm -f /etc/apt/apt.conf.d/99needrestart /var/lib/man-db/auto-update 2>/dev/null || true
          
          APT_FLAGS="-y -qq --no-install-recommends -o DPkg::Lock::Timeout=120 -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          
          echo "📦 Updating apt cache..."
          sudo apt-get update -qq -o Acquire::ForceIPv4=true -o Acquire::Retries=3 || true
          
          echo "📦 Installing system packages (aria2, mkvtoolnix, mediainfo, exiftool, bc)..."
          sudo apt-get install $APT_FLAGS ffmpeg aria2 mkvtoolnix mediainfo libimage-exiftool-perl bc jq || {
            echo "⚠️ Retrying package install individually..."
            for pkg in ffmpeg aria2 mkvtoolnix mediainfo libimage-exiftool-perl bc jq; do
              sudo apt-get install $APT_FLAGS "$pkg" || echo "⚠️ Warning: $pkg install failed"
            done
          }

          echo "📦 Upgrading pip and installing Python packages..."
          python3 -m pip install --no-cache-dir --upgrade pip
          python3 -m pip install --no-cache-dir \
            "yt-dlp[default,curl-cffi]" \
            "curl_cffi" \
            "telethon==1.34.0" \
            "requests" \
            "aiohttp" \
            "python-socks[asyncio]" \
            "qrcode"

          echo "🔍 Verifying installed tools:"
          command -v ffmpeg &>/dev/null && echo "✅ ffmpeg: $(which ffmpeg)" || echo "⚠️ ffmpeg missing"
          command -v aria2c &>/dev/null && echo "✅ aria2c: $(which aria2c)" || echo "⚠️ aria2c missing"
          command -v mkvmerge &>/dev/null && echo "✅ mkvmerge: $(which mkvmerge)" || echo "⚠️ mkvmerge missing"
          command -v mediainfo &>/dev/null && echo "✅ mediainfo: $(which mediainfo)" || echo "⚠️ mediainfo missing"
          python3 -c "import telethon; print(f'✅ Telethon {telethon.__version__}')" || echo "⚠️ Telethon missing"
          python3 -c "import yt_dlp, curl_cffi; print('✅ yt-dlp & curl_cffi ready')" || echo "⚠️ yt-dlp / curl_cffi missing"
          echo "========================================="
          echo "✅ INSTALLATION COMPLETE"
          echo "========================================="
          
          # Show versions
          echo "📊 Tool versions:"
          ffmpeg -version | head -1 || echo "⚠️ ffmpeg not found"
          aria2c --version | head -1 || echo "⚠️ aria2 not found"
          python3 --version || echo "⚠️ python3 not found"
          python3 -c "import telethon; print(f'Telethon {telethon.__version__}')" 2>/dev/null || echo "⚠️ Telethon not found"
          echo "========================================="
          
          echo "INSTALLED" > ../tools_installed.txt

      - name: Compute Dynamic Formatted Output Filename & Label
        id: fname
        run: |
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Series' }}"
          
          echo "========================================="
          echo "📝 COMPUTING FILENAME"
          echo "========================================="
          echo "📺 Series: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "========================================="
          
          CLEAN_LABEL=$(echo "$LABEL" | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          CLEAN_SERIES_TITLE=$(echo "$SERIES" | sed -e 's/[\/:*?"<>|]/_/g' -e 's/^ *//' -e 's/ *$//')
          CLEAN_SERIES_TAG=$(echo "$CLEAN_SERIES_TITLE" | tr ' ' '_')
          
          # Use telegram date for the title/date (fallback to today's date if blank)
          TELEGRAM_DATE="${{ github.event.client_payload.telegramdate }}"
          if [ -z "$TELEGRAM_DATE" ] || [ "$TELEGRAM_DATE" = "null" ]; then
            TELEGRAM_DATE=$(date +'%Y-%m-%d')
          fi
          DATE_STR="${TELEGRAM_DATE}"
          
          TAG_NAME="${DATE_STR}-${CLEAN_LABEL}-${CLEAN_SERIES_TAG}"
          FORMATTED_TITLE="[${DATE_STR}]-[${CLEAN_LABEL}]-${CLEAN_SERIES_TITLE}"
          
          echo "📄 Formatted Title: $FORMATTED_TITLE"
          echo "🏷️  Tag Name: $TAG_NAME"
          echo "========================================="
          
          echo "formatted_title=${FORMATTED_TITLE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "series_title=${CLEAN_SERIES_TITLE}" >> $GITHUB_OUTPUT
          echo "clean_label=${CLEAN_LABEL}" >> $GITHUB_OUTPUT

      - name: 📋 Extract Payload Fields (Telegram Date, Provider, Description, Poster)
        id: payload
        run: |
          echo "========================================="
          echo "📋 EXTRACTING PAYLOAD FIELDS"
          echo "========================================="
          
          # Telegram date (default to today's date)
          TELEGRAM_DATE="${{ github.event.client_payload.telegramdate }}"
          if [ -z "$TELEGRAM_DATE" ] || [ "$TELEGRAM_DATE" = "null" ]; then
            TELEGRAM_DATE=$(date +'%Y-%m-%d')
          fi
          echo "📅 Telegram Date: $TELEGRAM_DATE"
          
          # Series provider (default to N/A)
          SERIES_PROVIDER="${{ github.event.client_payload.series_provider }}"
          if [ -z "$SERIES_PROVIDER" ] || [ "$SERIES_PROVIDER" = "null" ]; then
            SERIES_PROVIDER="N/A"
          fi
          echo "🏢 Series Provider: $SERIES_PROVIDER"
          
          # Series description (default to N/A)
          SERIES_DESCRIPTION="${{ github.event.client_payload.series_description }}"
          if [ -z "$SERIES_DESCRIPTION" ] || [ "$SERIES_DESCRIPTION" = "null" ]; then
            SERIES_DESCRIPTION="N/A"
          fi
          echo "📝 Series Description: $SERIES_DESCRIPTION"
          
          # Poster URL (can be blank; if blank, skip poster entirely)
          POSTER_URL="${{ github.event.client_payload.poster_url }}"
          echo "🖼️ Poster URL: $POSTER_URL"
          
          # Provider tag for hashtags: strip non-alphanumerics, uppercase
          PROVIDER_TAG=$(echo "$SERIES_PROVIDER" | sed -e 's/[^a-zA-Z0-9]//g' | tr '[:lower:]' '[:upper:]')
          if [ -z "$PROVIDER_TAG" ]; then
            PROVIDER_TAG="N/A"
          fi
          echo "🏷️  Provider Tag: $PROVIDER_TAG"
          echo "========================================="
          
          echo "telegram_date=${TELEGRAM_DATE}" >> $GITHUB_OUTPUT
          echo "series_provider=${SERIES_PROVIDER}" >> $GITHUB_OUTPUT
          echo "series_description=${SERIES_DESCRIPTION}" >> $GITHUB_OUTPUT
          echo "poster_url=${POSTER_URL}" >> $GITHUB_OUTPUT
          echo "provider_tag=${PROVIDER_TAG}" >> $GITHUB_OUTPUT

      - name: Parse URLs with jq (Clean & Uncorrupted)
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "========================================="
          echo "📋 PARSING URLs"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          mkdir -p downloads && cd downloads
          
          # Extract URLs cleanly: remove \r carriage returns and trim whitespace
          echo "$CLIENT_PAYLOAD" | tr -d '\r' | jq -r '
            (.episodes[]?.url // .video_urls[]? // .video_url // .url // empty)
            | tostring | gsub("^\\s+|\\s+$"; "")
          ' > urls.txt
          
          # Remove empty lines
          sed -i '/^$/d' urls.txt
          
          echo "========================================="
          echo "📋 URLs to download:"
          cat urls.txt
          echo "========================================="
          
          echo "total_episodes=$(cat urls.txt | wc -l)" >> $GITHUB_ENV
          
          if [ ! -s urls.txt ]; then
            echo "❌ No valid URLs found!"
            exit 1
          fi
          
          echo "✅ Found $(cat urls.txt | wc -l) URLs"

      - name: Download All Episodes First
        timeout-minutes: 120
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ github.event.client_payload.label || 'NONE' }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📥 DOWNLOADING ALL EPISODES"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $(cat urls.txt | wc -l)"
          echo "========================================="
          
          TOTAL_EPISODES=$(cat urls.txt | wc -l)
          EP_INDEX=1
          FAILED_DOWNLOADS=""

          # Resolve inter-episode delay: payload override > workflow default
          DELAY="${DOWNLOAD_DELAY:-30}"
          PAYLOAD_DELAY="${{ github.event.client_payload.download_delay || '' }}"
          if [ -n "$PAYLOAD_DELAY" ] && [[ "$PAYLOAD_DELAY" =~ ^[0-9]+$ ]]; then
            DELAY="$PAYLOAD_DELAY"
          fi
          echo "⏳ Inter-episode delay: ${DELAY}s"
          
          # Store URLs in array for redownload if needed
          declare -a URL_ARRAY
          while IFS= read -r line; do
            URL_ARRAY+=("$line")
          done < urls.txt
          
          # Function to check if file has video and audio
          check_file_validity() {
            local file="$1"
            if [ ! -f "$file" ] || [ ! -s "$file" ]; then
              echo "❌ File missing or empty: $file"
              return 1
            fi
            
            local file_size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
            if [ "$file_size" -lt 100000 ]; then
              echo "❌ File too small (${file_size} bytes): $file"
              return 1
            fi
            
            # Check for video stream
            local has_video=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$file" 2>/dev/null)
            if [ -z "$has_video" ] || [ "$has_video" != "video" ]; then
              echo "❌ No video stream in: $file"
              return 1
            fi
            
            # Get resolution
            local width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$file" 2>/dev/null)
            local height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file" 2>/dev/null)
            
            if [ -n "$width" ] && [ "$width" != "0" ] && [ -n "$height" ] && [ "$height" != "0" ]; then
              local has_audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$file" 2>/dev/null)
              if [ -n "$has_audio" ] && [ "$has_audio" = "audio" ]; then
                echo "✅ ${file}: ${width}x${height}, $(($file_size/1024/1024))MB, with audio"
              else
                echo "⚠️ ${file}: ${width}x${height}, $(($file_size/1024/1024))MB, NO AUDIO"
              fi
              return 0
            else
              echo "❌ Invalid resolution (${width}x${height}) in: $file"
              return 1
            fi
          }
          
          # Function to download with yt-dlp and select highest quality
          download_with_ytdlp() {
            local url="$1"
            local output="$2"
            local episode="$3"
            
            echo "⬇️  Downloading episode $episode with yt-dlp..."
            
            # Try multiple format strategies in order of preference
            local format_selectors=(
              "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best[ext=mp4]/best"
              "bestvideo+bestaudio/best"
              "best[ext=mp4]/best"
            )
            
            local success=false
            
            for format_selector in "${format_selectors[@]}"; do
              if [ "$success" = false ]; then
                yt-dlp \
                  --extractor-args "generic:impersonate" \
                  --impersonate chrome \
                  -f "$format_selector" \
                  --merge-output-format mp4 \
                  --no-warnings \
                  --progress \
                  --newline \
                  --geo-bypass \
                  --no-check-certificates \
                  --socket-timeout 300 \
                  --retries 5 \
                  --fragment-retries 5 \
                  -o "$output" \
                  "$url" 2>&1 | grep -E "(Downloading|Merging|file size|Destination|height|[0-9]+x[0-9]+|format)" || true
                
                if [ ${PIPESTATUS[0]} -eq 0 ] && [ -f "$output" ] && [ -s "$output" ]; then
                  success=true
                  echo "✅ Download successful with format: $format_selector"
                else
                  rm -f "$output" 2>/dev/null
                fi
              fi
            done
            
            # If all format strategies failed, try with explicit quality selection
            if [ "$success" = false ]; then
              echo "🔄 Trying with explicit quality selection..."
              
              local formats=$(yt-dlp --extractor-args "generic:impersonate" --impersonate chrome -F "$url" 2>/dev/null)
              local best_video=$(echo "$formats" | grep -E "mp4.*[0-9]+x[0-9]+" | sort -t'x' -k2 -rn | head -1 | awk '{print $1}')
              local best_audio=$(echo "$formats" | grep -E "m4a|aac|mp4a" | grep -v "video" | head -1 | awk '{print $1}')
              
              if [ -n "$best_video" ]; then
                echo "🎯 Selected video format: $best_video"
                if [ -n "$best_audio" ]; then
                  echo "🎯 Selected audio format: $best_audio"
                  local format_string="${best_video}+${best_audio}"
                else
                  local format_string="$best_video"
                fi
                
                yt-dlp \
                  --extractor-args "generic:impersonate" \
                  --impersonate chrome \
                  -f "$format_string" \
                  --merge-output-format mp4 \
                  --no-warnings \
                  --progress \
                  --newline \
                  --geo-bypass \
                  --no-check-certificates \
                  --socket-timeout 300 \
                  --retries 5 \
                  --fragment-retries 5 \
                  -o "$output" \
                  "$url" 2>&1 | grep -E "(Downloading|Merging|file size|Destination)" || true
                
                if [ ${PIPESTATUS[0]} -eq 0 ] && [ -f "$output" ] && [ -s "$output" ]; then
                  success=true
                  echo "✅ Download successful with explicit quality selection"
                fi
              fi
            fi
            
            # Final attempt: Use built-in best quality
            if [ "$success" = false ]; then
              echo "🔄 Final attempt: Using best quality fallback..."
              yt-dlp \
                --extractor-args "generic:impersonate" \
                --impersonate chrome \
                -f "best" \
                --merge-output-format mp4 \
                --no-warnings \
                --progress \
                --newline \
                --geo-bypass \
                --no-check-certificates \
                --socket-timeout 300 \
                --retries 5 \
                --fragment-retries 5 \
                -o "$output" \
                "$url" 2>&1 | grep -E "(Downloading|Merging|file size|Destination)" || true
              
              if [ ${PIPESTATUS[0]} -eq 0 ] && [ -f "$output" ] && [ -s "$output" ]; then
                success=true
                echo "✅ Download successful with best quality fallback"
              fi
            fi
            
            if [ "$success" = true ]; then
              return 0
            else
              echo "❌ All download attempts failed"
              return 1
            fi
          }
          
          # Function to download with aria2c
          download_with_aria2c() {
            local url="$1"
            local output="$2"
            local episode="$3"
            
            echo "⬇️  Downloading episode $episode with aria2c..."
            
            aria2c -x 16 -s 16 -k 1M --continue=true \
              --console-log-level=error \
              --summary-interval=0 \
              --download-result=default \
              -o "$output" "$url" 2>&1 | grep -E "(Downloading|Saved|ERROR)" || true
            
            return ${PIPESTATUS[0]}
          }
          
          while IFS= read -u 3 -r URL || [ -n "$URL" ]; do
            URL=$(echo "$URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$URL" ]; then continue; fi
            
            EP_NUM=$(printf "%02d" $EP_INDEX)
            OUT_FILE="EP${EP_NUM}.mp4"
            TEMP_FILE="EP${EP_NUM}_temp.mp4"
            FIXED_FILE="EP${EP_NUM}_fixed.mp4"
            
            echo "========================================="
            echo "📥 Episode $EP_INDEX/$TOTAL_EPISODES"
            echo "📎 URL: $(echo "$URL" | cut -c1-60)..."
            echo "💾 Output: $OUT_FILE"
            echo "========================================="
            
            # Clean up any existing files
            rm -f "$OUT_FILE" "$TEMP_FILE" "$FIXED_FILE" 2>/dev/null
            
            DOWNLOAD_SUCCESS=false
            
            # CHECK URL TYPE: HLS/m3u8 OR DIRECT VIDEO
            if [[ "$URL" == *".m3u8"* ]] || [[ "$URL" == *".m3u"* ]] || [[ "$URL" == *"master.m3u8"* ]]; then
              echo "📺 HLS STREAM DETECTED - Selecting highest quality"
              
              if download_with_ytdlp "$URL" "$OUT_FILE" "$EP_INDEX"; then
                if check_file_validity "$OUT_FILE"; then
                  DOWNLOAD_SUCCESS=true
                  echo "✅ HLS download successful (highest quality)"
                else
                  echo "⚠️ HLS download produced invalid file, trying fallback..."
                  rm -f "$OUT_FILE" 2>/dev/null
                fi
              fi
              
              if [ "$DOWNLOAD_SUCCESS" != true ]; then
                echo "🔄 Trying aria2c fallback for HLS..."
                if download_with_aria2c "$URL" "$OUT_FILE" "$EP_INDEX"; then
                  if check_file_validity "$OUT_FILE"; then
                    DOWNLOAD_SUCCESS=true
                    echo "✅ HLS download with aria2c successful"
                  else
                    rm -f "$OUT_FILE" 2>/dev/null
                  fi
                fi
              fi
              
            else
              echo "🎬 DIRECT VIDEO DETECTED"
              
              if download_with_aria2c "$URL" "$OUT_FILE" "$EP_INDEX"; then
                if check_file_validity "$OUT_FILE"; then
                  DOWNLOAD_SUCCESS=true
                  echo "✅ Direct download with aria2c successful"
                else
                  echo "⚠️ aria2c download produced invalid file, trying fallback..."
                  rm -f "$OUT_FILE" 2>/dev/null
                fi
              fi
              
              if [ "$DOWNLOAD_SUCCESS" != true ]; then
                echo "🔄 Trying yt-dlp fallback..."
                if download_with_ytdlp "$URL" "$OUT_FILE" "$EP_INDEX"; then
                  if check_file_validity "$OUT_FILE"; then
                    DOWNLOAD_SUCCESS=true
                    echo "✅ Direct download with yt-dlp successful"
                  else
                    rm -f "$OUT_FILE" 2>/dev/null
                  fi
                fi
              fi
            fi
            
            # FINAL VERIFICATION
            if [ "$DOWNLOAD_SUCCESS" = true ] && [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
              FINAL_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
              FINAL_SIZE_MB=$((FINAL_SIZE / 1024 / 1024))
              echo "✅ Episode $EP_INDEX ready: $OUT_FILE (${FINAL_SIZE_MB}MB)"
            else
              echo "❌ Download failed for Episode $EP_INDEX"
              FAILED_DOWNLOADS="$FAILED_DOWNLOADS $EP_NUM"
              rm -f "$OUT_FILE" 2>/dev/null
            fi
            
            # Clean up temp files
            rm -f "$TEMP_FILE" "$FIXED_FILE" 2>/dev/null
            
            # DELAY BETWEEN EPISODE DOWNLOADS
            if [ "$EP_INDEX" -lt "$TOTAL_EPISODES" ] && [ "$DELAY" -gt 0 ] 2>/dev/null; then
              echo "⏳ Waiting ${DELAY}s before next episode..."
              sleep "$DELAY"
            fi
            
            EP_INDEX=$((EP_INDEX + 1))
            echo ""
          done 3< urls.txt
          
          echo "========================================="
          echo "📊 DOWNLOAD SUMMARY"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Expected: $TOTAL_EPISODES episodes"
          
          echo ""
          echo "📋 Downloaded files:"
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              check_file_validity "$f"
            fi
          done
          echo ""
          
          TOTAL_FILES=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          echo "✅ Downloaded: $TOTAL_FILES/$TOTAL_EPISODES episodes"
          
          if [ -n "$FAILED_DOWNLOADS" ]; then
            echo "❌ FAILED DOWNLOADS: $FAILED_DOWNLOADS"
            echo "❌ Not all episodes downloaded successfully!"
            echo "   This is an all-or-nothing workflow. Exiting."
            exit 1
          fi
          
          if [ "$TOTAL_FILES" -ne "$TOTAL_EPISODES" ]; then
            echo "❌ Expected $TOTAL_EPISODES episodes, but only $TOTAL_FILES downloaded!"
            echo "❌ Exiting - all episodes required."
            exit 1
          fi
          
          echo "✅ All $TOTAL_EPISODES episodes downloaded and verified successfully!"
          echo "========================================="

      - name: Compress Episodes Larger Than 80MB (Very Fast Preset)
        timeout-minutes: 240
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ github.event.client_payload.label || 'NONE' }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔧 COMPRESSING EPISODES > 80MB"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "⚡ Using VERY FAST compression preset"
          echo "========================================="
          
          cat > fast_compress.py << 'EOFCOMPRESS'
          import os
          import sys
          import subprocess
          import shutil
          import json
          import time
          
          def get_video_info(file_path):
              try:
                  cmd = [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-show_entries", "stream=width,height,codec_name",
                      "-of", "json",
                      file_path
                  ]
                  result = subprocess.check_output(cmd, text=True)
                  data = json.loads(result)
                  
                  duration = float(data.get('format', {}).get('duration', 0))
                  
                  width, height = 1280, 720
                  for stream in data.get('streams', []):
                      if stream.get('codec_type') == 'video':
                          width = int(stream.get('width', 1280))
                          height = int(stream.get('height', 720))
                          break
                  
                  return duration, width, height
              except:
                  return 0, 1280, 720
          
          def compress_with_veryfast(file_path, target_size_mb=80):
              print(f"  ⚡ Compressing with VERY FAST preset...")
              
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"  📊 Original size: {file_size_mb:.1f}MB")
              
              if file_size_mb <= target_size_mb:
                  print(f"  ✅ File already under {target_size_mb}MB, skipping compression")
                  return True
              
              duration, width, height = get_video_info(file_path)
              print(f"  📊 Duration: {duration:.1f}s, Resolution: {width}x{height}")
              
              if duration > 0:
                  target_bitrate = (target_size_mb * 8 * 1024) / duration
                  target_bitrate = min(max(target_bitrate, 500), 2000)
              else:
                  target_bitrate = 1000
              
              print(f"  📊 Target bitrate: {int(target_bitrate)}kbps")
              
              base_name = os.path.splitext(file_path)[0]
              temp_file = f"{base_name}_fast.mp4"
              
              cmd = [
                  "ffmpeg", "-y",
                  "-i", file_path,
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-b:v", f"{int(target_bitrate)}k",
                  "-maxrate", f"{int(target_bitrate * 1.5)}k",
                  "-bufsize", f"{int(target_bitrate * 2)}k",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ar", "44100",
                  "-movflags", "+faststart",
                  "-threads", str(os.cpu_count() or 2),
                  temp_file
              ]
              
              try:
                  print(f"  🔄 Encoding...")
                  start_time = time.time()
                  
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
                  
                  elapsed = time.time() - start_time
                  print(f"  ⏱️  Encoding time: {elapsed:.1f}s")
                  
                  if result.returncode == 0 and os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                      new_size_mb = os.path.getsize(temp_file) / (1024 * 1024)
                      print(f"  ✅ Compressed: {new_size_mb:.1f}MB ({file_size_mb:.1f}MB -> {new_size_mb:.1f}MB)")
                      
                      if new_size_mb <= target_size_mb * 1.1:
                          os.replace(temp_file, file_path)
                          return True
                      else:
                          print(f"  ⚠️ Still too large: {new_size_mb:.1f}MB")
                          print(f"  🔄 Trying ULTRA FAST with higher CRF...")
                          temp_file2 = f"{base_name}_ultrafast.mp4"
                          
                          cmd2 = [
                              "ffmpeg", "-y",
                              "-i", file_path,
                              "-c:v", "libx264",
                              "-preset", "ultrafast",
                              "-crf", "28",
                              "-c:a", "aac",
                              "-b:a", "96k",
                              "-ar", "44100",
                              "-movflags", "+faststart",
                              "-threads", str(os.cpu_count() or 2),
                              temp_file2
                          ]
                          
                          result2 = subprocess.run(cmd2, capture_output=True, text=True, timeout=300)
                          
                          if result2.returncode == 0 and os.path.exists(temp_file2) and os.path.getsize(temp_file2) > 0:
                              new_size_mb2 = os.path.getsize(temp_file2) / (1024 * 1024)
                              print(f"  ✅ UltraFast compressed: {new_size_mb2:.1f}MB")
                              
                              if new_size_mb2 < new_size_mb:
                                  os.replace(temp_file2, file_path)
                                  return True
                              else:
                                  os.remove(temp_file2)
                          
                          os.remove(temp_file)
                          return False
                  else:
                      print(f"  ❌ Compression failed: {result.stderr[:200]}")
                      return False
                      
              except subprocess.TimeoutExpired:
                  print(f"  ❌ Compression timeout")
                  return False
              except Exception as e:
                  print(f"  ❌ Compression error: {e}")
                  return False
              finally:
                  for f in [temp_file, f"{base_name}_ultrafast.mp4"]:
                      if os.path.exists(f):
                          try: os.remove(f)
                          except: pass
              
              return False
          
          def process_episode(file_path, target_size_mb=80):
              if not os.path.exists(file_path):
                  print(f"❌ File not found: {file_path}")
                  return False
              
              return compress_with_veryfast(file_path, target_size_mb)
          
          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  print("Usage: python fast_compress.py <file_path> [target_size_mb]")
                  sys.exit(1)
              
              file_path = sys.argv[1]
              target_size = int(sys.argv[2]) if len(sys.argv) > 2 else 80
              
              success = process_episode(file_path, target_size)
              sys.exit(0 if success else 1)
          EOFCOMPRESS
          
          EPISODE_FILES=$(ls -1 EP*.mp4 2>/dev/null)
          TOTAL_EPISODES=$(echo "$EPISODE_FILES" | wc -l)
          COMPRESSED_COUNT=0
          FAILED_COMPRESSIONS=""
          
          echo "📊 Checking episode sizes..."
          echo ""
          
          for f in $EPISODE_FILES; do
            if [ ! -f "$f" ]; then continue; fi
            
            FILE_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "0")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            echo "📹 $f: ${FILE_SIZE_MB}MB"
            
            if [ $FILE_SIZE_MB -gt 80 ]; then
              echo "⚠️  $f exceeds 80MB, compressing..."
              
              EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
              EPISODE_TITLE="Episode ${EP_NUM} - ${SERIES_TITLE}"
              
              if python3 fast_compress.py "$f" 80 < /dev/null; then
                COMPRESSED_COUNT=$((COMPRESSED_COUNT + 1))
                NEW_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "0")
                NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
                echo "✅ $f compressed: ${NEW_SIZE_MB}MB"
              else
                echo "❌ Failed to compress $f"
                FAILED_COMPRESSIONS="$FAILED_COMPRESSIONS $f"
              fi
            else
              echo "✅ $f already under 80MB, skipping compression"
            fi
            echo ""
          done
          
          echo "========================================="
          echo "📊 COMPRESSION SUMMARY"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $TOTAL_EPISODES"
          echo "📊 Compressed: $COMPRESSED_COUNT episodes"
          
          if [ -n "$FAILED_COMPRESSIONS" ]; then
            echo "❌ FAILED COMPRESSIONS: $FAILED_COMPRESSIONS"
            echo "❌ Not all episodes compressed successfully!"
            echo "   This is an all-or-nothing workflow. Exiting."
            exit 1
          fi
          
          echo "✅ All episodes processed successfully!"
          echo "========================================="
          
          echo ""
          echo "📊 Final episode sizes:"
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              SIZE_MB=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null | awk '{print $1/1024/1024}')
              printf "   %-10s: %.1f MB\n" "$f" "$SIZE_MB"
            fi
          done
          echo ""

      - name: Smart Merge Episodes
        id: merge
        timeout-minutes: 220
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔗 MERGING EPISODES"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📊 Episodes: $(ls -1 EP*.mp4 2>/dev/null | wc -l)"
          echo "========================================="
          
          EP_COUNT=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          if [ "$EP_COUNT" -eq 0 ]; then
            echo "❌ No episodes to merge!"
            exit 1
          fi
          
          if [ "$EP_COUNT" -eq 1 ]; then
            echo "📦 Only 1 episode - skipping merge"
            SINGLE_FILE=$(ls EP*.mp4 | head -1)
            ffmpeg -i "$SINGLE_FILE" -c copy -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output.mp4" 2>/dev/null
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📊 Found $EP_COUNT episodes to merge"
          
          echo "🔍 Checking all files for video streams..."
          NEEDS_REDOWNLOAD=false
          REDOWNLOAD_LIST=""
          
          for f in EP*.mp4; do
            if [ ! -f "$f" ]; then continue; fi
            
            HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$f" 2>/dev/null)
            
            if [ -z "$HAS_VIDEO" ] || [ "$HAS_VIDEO" != "video" ]; then
              echo "⚠️ $f has no video stream!"
              EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
              EP_NUM_CLEAN=$(echo "$EP_NUM" | sed 's/^0*//')
              REDOWNLOAD_LIST="$REDOWNLOAD_LIST $EP_NUM_CLEAN"
              NEEDS_REDOWNLOAD=true
            else
              WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f" 2>/dev/null)
              HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f" 2>/dev/null)
              
              if [ -z "$WIDTH" ] || [ "$WIDTH" = "0" ] || [ -z "$HEIGHT" ] || [ "$HEIGHT" = "0" ]; then
                echo "⚠️ $f has video but invalid resolution (${WIDTH}x${HEIGHT})!"
                EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
                EP_NUM_CLEAN=$(echo "$EP_NUM" | sed 's/^0*//')
                REDOWNLOAD_LIST="$REDOWNLOAD_LIST $EP_NUM_CLEAN"
                NEEDS_REDOWNLOAD=true
              else
                echo "✅ $f: ${WIDTH}x${HEIGHT} video stream OK"
              fi
            fi
          done
          
          if [ "$NEEDS_REDOWNLOAD" = true ]; then
            echo ""
            echo "🔄 Redownloading episodes with yt-dlp to ensure proper video..."
            
            mapfile -t URL_ARRAY < urls.txt
            
            for EP_NUM_CLEAN in $REDOWNLOAD_LIST; do
              EP_NUM_FORMATTED=$(printf "%02d" "$EP_NUM_CLEAN" 2>/dev/null || echo "$EP_NUM_CLEAN")
              FILE="EP${EP_NUM_FORMATTED}.mp4"
              URL_INDEX=$((EP_NUM_CLEAN - 1))
              
              if [ $URL_INDEX -ge 0 ] && [ $URL_INDEX -lt ${#URL_ARRAY[@]} ]; then
                URL="${URL_ARRAY[$URL_INDEX]}"
                echo ""
                echo "🔄 Redownloading Episode $EP_NUM_FORMATTED with yt-dlp..."
                echo "📎 URL: $URL"
                
                rm -f "$FILE"
                
                yt-dlp --extractor-args "generic:impersonate" --impersonate chrome \
                  -f "bestvideo+bestaudio/best" \
                  --merge-output-format mp4 \
                  --no-progress --no-warnings \
                  -o "$FILE" "$URL" < /dev/null 2>&1
                
                if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                  HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$FILE" 2>/dev/null)
                  if [ -n "$HAS_VIDEO" ] && [ "$HAS_VIDEO" = "video" ]; then
                    echo "✅ Episode $EP_NUM_FORMATTED redownloaded successfully with video!"
                  else
                    echo "❌ Redownloaded file still has no video for Episode $EP_NUM_FORMATTED"
                    echo "   Creating a blank video with audio instead..."
                    
                    DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null || echo "30")
                    TEMP_FILE="EP${EP_NUM_FORMATTED}_temp.mp4"
                    
                    ffmpeg -f lavfi -i color=black:size=720x1280:duration="$DURATION" \
                      -i "$FILE" \
                      -c:v libx264 -preset veryfast -crf 23 \
                      -c:a aac -b:a 128k -ar 44100 \
                      -shortest \
                      -movflags +faststart \
                      "$TEMP_FILE" 2>/dev/null
                    
                    if [ -f "$TEMP_FILE" ] && [ -s "$TEMP_FILE" ]; then
                      mv "$TEMP_FILE" "$FILE"
                      echo "✅ Created video from audio for Episode $EP_NUM_FORMATTED"
                    fi
                  fi
                else
                  echo "❌ Redownload failed for Episode $EP_NUM_FORMATTED"
                  DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null || echo "30")
                  TEMP_FILE="EP${EP_NUM_FORMATTED}_temp.mp4"
                  
                  ffmpeg -f lavfi -i color=black:size=720x1280:duration="$DURATION" \
                    -i "$FILE" \
                    -c:v libx264 -preset veryfast -crf 23 \
                    -c:a aac -b:a 128k -ar 44100 \
                    -shortest \
                    -movflags +faststart \
                    "$TEMP_FILE" 2>/dev/null
                  
                  if [ -f "$TEMP_FILE" ] && [ -s "$TEMP_FILE" ]; then
                    mv "$TEMP_FILE" "$FILE"
                    echo "✅ Created video from audio for Episode $EP_NUM_FORMATTED"
                  fi
                fi
              else
                echo "⚠️ Could not find URL for Episode $EP_NUM_FORMATTED"
              fi
            done
            
            echo ""
            echo "✅ Redownload complete!"
          fi
          
          echo ""
          echo "🔍 Analyzing file properties with MediaInfo and ffprobe..."
          
          declare -A resolutions
          declare -A audio_sample_rates
          declare -A video_codecs
          declare -A audio_codecs
          declare -A has_video
          
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              res=$(mediainfo --Inform="Video;%Width%x%Height%" "$f" 2>/dev/null || echo "")
              
              if [ -z "$res" ] || [ "$res" = "0x0" ] || [ "$res" = "x" ]; then
                width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f" 2>/dev/null || echo "0")
                height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f" 2>/dev/null || echo "0")
                
                if [ "$width" != "0" ] && [ "$height" != "0" ]; then
                  res="${width}x${height}"
                  has_video["$f"]="true"
                else
                  res="0x0"
                  has_video["$f"]="false"
                fi
              else
                has_video["$f"]="true"
              fi
              resolutions["$f"]="$res"
              
              sample_rate=$(mediainfo --Inform="Audio;%SamplingRate%" "$f" 2>/dev/null | tr -d ' ' | cut -d'/' -f1 | cut -d' ' -f1)
              if [ -z "$sample_rate" ] || [ "$sample_rate" = "0" ]; then
                sample_rate=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 "$f" 2>/dev/null || echo "44100")
              fi
              audio_sample_rates["$f"]="$sample_rate"
              
              video_codec=$(mediainfo --Inform="Video;%CodecID%" "$f" 2>/dev/null || echo "")
              if [ -z "$video_codec" ] || [ "$video_codec" = "unknown" ]; then
                video_codec=$(mediainfo --Inform="Video;%Format%" "$f" 2>/dev/null || echo "")
              fi
              if [ -z "$video_codec" ] || [ "$video_codec" = "unknown" ]; then
                video_codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" 2>/dev/null || echo "avc1")
                if [ "$video_codec" = "h264" ]; then
                  video_codec="avc1"
                elif [ "$video_codec" = "hevc" ]; then
                  video_codec="hev1"
                fi
              fi
              video_codecs["$f"]="$video_codec"
              
              audio_codec=$(mediainfo --Inform="Audio;%Format%" "$f" 2>/dev/null || echo "")
              if [ -z "$audio_codec" ] || [ "$audio_codec" = "unknown" ]; then
                audio_codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f" 2>/dev/null || echo "AAC")
              fi
              audio_codecs["$f"]="$audio_codec"
              
              echo "$f: ${resolutions[$f]}, ${audio_sample_rates[$f]}Hz, ${video_codecs[$f]}, ${audio_codecs[$f]}"
            fi
          done
          
          if [ ${#resolutions[@]} -eq 0 ]; then
            echo "❌ No valid files to merge!"
            exit 1
          fi
          
          VALID_RESOLUTIONS=""
          for f in "${!resolutions[@]}"; do
            res="${resolutions[$f]}"
            if [ "$res" != "0x0" ] && [ "$res" != "x" ] && [ -n "$res" ]; then
              VALID_RESOLUTIONS="$VALID_RESOLUTIONS $res"
            fi
          done
          
          if [ -n "$VALID_RESOLUTIONS" ]; then
            TARGET_RES=$(echo "$VALID_RESOLUTIONS" | tr ' ' '\n' | grep -v "0x0" | sort | uniq -c | sort -nr | head -1 | awk '{print $2}')
          else
            TARGET_RES="720x1280"
          fi
          
          if [ -z "$TARGET_RES" ] || [ "$TARGET_RES" = "0x0" ] || [ "$TARGET_RES" = "x" ]; then
            TARGET_RES="720x1280"
          fi
          
          TARGET_SAMPLE_RATE=$(printf '%s\n' "${audio_sample_rates[@]}" | grep -v "^$" | sort | uniq -c | sort -nr | head -1 | awk '{print $2}')
          if [ -z "$TARGET_SAMPLE_RATE" ]; then
            TARGET_SAMPLE_RATE="44100"
          fi
          
          TARGET_VIDEO_CODEC=$(printf '%s\n' "${video_codecs[@]}" | grep -v "^$" | sort | uniq -c | sort -nr | head -1 | awk '{print $2}')
          if [ -z "$TARGET_VIDEO_CODEC" ]; then
            TARGET_VIDEO_CODEC="avc1"
          fi
          
          TARGET_AUDIO_CODEC=$(printf '%s\n' "${audio_codecs[@]}" | grep -v "^$" | sort | uniq -c | sort -nr | head -1 | awk '{print $2}')
          if [ -z "$TARGET_AUDIO_CODEC" ]; then
            TARGET_AUDIO_CODEC="AAC"
          fi
          
          TARGET_W=$(echo "$TARGET_RES" | cut -d'x' -f1)
          TARGET_H=$(echo "$TARGET_RES" | cut -d'x' -f2)
          
          echo ""
          echo "🎯 TARGET PROPERTIES:"
          echo "   Resolution: ${TARGET_W}x${TARGET_H}"
          echo "   Audio Sample Rate: ${TARGET_SAMPLE_RATE} Hz"
          echo "   Video Codec: ${TARGET_VIDEO_CODEC}"
          echo "   Audio Codec: ${TARGET_AUDIO_CODEC}"
          echo ""
          
          NORMALIZED_FILES=""
          NEEDS_NORMALIZE=false
          
          for f in EP*.mp4; do
            if [ ! -f "$f" ]; then continue; fi
            
            CURRENT_RES="${resolutions[$f]:-0x0}"
            CURRENT_SAMPLE_RATE="${audio_sample_rates[$f]:-44100}"
            CURRENT_VIDEO_CODEC="${video_codecs[$f]:-}"
            CURRENT_AUDIO_CODEC="${audio_codecs[$f]:-AAC}"
            
            HAS_VIDEO="${has_video[$f]:-false}"
            
            if [ "$HAS_VIDEO" = "false" ] || [ "$CURRENT_RES" = "0x0" ] || [ "$CURRENT_RES" = "x" ] || [ -z "$CURRENT_RES" ]; then
              echo "⚠️ $f has no video or invalid resolution, will normalize"
              NEEDS_NORMALIZE=true
              
              EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
              EPISODE_TITLE="Episode ${EP_NUM} - ${SERIES_TITLE}"
              
              echo "  🎵 $f is audio-only, creating video with audio..."
              DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null || echo "30")
              ffmpeg -f lavfi -i color=black:size=${TARGET_W}x${TARGET_H}:duration="$DURATION" \
                -i "$f" \
                -c:v libx264 -preset veryfast -crf 23 \
                -c:a aac -b:a 128k -ar ${TARGET_SAMPLE_RATE} \
                -shortest \
                -metadata title="$EPISODE_TITLE" \
                -metadata episode_id="$EP_NUM" \
                -metadata series="$SERIES_TITLE" \
                -metadata label="$LABEL" \
                -movflags +faststart \
                "normalized_$f" 2>/dev/null
              
              if [ -f "normalized_$f" ] && [ -s "normalized_$f" ]; then
                echo "✅ Normalized: $f -> normalized_$f"
                NORMALIZED_FILES="$NORMALIZED_FILES normalized_$f"
              else
                echo "⚠️ Normalization failed, using original $f"
                NORMALIZED_FILES="$NORMALIZED_FILES $f"
              fi
            elif [ "$CURRENT_RES" == "$TARGET_RES" ] && \
                 [ "$CURRENT_SAMPLE_RATE" == "$TARGET_SAMPLE_RATE" ]; then
              echo "✅ Keeping: $f (matches all targets)"
              NORMALIZED_FILES="$NORMALIZED_FILES $f"
            else
              echo "⚠️ Normalizing: $f"
              echo "   Current: ${CURRENT_RES}, ${CURRENT_SAMPLE_RATE}Hz, ${CURRENT_VIDEO_CODEC}, ${CURRENT_AUDIO_CODEC}"
              echo "   Target:  ${TARGET_RES}, ${TARGET_SAMPLE_RATE}Hz, ${TARGET_VIDEO_CODEC}, ${TARGET_AUDIO_CODEC}"
              NEEDS_NORMALIZE=true
              
              EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
              EPISODE_TITLE="Episode ${EP_NUM} - ${SERIES_TITLE}"
              
              ffmpeg -i "$f" \
                -vf "scale=${TARGET_W}:${TARGET_H}:force_original_aspect_ratio=decrease,pad=${TARGET_W}:${TARGET_H}:(ow-iw)/2:(oh-ih)/2:color=black" \
                -c:v libx264 -preset veryfast -crf 23 \
                -c:a aac -b:a 128k -ar ${TARGET_SAMPLE_RATE} \
                -metadata title="$EPISODE_TITLE" \
                -metadata episode_id="$EP_NUM" \
                -metadata series="$SERIES_TITLE" \
                -metadata label="$LABEL" \
                -movflags +faststart \
                "normalized_$f" 2>/dev/null
              
              if [ -f "normalized_$f" ] && [ -s "normalized_$f" ]; then
                echo "✅ Normalized successfully: $f -> normalized_$f"
                NORMALIZED_FILES="$NORMALIZED_FILES normalized_$f"
              else
                echo "⚠️ Normalization failed, using original"
                NORMALIZED_FILES="$NORMALIZED_FILES $f"
              fi
            fi
          done
          
          FILE_COUNT=$(echo "$NORMALIZED_FILES" | wc -w)
          echo ""
          echo "📊 Files to merge: $FILE_COUNT"
          
          if [ $FILE_COUNT -eq 0 ]; then
            echo "❌ No files to merge!"
            exit 1
          fi
          
          echo "🔍 Verifying all files..."
          VERIFIED_FILES=""
          
          for f in $NORMALIZED_FILES; do
            if [ ! -f "$f" ] || [ ! -s "$f" ]; then
              echo "⚠️ File missing or empty: $f"
              continue
            fi
            
            if ffprobe -v error "$f" 2>/dev/null; then
              echo "✅ Valid: $f"
              VERIFIED_FILES="$VERIFIED_FILES $f"
            else
              echo "⚠️ Invalid file: $f, skipping"
            fi
          done
          
          if [ -z "$VERIFIED_FILES" ]; then
            echo "❌ No valid files to merge!"
            exit 1
          fi
          
          MERGE_FILES_ARRAY=($VERIFIED_FILES)
          FILE_COUNT=${#MERGE_FILES_ARRAY[@]}
          
          if [ $FILE_COUNT -lt 2 ]; then
            echo "📦 Less than 2 valid files, copying single file..."
            cp "${MERGE_FILES_ARRAY[0]}" "output.mp4"
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo ""
          echo "✅ All files validated!"
          echo "📊 MERGING: Using FFmpeg concat demuxer"
          
          TOTAL_DURATION=0
          for f in "${MERGE_FILES_ARRAY[@]}"; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null || echo "0")
              DURATION_INT=${DURATION%.*}
              if [ "$DURATION_INT" -gt 0 ]; then
                TOTAL_DURATION=$((TOTAL_DURATION + DURATION_INT))
                echo "   $f: ${DURATION_INT}s"
              fi
            fi
          done
          echo "📊 Total expected duration: ${TOTAL_DURATION} seconds ($((TOTAL_DURATION / 60)) minutes)"
          
          CONCAT_LIST="concat_list.txt"
          > $CONCAT_LIST
          
          for f in "${MERGE_FILES_ARRAY[@]}"; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              if ffprobe -v error "$f" 2>/dev/null; then
                echo "file '$f'" >> $CONCAT_LIST
                echo "✅ Added: $f ($(du -h $f | cut -f1))"
              else
                echo "⚠️ Skipping invalid file: $f"
              fi
            else
              echo "⚠️ File missing or empty: $f"
            fi
          done
          
          echo "🔄 Concatenating files..."
          ffmpeg -f concat -safe 0 -i $CONCAT_LIST \
            -c copy \
            -movflags +faststart \
            -metadata title="$TITLE" \
            -metadata series="$SERIES_TITLE" \
            -metadata label="$LABEL" \
            -metadata year="$(date +%Y)" \
            -metadata date="$(date +%Y-%m-%d)" \
            "output.mp4" 2>/dev/null
          
          if [ -f "output.mp4" ] && [ -s "output.mp4" ]; then
            echo "✅ Merge successful!"
            
            MERGED_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "output.mp4" 2>/dev/null || echo "0")
            MERGED_DURATION_INT=${MERGED_DURATION%.*}
            echo "📊 Merged file duration: ${MERGED_DURATION_INT} seconds"
            
            echo "🖼️ Generating thumbnails..."
            ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
              -q:v 2 "thumb.jpg" 2>/dev/null
            
            ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
              -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
              -q:v 2 "square_thumb.jpg" 2>/dev/null
            
            rm -f normalized_*.mp4 concat_list.txt
            
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            
            echo ""
            echo "========================================="
            echo "📊 FINAL MERGED FILE"
            echo "========================================="
            echo "📺 Series: $SERIES_TITLE"
            echo "📁 File: output.mp4"
            ls -lh output.mp4
            echo "========================================="
          else
            echo "❌ Merge failed!"
            exit 1
          fi

      - name: Verify, Compress if Needed, and Fix Duration
        if: steps.merge.outputs.merge_success == 'true'
        id: verify
        timeout-minutes: 120
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔍 VERIFYING MERGED FILE"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          if [ ! -f "output.mp4" ]; then
            echo "❌ output.mp4 not found!"
            exit 1
          fi
          
          FILE_SIZE_BYTES=$(stat -c%s "output.mp4" 2>/dev/null || stat -f%z "output.mp4" 2>/dev/null || echo "0")
          FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))
          
          echo "📊 File size: ${FILE_SIZE_MB} MB"
          
          if [ $FILE_SIZE_MB -gt 1800 ]; then
            echo "⚠️ File exceeds 1.8GB (${FILE_SIZE_MB} MB)"
            echo "🔧 Compressing file with veryfast preset..."
            
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "output.mp4" 2>/dev/null || echo "0")
            DURATION_INT=${DURATION%.*}
            
            if [ "$DURATION_INT" -gt 0 ]; then
              TARGET_SIZE_MB=1500
              TARGET_BITRATE=$((TARGET_SIZE_MB * 8 * 1024 / DURATION_INT))
              if [ $TARGET_BITRATE -lt 500 ]; then
                TARGET_BITRATE=500
              fi
              echo "📊 Target bitrate: ${TARGET_BITRATE}k"
            else
              TARGET_BITRATE=1500
            fi
            
            echo "🔧 Compressing with veryfast preset..."
            
            ffmpeg -y -i "output.mp4" \
              -c:v libx264 -preset veryfast -b:v ${TARGET_BITRATE}k -maxrate ${TARGET_BITRATE}k \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output_compressed.mp4" 2>/dev/null
            
            if [ -f "output_compressed.mp4" ] && [ -s "output_compressed.mp4" ]; then
              NEW_SIZE=$(stat -c%s "output_compressed.mp4" 2>/dev/null || stat -f%z "output_compressed.mp4" 2>/dev/null || echo "0")
              NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
              
              if [ $NEW_SIZE_MB -lt 1800 ]; then
                mv output_compressed.mp4 output.mp4
                echo "✅ File compressed! New size: ${NEW_SIZE_MB} MB"
                echo "compressed=true" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Compression didn't reduce enough (${NEW_SIZE_MB} MB), trying CRF..."
                
                ffmpeg -y -i "output.mp4" \
                  -c:v libx264 -preset veryfast -crf 28 \
                  -c:a aac -b:a 96k -ar 44100 \
                  -movflags +faststart \
                  -metadata title="$TITLE" \
                  -metadata series="$SERIES_TITLE" \
                  -metadata label="$LABEL" \
                  -metadata year="$(date +%Y)" \
                  -metadata date="$(date +%Y-%m-%d)" \
                  "output_compressed.mp4" 2>/dev/null
                
                if [ -f "output_compressed.mp4" ] && [ -s "output_compressed.mp4" ]; then
                  NEW_SIZE=$(stat -c%s "output_compressed.mp4" 2>/dev/null || stat -f%z "output_compressed.mp4" 2>/dev/null || echo "0")
                  NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
                  
                  if [ $NEW_SIZE_MB -lt 1800 ]; then
                    mv output_compressed.mp4 output.mp4
                    echo "✅ File compressed! New size: ${NEW_SIZE_MB} MB"
                    echo "compressed=true" >> $GITHUB_OUTPUT
                  else
                    echo "❌ Compression failed to reduce file size"
                    rm -f output_compressed.mp4
                    echo "compressed=false" >> $GITHUB_OUTPUT
                  fi
                fi
              fi
            else
              echo "❌ Compression failed"
              echo "compressed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ File size is under 1.8GB, no compression needed"
            echo "compressed=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "output.mp4" ] && [ -s "output.mp4" ]; then
            echo "🖼️ Regenerating thumbnails..."
            ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
              -q:v 2 "thumb.jpg" 2>/dev/null
            
            ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
              -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
              -q:v 2 "square_thumb.jpg" 2>/dev/null
          fi
          
          echo "🔧 Fixing duration metadata..."
          ffmpeg -i output.mp4 -c copy -map_metadata 0 -movflags +faststart output_fixed.mp4 2>/dev/null
          
          if [ -f "output_fixed.mp4" ] && [ -s "output_fixed.mp4" ]; then
            mv output_fixed.mp4 output.mp4
            echo "✅ Duration metadata fixed"
          fi
          
          if mediainfo output.mp4 > /dev/null 2>&1; then
            echo "✅ MediaInfo can read the file"
            echo ""
            mediainfo output.mp4
            echo ""
            
            DURATION=$(mediainfo --Inform="General;%Duration/String3%" output.mp4 2>/dev/null)
            FINAL_SIZE=$(stat -c%s "output.mp4" 2>/dev/null || stat -f%z "output.mp4" 2>/dev/null || echo "0")
            FINAL_SIZE_MB=$((FINAL_SIZE / 1024 / 1024))
            
            echo "📝 Duration: $DURATION"
            echo "💾 Final size: ${FINAL_SIZE_MB} MB"
            echo "✅ File is valid"
            echo "verify_success=true" >> $GITHUB_OUTPUT
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            
            if [ $FINAL_SIZE_MB -gt 2000 ]; then
              echo "❌ File exceeds 2GB (${FINAL_SIZE_MB} MB)"
              echo "   Telegram limit is 2GB!"
              exit 1
            else
              echo "✅ File size: ${FINAL_SIZE_MB} MB (under 2GB limit)"
            fi
          else
            echo "❌ MediaInfo cannot read the file!"
            echo "🔧 Attempting to repair..."
            
            ffmpeg -y -err_detect ignore_err -i output.mp4 \
              -c:v libx264 -preset veryfast -crf 23 \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output_repaired.mp4" 2>/dev/null
            
            if [ -f "output_repaired.mp4" ]; then
              REPAIR_SIZE=$(stat -c%s "output_repaired.mp4" 2>/dev/null || echo "0")
              REPAIR_SIZE_MB=$((REPAIR_SIZE / 1024 / 1024))
              if [ "$REPAIR_SIZE" -gt 1000000 ] && [ $REPAIR_SIZE_MB -lt 2000 ]; then
                mv output_repaired.mp4 output.mp4
                echo "✅ File repaired!"
                echo "verify_success=true" >> $GITHUB_OUTPUT
                echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
              else
                echo "❌ Repair failed or file still too large"
                rm -f output_repaired.mp4
                exit 1
              fi
            else
              echo "❌ Repair failed"
              exit 1
            fi
          fi

      - name: 📥 Download Poster (for Telegram Uploads)
        if: steps.verify.outputs.verify_success == 'true' && steps.payload.outputs.poster_url != ''
        env:
          POSTER_URL: ${{ steps.payload.outputs.poster_url }}
        run: |
          cd downloads
          if [ -n "$POSTER_URL" ] && curl -f -sSL --connect-timeout 20 --max-time 120 -o poster.jpg "$POSTER_URL"; then
            if file poster.jpg | grep -qiE 'image|jpeg|png|webp'; then
              echo "✅ Poster downloaded: $(stat -c%s poster.jpg) bytes"
              echo "poster_path=$(pwd)/poster.jpg" >> $GITHUB_ENV
            else
              echo "⚠️ Downloaded file is not an image, removing"
              rm -f poster.jpg
              echo "poster_path=" >> $GITHUB_ENV
            fi
          else
            echo "⚠️ Poster download failed or URL blank, skipping poster"
            echo "poster_path=" >> $GITHUB_ENV
          fi

      - name: Start Merged Upload with Speed Monitoring
        if: steps.verify.outputs.verify_success == 'true'
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TG_MERGED_CHAT_ID: ${{ secrets.TELEGRAM_MERGED_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TG_MERGED_NAME: ${{ secrets.TELEGRAM_MERGED_NAME }}
          TG_MERGED_INVITE_LINK: ${{ secrets.TELEGRAM_MERGED_INVITE_LINK }}
          MERGED_PATH: ${{ env.merged_file_path }}
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
          TELEGRAM_DATE: ${{ steps.payload.outputs.telegram_date }}
          SERIES_PROVIDER: ${{ steps.payload.outputs.series_provider }}
          SERIES_DESCRIPTION: ${{ steps.payload.outputs.series_description }}
          PROVIDER_TAG: ${{ steps.payload.outputs.provider_tag }}
          POSTER_PATH: ${{ env.poster_path }}
          MIN_UPLOAD_SPEED_MBPS: ${{ env.MIN_UPLOAD_SPEED_MBPS }}
          RESTART_ATTEMPTS: ${{ env.RESTART_ATTEMPTS }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📤 STARTING MERGED UPLOAD WITH SPEED MONITORING"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📁 File: ${{ env.merged_file_path }}"
          echo "⚡ Min Speed: ${MIN_UPLOAD_SPEED_MBPS} MB/s"
          echo "🔄 Max Restarts: ${RESTART_ATTEMPTS}"
          echo "========================================="
          
          if [ ! -f "${{ env.merged_file_path }}" ] && [ ! -f "output.mp4" ]; then
            echo "❌ output.mp4 not found!"
            exit 1
          fi
          
          if [ -f "${{ env.merged_file_path }}" ]; then
            export MERGED_PATH="${{ env.merged_file_path }}"
          else
            export MERGED_PATH="$(pwd)/output.mp4"
            echo "⚠️ Using fallback path: $MERGED_PATH"
          fi
          
          # Validate output file
          if [ -f "output.mp4" ]; then
            FILE_SIZE=$(stat -c%s "output.mp4" 2>/dev/null || stat -f%z "output.mp4" 2>/dev/null || echo "0")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            echo "📊 Merged file size: ${FILE_SIZE_MB} MB"
            
            if [ "$FILE_SIZE" -lt 100000 ]; then
              echo "❌ output.mp4 is too small (${FILE_SIZE} bytes)!"
              exit 1
            fi
            
            HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "output.mp4" 2>/dev/null)
            if [ -z "$HAS_VIDEO" ] || [ "$HAS_VIDEO" != "video" ]; then
              echo "❌ output.mp4 has no video stream!"
              exit 1
            fi
            
            W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "output.mp4" 2>/dev/null)
            H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "output.mp4" 2>/dev/null)
            echo "✅ output.mp4: ${W}x${H}, ${FILE_SIZE_MB}MB"
          else
            echo "❌ output.mp4 not found!"
            exit 1
          fi
          
          # Check poster availability
          if [ -f "${{ env.poster_path }}" ]; then
            POSTER_EXISTS=true
            echo "✅ Poster exists: ${{ env.poster_path }}"
          else
            POSTER_EXISTS=false
            echo "⚠️ No poster available"
          fi
          
          # Check if provider and description are valid
          PROVIDER_VALID=false
          DESCRIPTION_VALID=false
          if [ -n "$SERIES_PROVIDER" ] && [ "$SERIES_PROVIDER" != "N/A" ] && [ -n "$(echo "$SERIES_PROVIDER" | tr -d ' ')" ]; then
            PROVIDER_VALID=true
          fi
          if [ -n "$SERIES_DESCRIPTION" ] && [ "$SERIES_DESCRIPTION" != "N/A" ] && [ -n "$(echo "$SERIES_DESCRIPTION" | tr -d ' ')" ]; then
            DESCRIPTION_VALID=true
          fi
          
          if [ "$POSTER_EXISTS" = true ] && [ "$PROVIDER_VALID" = true ] && [ "$DESCRIPTION_VALID" = true ]; then
            echo "✅ Poster will be uploaded (provider and description present)"
          else
            echo "⚠️ Poster will be skipped (missing: provider=$PROVIDER_VALID, description=$DESCRIPTION_VALID)"
          fi
          
          echo "========================================="
          echo "🚀 Starting upload to channel in background..."
          echo "📤 Step 1: Uploading poster (if available)"
          echo "📤 Step 2: Uploading video"
          echo "========================================="
          
          python3 -u upload_merged.py > merged_upload.log 2>&1 &
          MERGED_PID=$!
          echo "merged_pid=$MERGED_PID" >> $GITHUB_ENV
          echo "✅ Merged upload started with PID: $MERGED_PID"
          
          # Wait and verify process is running
          sleep 3
          if kill -0 $MERGED_PID 2>/dev/null; then
            echo "✅ Merged upload process is running (PID: $MERGED_PID)"
            echo "📋 Check merged_progress.log for status updates"
          else
            echo "❌ Merged upload process died immediately!"
            echo "📋 Error log:"
            cat merged_upload.log
            exit 1
          fi

      - name: Upload Single Episodes (Fast Upload)
        if: steps.verify.outputs.verify_success == 'true'
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TG_SINGLE_EPISODES_CHAT_ID: ${{ secrets.TELEGRAM_SINGLE_EPISODES_CHAT_ID }}
          TG_SINGLE_EPISODES_TOPIC_ID: ${{ secrets.TELEGRAM_SINGLE_EPISODES_TOPIC_ID || secrets.TELEGRAM_TOPIC_ID }}
          TG_SINGLE_EPISODES_NAME: ${{ secrets.TELEGRAM_SINGLE_EPISODES_NAME }}
          TG_SINGLE_EPISODES_INVITE_LINK: ${{ secrets.TELEGRAM_SINGLE_EPISODES_INVITE_LINK }}
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
          TELEGRAM_DATE: ${{ steps.payload.outputs.telegram_date }}
          SERIES_PROVIDER: ${{ steps.payload.outputs.series_provider }}
          SERIES_DESCRIPTION: ${{ steps.payload.outputs.series_description }}
          PROVIDER_TAG: ${{ steps.payload.outputs.provider_tag }}
          POSTER_PATH: ${{ env.poster_path }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📤 UPLOADING SINGLE EPISODES TO TOPIC"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📊 Episodes: $(ls -1 EP*.mp4 2>/dev/null | wc -l)"
          echo "========================================="
          
          python3 -c "import sys, textwrap; open('upload_single.py', 'w').write(textwrap.dedent(sys.stdin.read()))" << 'EOFUPLOAD'
          import os
          import sys
          import glob
          import re
          import subprocess
          import asyncio
          import datetime
          import traceback
          import json
          import math
          import random

          if hasattr(sys.stdout, "reconfigure"):
              sys.stdout.reconfigure(line_buffering=True)
              sys.stderr.reconfigure(line_buffering=True)

          try:
              from telethon import TelegramClient
              from telethon.sessions import StringSession
              from telethon.errors import FloodWaitError
              from telethon.tl.functions.channels import JoinChannelRequest, CreateForumTopicRequest
              from telethon.tl.functions.messages import ImportChatInviteRequest
              from telethon.tl.types import DocumentAttributeVideo
              import telethon
              print(f"✅ Telethon version: {telethon.__version__}")
          except ImportError as e:
              print(f"❌ Import error: {e}")
              sys.exit(1)

          api_id = os.environ.get("TG_API_ID")
          api_hash = os.environ.get("TG_API_HASH")
          session_string = os.environ.get("TG_SESSION_STRING")
          
          chat_id_raw = os.environ.get("TG_SINGLE_EPISODES_CHAT_ID")
          topic_id_raw = os.environ.get("TG_SINGLE_EPISODES_TOPIC_ID")
          chat_name = os.environ.get("TG_SINGLE_EPISODES_NAME")
          invite_link = os.environ.get("TG_SINGLE_EPISODES_INVITE_LINK")
          
          title = os.environ.get("TITLE")
          series_title = os.environ.get("SERIES_TITLE", "Series")
          label = os.environ.get("LABEL", "NONE")
          telegram_date = os.environ.get("TELEGRAM_DATE", datetime.date.today().strftime("%Y-%m-%d"))
          series_provider = os.environ.get("SERIES_PROVIDER", "N/A")
          series_description = os.environ.get("SERIES_DESCRIPTION", "N/A")
          provider_tag = os.environ.get("PROVIDER_TAG", "N/A")
          poster_path = os.environ.get("POSTER_PATH", "") or ""

          if not all([api_id, api_hash]):
              print("❌ Missing Telegram API credentials.")
              sys.exit(0)

          if not session_string:
              print("❌ Missing session string!")
              sys.exit(0)

          def parse_chat_id(val):
              if not val:
                  return None
              val = str(val).strip().strip('"').strip("'")
              try:
                  return int(val)
              except ValueError:
                  return val

          def fix_video_duration(file_path):
              try:
                  temp_file = f"{file_path}.fixed.mp4"
                  cmd = [
                      "ffmpeg", "-y",
                      "-i", file_path,
                      "-c", "copy",
                      "-map_metadata", "0",
                      "-movflags", "+faststart",
                      temp_file
                  ]
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
                  
                  if result.returncode == 0 and os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                      cmd = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", temp_file]
                      duration_check = subprocess.check_output(cmd, text=True).strip()
                      if duration_check and duration_check.replace('.', '', 1).isdigit():
                          os.replace(temp_file, file_path)
                          return True
                  return False
              except Exception as e:
                  print(f"⚠️ Could not fix duration: {e}")
                  return False

          def get_video_metadata(file_path):
              try:
                  cmd = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  if result and result.replace('.', '', 1).isdigit():
                      duration = float(result)
                  else:
                      cmd = ["mediainfo", "--Inform=Video;%Duration%", file_path]
                      result = subprocess.check_output(cmd, text=True).strip()
                      duration = float(result) if result.replace('.', '', 1).isdigit() else 0.0
                  
                  cmd = ["mediainfo", "--Inform=Video;%Width%|%Height%", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  parts = result.split('|')
                  
                  if len(parts) >= 2:
                      w = int(parts[0]) if parts[0].isdigit() else 1280
                      h = int(parts[1]) if parts[1].isdigit() else 720
                  else:
                      cmd = ["ffprobe", "-v", "error", "-show_entries", "stream=width,height", "-of", "default=noprint_wrappers=1", file_path]
                      result = subprocess.check_output(cmd, text=True).strip()
                      w = 1280
                      h = 720
                      for line in result.split('\n'):
                          if 'width=' in line:
                              w = int(line.split('=')[1])
                          elif 'height=' in line:
                              h = int(line.split('=')[1])
                  
                  return int(duration), w, h
              except Exception as e:
                  print(f"⚠️ Error getting metadata: {e}")
              return 0, 1280, 720

          def generate_thumbnail(file_path):
              try:
                  thumb_path = f"{file_path}_thumb.jpg"
                  cmd = ["mediainfo", "--Inform=Video;%Width%|%Height%", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  parts = result.split('|')
                  
                  if len(parts) >= 2 and parts[0].isdigit() and parts[1].isdigit():
                      w = int(parts[0])
                      h = int(parts[1])
                      ffmpeg_cmd = [
                          "ffmpeg", "-y", "-ss", "00:00:01",
                          "-i", file_path,
                          "-vf", f"crop=min({w},{h}):min({w},{h}),scale=512:512:flags=lanczos",
                          "-vframes", "1",
                          "-q:v", "2",
                          thumb_path
                      ]
                      subprocess.run(ffmpeg_cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
                      return thumb_path if os.path.exists(thumb_path) else None
              except:
                  pass
              return None

          chat_id = parse_chat_id(chat_id_raw)

          print("=" * 60)
          print("📤 Uploading Single Episodes (Topic / Group)")
          print("=" * 60)
          print(f"📺 Series: {series_title}")
          print("=" * 60)

          with open("episode_upload.log", "w") as f:
              f.write(f"{datetime.datetime.now()}: Starting episode uploads\n")

          def progress_callback(current, total):
              percent = (current / total) * 100
              mb_uploaded = current / (1024 * 1024)
              mb_total = total / (1024 * 1024)
              if int(percent) % 5 == 0 or int(percent) == 100:
                  print(f"📤 Upload: {percent:.1f}% ({mb_uploaded:.1f}/{mb_total:.1f} MB)")

          async def join_chat(client, invite_link):
              if not invite_link:
                  return None
              try:
                  return await client.get_entity(invite_link)
              except:
                  return None

          async def resolve_chat(client, chat_id, invite_link, search_name):
              if invite_link:
                  entity = await join_chat(client, invite_link)
                  if entity:
                      return entity
              if chat_id:
                  try:
                      return await client.get_entity(chat_id)
                  except:
                      pass
              if search_name:
                  async for dialog in client.iter_dialogs(limit=50):
                      if search_name.lower() in str(dialog.name).lower():
                          return dialog.entity
              return None

          async def get_or_create_topic(client, entity, topic_title, explicit_id=None):
              if explicit_id:
                  try:
                      return int(explicit_id)
                  except (ValueError, TypeError):
                      pass
              
              try:
                  print(f"📝 Creating forum topic in group: {topic_title[:60]}")
                  input_channel = await client.get_input_entity(entity)
                  result = await client(CreateForumTopicRequest(
                      channel=input_channel,
                      title=topic_title[:128],
                      random_id=random.randint(0, 0x7fffffffffffffff)
                  ))
                  
                  topic_id = None
                  if hasattr(result, 'updates'):
                      for upd in result.updates:
                          if hasattr(upd, 'message') and hasattr(upd.message, 'id'):
                              topic_id = upd.message.id
                              break
                          elif hasattr(upd, 'id'):
                              topic_id = upd.id
                              break
                  if not topic_id and hasattr(result, 'id'):
                      topic_id = result.id
                  
                  if topic_id:
                      print(f"✅ Topic created successfully! Topic ID: {topic_id}")
                      return int(topic_id)
                  else:
                      print("⚠️ Topic created but could not retrieve ID from updates")
              except Exception as e:
                  print(f"⚠️ Could not create topic: {e}")
              return None

          async def fast_upload_file(client, file_path, progress_callback=None):
              if not os.path.exists(file_path):
                  print(f"❌ File not found: {file_path}")
                  return None
              
              file_size = os.path.getsize(file_path)
              print(f"📊 File size: {file_size / (1024*1024):.1f} MB")
              
              try:
                  return await client.upload_file(
                      file_path,
                      part_size_kb=512,
                      file_name=os.path.basename(file_path),
                      progress_callback=progress_callback
                  )
              except Exception as e:
                  print(f"❌ Upload failed: {e}")
                  raise

          async def send_file_with_thumb(client, entity, file_path, caption, reply_to=None):
              if not os.path.exists(file_path):
                  print(f"❌ File not found: {file_path}")
                  return False, None
              
              duration, w, h = get_video_metadata(file_path)
              print(f"📊 Video duration: {duration} seconds, {w}x{h}")
              
              if duration == 0:
                  try:
                      cmd = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", file_path]
                      result = subprocess.check_output(cmd, text=True).strip()
                      if result and result.replace('.', '', 1).isdigit():
                          duration = int(float(result))
                  except:
                      pass
              
              thumb = generate_thumbnail(file_path)
              
              print(f"⬆️ Uploading {os.path.basename(file_path)}...")
              try:
                  uploaded_file = await fast_upload_file(
                      client=client,
                      file_path=file_path,
                      progress_callback=progress_callback
                  )
                  
                  if uploaded_file is None:
                      print(f"❌ Upload returned None for {os.path.basename(file_path)}")
                      return False, None
                      
                  print(f"✅ Upload complete for {os.path.basename(file_path)}!")
              except Exception as e:
                  print(f"❌ Upload failed: {e}")
                  return False, None
              
              video_attr = DocumentAttributeVideo(
                  duration=duration,
                  w=w if w > 0 else 1280,
                  h=h if h > 0 else 720,
                  supports_streaming=True
              )
              
              kwargs = {
                  "entity": entity,
                  "file": uploaded_file,
                  "caption": caption,
                  "attributes": [video_attr],
                  "supports_streaming": True,
                  "force_document": False,
                  "allow_cache": True
              }
              
              if reply_to:
                  kwargs["reply_to"] = int(reply_to)
                  print(f"🎯 Uploading into Topic ID: {reply_to}")
              
              if thumb and os.path.exists(thumb):
                  kwargs["thumb"] = thumb
              
              try:
                  result = await client.send_file(**kwargs)
                  return True, result
              except Exception as e:
                  print(f"❌ Send failed: {e}")
                  if "thumb" in kwargs:
                      del kwargs["thumb"]
                      try:
                          result = await client.send_file(**kwargs)
                          return True, result
                      except Exception as e2:
                          print(f"❌ Send failed without thumb: {e2}")
                          return False, None
                  return False, None
              finally:
                  if thumb and os.path.exists(thumb):
                      try: os.remove(thumb)
                      except: pass

          async def upload_episodes(client, entity, topic_id=None):
              ep_files = sorted(glob.glob("EP*.mp4"), 
                  key=lambda f: int(re.search(r'EP(\d+)\.mp4', f).group(1)) if re.search(r'EP(\d+)\.mp4', f) else 0)
              
              if not ep_files:
                  print("❌ No episode files found!")
                  return False
              
              print(f"📊 Found {len(ep_files)} episodes to upload to topic {topic_id}")
              count = 0
              
              # Check if poster should be sent
              should_send_poster = False
              if poster_path and os.path.isfile(poster_path):
                  provider_valid = series_provider and series_provider != "N/A" and series_provider.strip()
                  description_valid = series_description and series_description != "N/A" and series_description.strip()
                  
                  if provider_valid and description_valid:
                      should_send_poster = True
                      print("✅ Poster will be sent to topic (provider and description present)")
                  else:
                      missing = []
                      if not provider_valid:
                          missing.append("provider")
                      if not description_valid:
                          missing.append("description")
                      print(f"⚠️ Skipping poster in topic - missing: {', '.join(missing)}")
              else:
                  print("⚠️ No poster available for topic, skipping")
              
              # Post poster + series info in topic (if valid)
              if topic_id and should_send_poster:
                  poster_caption = f"📺 {series_title}\n👤 {series_provider}\n📝 {series_description}"
                  print(f"🖼️ Posting poster with series info into topic...")
                  try:
                      await client.send_file(
                          entity=entity,
                          file=poster_path,
                          caption=poster_caption,
                          reply_to=topic_id
                      )
                      print("✅ Poster + series info posted into topic")
                  except Exception as e:
                      print(f"⚠️ Poster post failed: {e}")
                  await asyncio.sleep(2)
              
              # Upload episodes
              for ep_file in ep_files:
                  ep_match = re.search(r'EP(\d+)\.mp4', ep_file)
                  if not ep_match:
                      continue
                  ep_num = int(ep_match.group(1))
                  
                  print(f"🔧 Fixing duration for Episode {ep_num}...")
                  if fix_video_duration(ep_file):
                      print(f"✅ Duration fixed for Episode {ep_num}")
                  
                  file_size = os.path.getsize(ep_file) / (1024 * 1024)
                  if file_size > 2000:
                      print(f"⚠️ Episode {ep_num} exceeds 2GB! Skipping.")
                      continue
                  
                  caption = f"📺 Episode {ep_num}"
                  print(f"📤 Uploading Episode {ep_num} ({file_size:.1f} MB)...")
                  
                  with open("episode_upload.log", "a") as f:
                      f.write(f"{datetime.datetime.now()}: STARTING_EP_{ep_num}\n")
                  
                  try:
                      success, result = await send_file_with_thumb(client, entity, ep_file, caption, reply_to=topic_id)
                      if success:
                          count += 1
                          print(f"✅ Episode {ep_num} uploaded into topic")
                          with open("episode_upload.log", "a") as f:
                              f.write(f"{datetime.datetime.now()}: COMPLETE_EP_{ep_num}\n")
                      else:
                          print(f"❌ Episode {ep_num} failed")
                  except FloodWaitError as e:
                      print(f"⏳ Rate limited: waiting {e.seconds}s")
                      await asyncio.sleep(e.seconds)
                      success, result = await send_file_with_thumb(client, entity, ep_file, caption, reply_to=topic_id)
                      if success:
                          count += 1
                          print(f"✅ Episode {ep_num} uploaded into topic")
                  except Exception as e:
                      print(f"❌ Episode {ep_num} error: {e}")
                  
                  await asyncio.sleep(1)
              
              print(f"✅ Uploaded {count}/{len(ep_files)} episodes")
              return count > 0

          async def main():
              try:
                  print("🔌 Connecting to Telegram...")
                  client = TelegramClient(
                      StringSession(session_string), 
                      int(api_id), 
                      api_hash,
                      connection_retries=5,
                      flood_sleep_threshold=180
                  )
                  await client.connect()
                  
                  if not await client.is_user_authorized():
                      print("❌ Session invalid")
                      return
                  
                  me = await client.get_me()
                  print(f"✅ Logged in: {me.first_name}")
                  
                  entity = await resolve_chat(client, chat_id, invite_link, chat_name)
                  if not entity:
                      print("❌ Could not resolve group for single episodes!")
                      return
                  
                  print(f"\n📤 Target Group: {entity.title if hasattr(entity, 'title') else entity.id}")
                  
                  topic_name = f"[{label}]-{series_title}"
                  topic_id = await get_or_create_topic(client, entity, topic_name, topic_id_raw)
                  
                  await upload_episodes(client, entity, topic_id)
                  
                  await client.disconnect()
                  with open("single_episodes_complete.txt", "w") as f:
                      f.write("COMPLETE\n")
                  with open("episode_upload.log", "a") as f:
                      f.write(f"{datetime.datetime.now()}: ALL_EPISODES_COMPLETE\n")
                  print("\n✅ Single episode uploads complete!")
              except Exception as e:
                  print(f"❌ Error: {e}")
                  traceback.print_exc()

          if __name__ == '__main__':
              asyncio.run(main())
