              fi
            fi
            
            # If merged upload is at 100% but not marked complete for a while, force complete
            if [ "$MERGED_PERCENT" = "100" ] && [ "$MERGED_COMPLETE" = false ]; then
              NO_PROGRESS_COUNT=$((NO_PROGRESS_COUNT + 1))
              if [ $NO_PROGRESS_COUNT -gt 6 ]; then  # After 30 seconds (6 * 5s)
                echo ""
