name: GitHub Telegram & Media Pipeline

on:
  repository_dispatch:
    types: [github_release_upload]

# ONLY ONE WORKFLOW RUN AT A TIME
concurrency:
  group: media-pipeline-processor
  cancel-in-progress: false
  queue: max

# Add permissions for deleting workflow runs
permissions:
  actions: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Series Information & Setup
        run: |
          echo "========================================="
          echo "📋 SERIES INFORMATION"
          echo "========================================="
          
          # Extract series information from payload
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Unknown Series' }}"
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          EPISODE_COUNT="${{ github.event.client_payload.episode_count || 'Unknown' }}"
          
          echo "📺 Series Title: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "📊 Episode Count: $EPISODE_COUNT"
          echo "⏰ Started at: $(date)"
          echo "========================================="
          
          # Store for later use
          echo "series_title=$SERIES" >> $GITHUB_ENV
          echo "label=$LABEL" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Tools with curl_cffi
        run: |
          echo "========================================="
          echo "🔧 INSTALLING TOOLS WITH curl_cffi"
          echo "========================================="
          echo "📺 Series: ${{ env.series_title }}"
          echo "========================================="
          
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 curl python3-pip jq mkvtoolnix bc wget mediainfo exiftool parallel
          
          # Install Python packages with curl_cffi for impersonation
          pip3 install --upgrade pip
          
          # Install yt-dlp with curl_cffi for Cloudflare bypass
          echo "📦 Installing yt-dlp with curl_cffi support..."
          pip3 install --upgrade --pre "yt-dlp[default,curl-cffi]"
          
          # Install other dependencies
          pip3 install telethon qrcode requests aiohttp python-socks[asyncio]
          
          # Verify installations
          echo ""
          echo "📊 VERIFYING INSTALLATIONS:"
          python3 -c "import telethon; print(f'✅ Telethon version: {telethon.__version__}')"
          python3 -c "import curl_cffi; print(f'✅ curl_cffi version: {curl_cffi.__version__}')"
          yt-dlp --version
          
          # Test Cloudflare bypass
          echo ""
          echo "🛡️ TESTING CLOUDFLARE BYPASS:"
          echo "Available impersonation targets:"
          yt-dlp --list-impersonate-targets | head -20
          
          echo ""
          echo "========================================="
          echo "✅ INSTALLATION COMPLETE"
          echo "========================================="

      - name: Compute Dynamic Formatted Output Filename & Label
        id: fname
        run: |
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Series' }}"
          
          echo "========================================="
          echo "📝 COMPUTING FILENAME"
          echo "========================================="
          echo "📺 Series: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "========================================="
          
          CLEAN_LABEL=$(echo "$LABEL" | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          CLEAN_SERIES_TITLE=$(echo "$SERIES" | sed -e 's/[\/:*?"<>|]/_/g' -e 's/^ *//' -e 's/ *$//')
          CLEAN_SERIES_TAG=$(echo "$CLEAN_SERIES_TITLE" | tr ' ' '_')
          
          DATE_STR=$(date +'%Y-%m-%d')
          
          TAG_NAME="${DATE_STR}-${CLEAN_LABEL}-${CLEAN_SERIES_TAG}"
          FORMATTED_TITLE="[${DATE_STR}]-[${CLEAN_LABEL}]-${CLEAN_SERIES_TITLE}"
          
          echo "📄 Formatted Title: $FORMATTED_TITLE"
          echo "🏷️  Tag Name: $TAG_NAME"
          echo "========================================="
          
          echo "formatted_title=${FORMATTED_TITLE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "series_title=${CLEAN_SERIES_TITLE}" >> $GITHUB_OUTPUT
          echo "clean_label=${CLEAN_LABEL}" >> $GITHUB_OUTPUT

      - name: Parse URLs with jq (Clean & Uncorrupted)
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "========================================="
          echo "📋 PARSING URLs"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          mkdir -p downloads && cd downloads
          
          # Extract URLs cleanly: remove \r carriage returns and trim whitespace
          echo "$CLIENT_PAYLOAD" | tr -d '\r' | jq -r '
            (.episodes[]?.url // .video_urls[]? // .video_url // .url // empty)
            | tostring | gsub("^\\s+|\\s+$"; "")
          ' > urls.txt
          
          # Remove empty lines
          sed -i '/^$/d' urls.txt
          
          echo "========================================="
          echo "📋 URLs to download:"
          cat urls.txt
          echo "========================================="
          
          echo "total_episodes=$(cat urls.txt | wc -l)" >> $GITHUB_ENV
          
          if [ ! -s urls.txt ]; then
            echo "❌ No valid URLs found!"
            exit 1
          fi
          
          echo "✅ Found $(cat urls.txt | wc -l) URLs"

      - name: Download All Episodes in Parallel (SMART 3-TIER with CLOUDFLARE DETECTION)
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ github.event.client_payload.label || 'NONE' }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📥 PARALLEL DOWNLOAD - SMART 3-TIER"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $(cat urls.txt | wc -l)"
          echo ""
          echo "📋 Download Strategy:"
          echo "   📺 HLS/m3u8 → Skip aria2c → yt-dlp → Cloudflare fallback"
          echo "   📁 Direct MP4 → aria2c (FAST) → yt-dlp → Cloudflare fallback"
          echo ""
          echo "🛡️ Cloudflare Detection:"
          echo "   - Detects Cloudflare challenges in yt-dlp output"
          echo "   - Auto-switches to impersonation (chrome/edge/safari)"
          echo "   - Multiple retry attempts with different impersonation targets"
          echo ""
          echo "📥 Downloading 4 episodes simultaneously"
          echo "========================================="
          
          TOTAL_EPISODES=$(cat urls.txt | wc -l)
          
          # Create smart download function with enhanced Cloudflare detection
          download_episode() {
            local URL="$1"
            local OUTPUT="$2"
            local EP_NUM="$3"
            
            echo "📥 [Episode $EP_NUM] Starting download..."
            
            # =============================================
            # DETECT STREAM TYPE
            # =============================================
            local IS_HLS=false
            if [[ "$URL" == *".m3u8"* ]] || [[ "$URL" == *"m3u8"* ]] || [[ "$URL" == *"playlist"* ]] || [[ "$URL" == *"index.m3u8"* ]]; then
              IS_HLS=true
              echo "📺 [Episode $EP_NUM] HLS/m3u8 stream detected - skipping aria2c"
            else
              echo "📁 [Episode $EP_NUM] Direct file detected"
            fi
            
            # =============================================
            # FUNCTION: Check for Cloudflare in output
            # =============================================
            check_cloudflare() {
              local OUTPUT="$1"
              if echo "$OUTPUT" | grep -qiE "cloudflare|cf-challenge|403|anti-bot|challenge|cf-ray|captcha|Access denied|blocked"; then
                return 0  # Cloudflare detected
              fi
              return 1  # No Cloudflare
            }
            
            # =============================================
            # TIER 1: aria2c (ONLY for direct downloads, NOT HLS)
            # =============================================
            if [ "$IS_HLS" = false ]; then
              echo "⚡ [Episode $EP_NUM] TIER 1: aria2c (16 parallel connections)"
              
              if aria2c \
                -x 16 -s 16 -k 1M \
                --max-connection-per-server=16 \
                --split=16 \
                --min-split-size=1M \
                --enable-http-pipelining=true \
                --http-pipelining=true \
                --max-tries=3 \
                --retry-wait=1 \
                --continue=true \
                --allow-overwrite=true \
                --console-log-level=error \
                --summary-interval=0 \
                --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                --header="Accept: video/webm,video/ogg,video/*;q=0.9,application/ogg;q=0.7,audio/*;q=0.6,*/*;q=0.5" \
                --header="Accept-Language: en-US,en;q=0.9" \
                --header="Accept-Encoding: gzip, deflate, br" \
                --header="Connection: keep-alive" \
                -o "$OUTPUT" \
                "$URL" 2>/dev/null; then
                
                if [ -f "$OUTPUT" ] && [ -s "$OUTPUT" ]; then
                  SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo "0")
                  if [ "$SIZE" -gt 100000 ]; then
                    echo "✅ [Episode $EP_NUM] Downloaded with aria2c ($((SIZE/1024/1024))MB) - FAST!"
                    return 0
                  fi
                  echo "⚠️ [Episode $EP_NUM] aria2c download too small, trying TIER 2..."
                  rm -f "$OUTPUT"
                fi
              else
                echo "⚠️ [Episode $EP_NUM] aria2c failed, trying TIER 2..."
              fi
            fi
            
            # =============================================
            # TIER 2: yt-dlp (standard - NO impersonation)
            # =============================================
            echo "🔄 [Episode $EP_NUM] TIER 2: yt-dlp (standard)"
            
            # Try standard yt-dlp first (no impersonation)
            local YT_OUTPUT=""
            local YT_EXIT_CODE=0
            
            # Run yt-dlp and capture output
            YT_OUTPUT=$(yt-dlp \
              --no-progress \
              --no-warnings \
              --no-check-certificates \
              --no-part \
              -f "bestvideo+bestaudio/best" \
              --hls-use-mpegts \
              -o "$OUTPUT" \
              "$URL" 2>&1) || YT_EXIT_CODE=$?
            
            # Check for Cloudflare in output
            if check_cloudflare "$YT_OUTPUT"; then
              echo "🛡️ [Episode $EP_NUM] CLOUDFLARE DETECTED in standard yt-dlp!"
              echo "   ${YT_OUTPUT##*$'\n'}"  # Show last line of error
              rm -f "$OUTPUT"
            fi
            
            # Check if download was successful
            if [ $YT_EXIT_CODE -eq 0 ] && [ -f "$OUTPUT" ] && [ -s "$OUTPUT" ]; then
              SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo "0")
              if [ "$SIZE" -gt 100000 ]; then
                echo "✅ [Episode $EP_NUM] Downloaded with yt-dlp (standard) ($((SIZE/1024/1024))MB)"
                return 0
              fi
              echo "⚠️ [Episode $EP_NUM] yt-dlp download too small, trying TIER 3..."
              rm -f "$OUTPUT"
            else
              if ! check_cloudflare "$YT_OUTPUT"; then
                echo "⚠️ [Episode $EP_NUM] yt-dlp failed, trying TIER 3..."
              fi
            fi
            
            # =============================================
            # TIER 3: yt-dlp with Cloudflare bypass
            # =============================================
            echo "🛡️ [Episode $EP_NUM] TIER 3: yt-dlp with Cloudflare bypass"
            
            # Try multiple impersonation targets for Cloudflare
            local CLOUDFLARE_SUCCESS=false
            local IMPERSONATION_TARGETS=("chrome" "edge" "safari" "chrome-110" "chrome-120")
            
            for TARGET in "${IMPERSONATION_TARGETS[@]}"; do
              echo "🛡️ [Episode $EP_NUM] Trying $TARGET impersonation..."
              
              local CF_OUTPUT=""
              local CF_EXIT_CODE=0
              
              # Try with impersonation
              CF_OUTPUT=$(yt-dlp \
                --no-progress \
                --no-warnings \
                --no-check-certificates \
                --no-part \
                --impersonate "$TARGET" \
                --extractor-args "generic:impersonate=$TARGET" \
                -f "bestvideo+bestaudio/best" \
                --hls-use-mpegts \
                -o "$OUTPUT" \
                "$URL" 2>&1) || CF_EXIT_CODE=$?
              
              # Check if download was successful
              if [ $CF_EXIT_CODE -eq 0 ] && [ -f "$OUTPUT" ] && [ -s "$OUTPUT" ]; then
                SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo "0")
                if [ "$SIZE" -gt 100000 ]; then
                  echo "✅ [Episode $EP_NUM] Downloaded with yt-dlp $TARGET (Cloudflare bypass) ($((SIZE/1024/1024))MB)"
                  CLOUDFLARE_SUCCESS=true
                  break
                fi
                rm -f "$OUTPUT"
              fi
              
              # Check if still getting Cloudflare
              if check_cloudflare "$CF_OUTPUT"; then
                echo "⚠️ [Episode $EP_NUM] Still getting Cloudflare with $TARGET, trying next..."
              fi
              
              # Small delay between attempts
              sleep 1
            done
            
            if [ "$CLOUDFLARE_SUCCESS" = true ]; then
              return 0
            fi
            
            # =============================================
            # ULTIMATE FALLBACK: yt-dlp with all options
            # =============================================
            echo "🔄 [Episode $EP_NUM] ULTIMATE FALLBACK: yt-dlp with all options"
            
            if yt-dlp \
              --no-progress \
              --no-warnings \
              --no-check-certificates \
              --no-part \
              --impersonate chrome \
              --extractor-args "generic:impersonate=chrome" \
              --add-header "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              --add-header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
              --add-header "Accept-Language: en-US,en;q=0.9" \
              --add-header "Accept-Encoding: gzip, deflate, br" \
              --add-header "Connection: keep-alive" \
              -f "bestvideo+bestaudio/best" \
              --hls-use-mpegts \
              -o "$OUTPUT" \
              "$URL" 2>/dev/null; then
              
              if [ -f "$OUTPUT" ] && [ -s "$OUTPUT" ]; then
                SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo "0")
                if [ "$SIZE" -gt 100000 ]; then
                  echo "✅ [Episode $EP_NUM] Downloaded with yt-dlp (ultimate fallback) ($((SIZE/1024/1024))MB)"
                  return 0
                fi
                rm -f "$OUTPUT"
              fi
            fi
            
            # =============================================
            # FINAL FALLBACK: curl with browser headers
            # =============================================
            echo "🔄 [Episode $EP_NUM] FINAL FALLBACK: curl"
            curl -L -C - -o "$OUTPUT" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.9" \
              -H "Accept-Encoding: gzip, deflate, br" \
              -H "Connection: keep-alive" \
              --connect-timeout 30 \
              --max-time 300 \
              "$URL" 2>/dev/null
            
            if [ -f "$OUTPUT" ] && [ -s "$OUTPUT" ]; then
              SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo "0")
              if [ "$SIZE" -gt 100000 ]; then
                echo "✅ [Episode $EP_NUM] Downloaded with curl ($((SIZE/1024/1024))MB)"
                return 0
              fi
              rm -f "$OUTPUT"
            fi
            
            echo "❌ [Episode $EP_NUM] All download methods failed"
            return 1
          }
          
          export -f download_episode
          
          # Create command file for parallel execution
          COMMANDS_FILE="parallel_commands.txt"
          > "$COMMANDS_FILE"
          
          EP_INDEX=1
          while IFS= read -r URL || [ -n "$URL" ]; do
            URL=$(echo "$URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$URL" ]; then continue; fi
            
            EP_NUM=$(printf "%02d" $EP_INDEX)
            OUT_FILE="EP${EP_NUM}.mp4"
            
            echo "download_episode \"$URL\" \"$OUT_FILE\" \"$EP_INDEX\"" >> "$COMMANDS_FILE"
            EP_INDEX=$((EP_INDEX + 1))
          done < urls.txt
          
          # Download 4 episodes in parallel
          echo ""
          echo "🚀 Starting parallel downloads (4 at a time)..."
          echo ""
          
          # Use GNU parallel with 4 jobs and progress bar
          cat "$COMMANDS_FILE" | parallel -j 4 --bar --joblog parallel.log
          
          # Check results
          echo ""
          echo "========================================="
          echo "📊 DOWNLOAD SUMMARY"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Expected: $TOTAL_EPISODES episodes"
          
          FINAL_COUNT=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          echo "✅ Downloaded: $FINAL_COUNT/$TOTAL_EPISODES episodes"
          
          # Show download statistics
          echo ""
          echo "📊 Download Statistics:"
          if [ -f "parallel.log" ]; then
            SUCCESS_COUNT=$(awk 'NR>1 && $7==0' parallel.log | wc -l)
            FAIL_COUNT=$(awk 'NR>1 && $7!=0' parallel.log | wc -l)
            echo "   ✅ Successful: $SUCCESS_COUNT"
            echo "   ❌ Failed: $FAIL_COUNT"
          fi
          
          # Check for missing episodes
          FAILED_DOWNLOADS=""
          for ((i=1; i<=$TOTAL_EPISODES; i++)); do
            EP_NUM=$(printf "%02d" $i)
            if [ ! -f "EP${EP_NUM}.mp4" ] || [ ! -s "EP${EP_NUM}.mp4" ]; then
              FAILED_DOWNLOADS="$FAILED_DOWNLOADS $EP_NUM"
            fi
          done
          
          if [ -n "$FAILED_DOWNLOADS" ]; then
            echo "❌ FAILED EPISODES: $FAILED_DOWNLOADS"
            
            # Try to redownload failed episodes sequentially
            echo ""
            echo "🔄 Attempting to redownload failed episodes sequentially..."
            
            EP_INDEX=1
            while IFS= read -r URL || [ -n "$URL" ]; do
              URL=$(echo "$URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              if [ -z "$URL" ]; then continue; fi
              
              EP_NUM=$(printf "%02d" $EP_INDEX)
              OUT_FILE="EP${EP_NUM}.mp4"
              
              if [ ! -f "$OUT_FILE" ] || [ ! -s "$OUT_FILE" ]; then
                echo "🔄 Redownloading Episode $EP_INDEX (sequential)..."
                download_episode "$URL" "$OUT_FILE" "$EP_INDEX"
              fi
              
              EP_INDEX=$((EP_INDEX + 1))
            done < urls.txt
            
            # Final check
            FINAL_COUNT_AFTER_RETRY=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
            if [ "$FINAL_COUNT_AFTER_RETRY" -ne "$TOTAL_EPISODES" ]; then
              echo "❌ Still missing episodes after retry!"
              exit 1
            fi
          fi
          
          echo "✅ All $TOTAL_EPISODES episodes downloaded successfully!"
          echo "========================================="
          
          # Show file sizes
          echo ""
          echo "📊 Final Episode Sizes:"
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f" 2>/dev/null || echo "0")
              SIZE_MB=$((SIZE / 1024 / 1024))
              printf "   %-10s: %3d MB\n" "$f" "$SIZE_MB"
            fi
          done
          echo "========================================="

      - name: Compress Episodes Larger Than 80MB (Very Fast Preset)
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ github.event.client_payload.label || 'NONE' }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔧 COMPRESSING EPISODES > 80MB"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "⚡ Using VERY FAST compression preset"
          echo "========================================="
          
          # Create fast compression script
          cat > fast_compress.py << 'EOFCOMPRESS'
          import os
          import sys
          import subprocess
          import json
          import time
          
          def get_video_info(file_path):
              try:
                  cmd = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-show_entries", "stream=width,height", "-of", "json", file_path]
                  result = subprocess.check_output(cmd, text=True)
                  data = json.loads(result)
                  duration = float(data.get('format', {}).get('duration', 0))
                  width, height = 1280, 720
                  for stream in data.get('streams', []):
                      if stream.get('codec_type') == 'video':
                          width = int(stream.get('width', 1280))
                          height = int(stream.get('height', 720))
                          break
                  return duration, width, height
              except:
                  return 0, 1280, 720
          
          def compress_with_veryfast(file_path, target_size_mb=80):
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"  📊 Original size: {file_size_mb:.1f}MB")
              
              if file_size_mb <= target_size_mb:
                  print(f"  ✅ File already under {target_size_mb}MB, skipping")
                  return True
              
              duration, width, height = get_video_info(file_path)
              print(f"  📊 Duration: {duration:.1f}s, Resolution: {width}x{height}")
              
              if duration > 0:
                  target_bitrate = (target_size_mb * 8 * 1024) / duration
                  target_bitrate = min(max(target_bitrate, 500), 2000)
              else:
                  target_bitrate = 1000
              
              print(f"  📊 Target bitrate: {int(target_bitrate)}kbps")
              
              base_name = os.path.splitext(file_path)[0]
              temp_file = f"{base_name}_fast.mp4"
              
              cmd = [
                  "ffmpeg", "-y", "-i", file_path,
                  "-c:v", "libx264", "-preset", "veryfast",
                  "-b:v", f"{int(target_bitrate)}k",
                  "-maxrate", f"{int(target_bitrate * 1.5)}k",
                  "-bufsize", f"{int(target_bitrate * 2)}k",
                  "-c:a", "aac", "-b:a", "128k", "-ar", "44100",
                  "-movflags", "+faststart",
                  "-threads", str(os.cpu_count() or 2),
                  temp_file
              ]
              
              try:
                  print(f"  🔄 Encoding...")
                  start_time = time.time()
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
                  elapsed = time.time() - start_time
                  print(f"  ⏱️  Encoding time: {elapsed:.1f}s")
                  
                  if result.returncode == 0 and os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                      new_size_mb = os.path.getsize(temp_file) / (1024 * 1024)
                      print(f"  ✅ Compressed: {new_size_mb:.1f}MB ({file_size_mb:.1f}MB -> {new_size_mb:.1f}MB)")
                      if new_size_mb <= target_size_mb * 1.1:
                          os.replace(temp_file, file_path)
                          return True
                  print(f"  ❌ Compression failed")
                  return False
              except Exception as e:
                  print(f"  ❌ Compression error: {e}")
                  return False
              finally:
                  if os.path.exists(temp_file):
                      try: os.remove(temp_file)
                      except: pass
          
          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  print("Usage: python fast_compress.py <file_path> [target_size_mb]")
                  sys.exit(1)
              file_path = sys.argv[1]
              target_size = int(sys.argv[2]) if len(sys.argv) > 2 else 80
              success = compress_with_veryfast(file_path, target_size)
              sys.exit(0 if success else 1)
          EOFCOMPRESS
          
          # Compress episodes in parallel (2 at a time)
          echo "📊 Compressing episodes in parallel (2 at a time)..."
          
          # Create compression commands
          COMPRESS_COMMANDS="compress_commands.txt"
          > "$COMPRESS_COMMANDS"
          
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              FILE_SIZE=$(stat -c%s "$f" 2>/dev/null || echo "0")
              FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
              if [ $FILE_SIZE_MB -gt 80 ]; then
                echo "python3 fast_compress.py \"$f\" 80" >> "$COMPRESS_COMMANDS"
              fi
            fi
          done
          
          # Run compression in parallel
          if [ -s "$COMPRESS_COMMANDS" ]; then
            cat "$COMPRESS_COMMANDS" | xargs -P 2 -I {} bash -c "{}"
          fi
          
          echo "✅ Compression complete!"
          echo "========================================="

      - name: Smart Merge Episodes
        id: merge
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔗 MERGING EPISODES"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📊 Episodes: $(ls -1 EP*.mp4 2>/dev/null | wc -l)"
          echo "========================================="
          
          EP_COUNT=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          if [ "$EP_COUNT" -eq 0 ]; then
            echo "❌ No episodes to merge!"
            exit 1
          fi
          
          if [ "$EP_COUNT" -eq 1 ]; then
            echo "📦 Only 1 episode - skipping merge"
            SINGLE_FILE=$(ls EP*.mp4 | head -1)
            cp "$SINGLE_FILE" "output.mp4"
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📊 Found $EP_COUNT episodes to merge"
          
          # Create concat list
          CONCAT_LIST="concat_list.txt"
          > $CONCAT_LIST
          
          for f in EP*.mp4; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              echo "file '$f'" >> $CONCAT_LIST
            fi
          done
          
          # Merge with FFmpeg
          echo "🔄 Concatenating files..."
          ffmpeg -f concat -safe 0 -i $CONCAT_LIST \
            -c copy -movflags +faststart \
            -metadata title="$TITLE" \
            -metadata series="$SERIES_TITLE" \
            -metadata label="$LABEL" \
            -metadata year="$(date +%Y)" \
            -metadata date="$(date +%Y-%m-%d)" \
            "output.mp4" 2>/dev/null
          
          if [ -f "output.mp4" ] && [ -s "output.mp4" ]; then
            echo "✅ Merge successful!"
            echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            ls -lh output.mp4
          else
            echo "❌ Merge failed!"
            exit 1
          fi
          echo "========================================="

      - name: Verify, Compress if Needed, and Fix Duration
        if: steps.merge.outputs.merge_success == 'true'
        id: verify
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔍 VERIFYING MERGED FILE"
          echo "========================================="
          
          if [ ! -f "output.mp4" ]; then
            echo "❌ output.mp4 not found!"
            exit 1
          fi
          
          FILE_SIZE_BYTES=$(stat -c%s "output.mp4" 2>/dev/null || echo "0")
          FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))
          echo "📊 File size: ${FILE_SIZE_MB} MB"
          
          # Compress if needed
          if [ $FILE_SIZE_MB -gt 1800 ]; then
            echo "⚠️ File exceeds 1.8GB, compressing..."
            
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "output.mp4" 2>/dev/null || echo "0")
            DURATION_INT=${DURATION%.*}
            
            if [ "$DURATION_INT" -gt 0 ]; then
              TARGET_SIZE_MB=1500
              TARGET_BITRATE=$((TARGET_SIZE_MB * 8 * 1024 / DURATION_INT))
              TARGET_BITRATE=$((TARGET_BITRATE > 500 ? TARGET_BITRATE : 500))
              echo "📊 Target bitrate: ${TARGET_BITRATE}k"
            else
              TARGET_BITRATE=1500
            fi
            
            ffmpeg -y -i "output.mp4" \
              -c:v libx264 -preset veryfast -b:v ${TARGET_BITRATE}k \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              "output_compressed.mp4" 2>/dev/null
            
            if [ -f "output_compressed.mp4" ] && [ -s "output_compressed.mp4" ]; then
              NEW_SIZE=$(stat -c%s "output_compressed.mp4" 2>/dev/null || echo "0")
              NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
              if [ $NEW_SIZE_MB -lt 1800 ]; then
                mv output_compressed.mp4 output.mp4
                echo "✅ File compressed! New size: ${NEW_SIZE_MB} MB"
              else
                rm -f output_compressed.mp4
              fi
            fi
          else
            echo "✅ File size is under 1.8GB, no compression needed"
          fi
          
          # Generate thumbnails
          echo "🖼️ Generating thumbnails..."
          ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
            -q:v 2 "thumb.jpg" 2>/dev/null
          
          ffmpeg -i "output.mp4" -ss 00:00:01 -vframes 1 \
            -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
            -q:v 2 "square_thumb.jpg" 2>/dev/null
          
          # Final verification
          FINAL_SIZE=$(stat -c%s "output.mp4" 2>/dev/null || echo "0")
          FINAL_SIZE_MB=$((FINAL_SIZE / 1024 / 1024))
          echo "✅ Final file size: ${FINAL_SIZE_MB} MB"
          
          if [ $FINAL_SIZE_MB -gt 2000 ]; then
            echo "❌ File exceeds 2GB limit!"
            exit 1
          fi
          
          echo "verify_success=true" >> $GITHUB_OUTPUT
          echo "merged_file_path=$(pwd)/output.mp4" >> $GITHUB_ENV
          echo "========================================="

      - name: Start Merged Upload (Background with Fast Upload)
        if: steps.verify.outputs.verify_success == 'true'
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TG_MERGED_CHAT_ID: ${{ secrets.TELEGRAM_MERGED_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TG_MERGED_NAME: ${{ secrets.TELEGRAM_MERGED_NAME }}
          TG_MERGED_INVITE_LINK: ${{ secrets.TELEGRAM_MERGED_INVITE_LINK }}
          MERGED_PATH: ${{ env.merged_file_path }}
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📤 STARTING MERGED UPLOAD"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📁 File: $MERGED_PATH"
          echo "========================================="
          
          # Create merged upload script
          cat > upload_merged.py << 'EOFUPLOAD'
          import os
          import sys
          import subprocess
          import asyncio
          import datetime
          import traceback
          
          try:
              from telethon import TelegramClient
              from telethon.sessions import StringSession
              from telethon.errors import FloodWaitError
              from telethon.tl.types import DocumentAttributeVideo
              import telethon
              print(f"✅ Telethon version: {telethon.__version__}")
          except ImportError as e:
              print(f"❌ Import error: {e}")
              sys.exit(1)
          
          api_id = os.environ.get("TG_API_ID")
          api_hash = os.environ.get("TG_API_HASH")
          session_string = os.environ.get("TG_SESSION_STRING")
          chat_id_raw = os.environ.get("TG_MERGED_CHAT_ID")
          video_path = os.environ.get("MERGED_PATH")
          title = os.environ.get("TITLE")
          series_title = os.environ.get("SERIES_TITLE", "Series")
          label = os.environ.get("LABEL", "NONE")
          
          if not all([api_id, api_hash, session_string]):
              print("❌ Missing Telegram credentials")
              sys.exit(0)
          
          def get_video_metadata(file_path):
              try:
                  cmd = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  duration = float(result) if result else 0
                  
                  cmd = ["mediainfo", "--Inform=Video;%Width%|%Height%", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  parts = result.split('|')
                  w = int(parts[0]) if len(parts) >= 2 and parts[0].isdigit() else 1280
                  h = int(parts[1]) if len(parts) >= 2 and parts[1].isdigit() else 720
                  
                  return int(duration), w, h
              except:
                  return 0, 1280, 720
          
          def progress_callback(current, total):
              percent = (current / total) * 100
              mb_uploaded = current / (1024 * 1024)
              mb_total = total / (1024 * 1024)
              if int(percent) % 5 == 0 or int(percent) == 100:
                  print(f"📤 Upload: {percent:.1f}% ({mb_uploaded:.1f}/{mb_total:.1f} MB)")
          
          async def main():
              try:
                  client = TelegramClient(StringSession(session_string), int(api_id), api_hash)
                  await client.connect()
                  
                  if not await client.is_user_authorized():
                      print("❌ Session invalid")
                      return
                  
                  me = await client.get_me()
                  print(f"✅ Logged in: {me.first_name}")
                  
                  chat_id = int(chat_id_raw) if chat_id_raw and chat_id_raw.lstrip('-').isdigit() else chat_id_raw
                  entity = await client.get_entity(chat_id)
                  
                  print(f"📤 Uploading to: {entity.title if hasattr(entity, 'title') else entity.id}")
                  
                  if not os.path.exists(video_path):
                      print(f"❌ File not found: {video_path}")
                      return
                  
                  duration, w, h = get_video_metadata(video_path)
                  print(f"📊 Duration: {duration}s, Resolution: {w}x{h}")
                  
                  # Generate thumbnail
                  thumb_path = f"{video_path}_thumb.jpg"
                  try:
                      subprocess.run([
                          "ffmpeg", "-y", "-ss", "00:00:01", "-i", video_path,
                          "-vf", "scale=512:512:force_original_aspect_ratio=decrease,pad=512:512:(ow-iw)/2:(oh-ih)/2:color=black",
                          "-vframes", "1", "-q:v", "2", thumb_path
                      ], capture_output=True, check=True)
                  except:
                      thumb_path = None
                  
                  video_attr = DocumentAttributeVideo(duration=duration, w=w, h=h, supports_streaming=True)
                  
                  now = datetime.datetime.now()
                  month_year = now.strftime("%B%Y").upper()
                  caption = f"{title}\n#UNWATCHED\n#{month_year}\n#{month_year}UNWATCHED\n#{label}"
                  
                  print("⏫ Uploading file...")
                  
                  uploaded_file = await client.upload_file(
                      video_path,
                      part_size_kb=512,
                      progress_callback=progress_callback
                  )
                  
                  kwargs = {
                      "entity": entity,
                      "file": uploaded_file,
                      "caption": caption,
                      "attributes": [video_attr],
                      "supports_streaming": True
                  }
                  
                  if thumb_path and os.path.exists(thumb_path):
                      kwargs["thumb"] = thumb_path
                  
                  await client.send_file(**kwargs)
                  print("✅ Upload complete!")
                  
                  await client.disconnect()
                  
              except Exception as e:
                  print(f"❌ Error: {e}")
                  traceback.print_exc()
          
          if __name__ == '__main__':
              asyncio.run(main())
          EOFUPLOAD
          
          echo "🚀 Starting merged upload..."
          python3 -u upload_merged.py
          echo "✅ Merged upload completed!"

      - name: Upload Single Episodes (Fast Upload)
        if: steps.verify.outputs.verify_success == 'true'
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TG_SINGLE_EPISODES_CHAT_ID: ${{ secrets.TELEGRAM_SINGLE_EPISODES_CHAT_ID }}
          TG_SINGLE_EPISODES_NAME: ${{ secrets.TELEGRAM_SINGLE_EPISODES_NAME }}
          TG_SINGLE_EPISODES_INVITE_LINK: ${{ secrets.TELEGRAM_SINGLE_EPISODES_INVITE_LINK }}
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📤 UPLOADING SINGLE EPISODES"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Episodes: $(ls -1 EP*.mp4 2>/dev/null | wc -l)"
          echo "========================================="
          
          # Create single upload script
          cat > upload_single.py << 'EOFUPLOAD'
          import os
          import sys
          import glob
          import subprocess
          import asyncio
          import datetime
          import traceback
          
          try:
              from telethon import TelegramClient
              from telethon.sessions import StringSession
              from telethon.errors import FloodWaitError
              from telethon.tl.types import DocumentAttributeVideo
              import telethon
          except ImportError as e:
              print(f"❌ Import error: {e}")
              sys.exit(1)
          
          api_id = os.environ.get("TG_API_ID")
          api_hash = os.environ.get("TG_API_HASH")
          session_string = os.environ.get("TG_SESSION_STRING")
          chat_id_raw = os.environ.get("TG_SINGLE_EPISODES_CHAT_ID")
          series_title = os.environ.get("SERIES_TITLE", "Series")
          
          if not all([api_id, api_hash, session_string]):
              print("❌ Missing Telegram credentials")
              sys.exit(0)
          
          def get_video_metadata(file_path):
              try:
                  cmd = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  duration = float(result) if result else 0
                  
                  cmd = ["mediainfo", "--Inform=Video;%Width%|%Height%", file_path]
                  result = subprocess.check_output(cmd, text=True).strip()
                  parts = result.split('|')
                  w = int(parts[0]) if len(parts) >= 2 and parts[0].isdigit() else 1280
                  h = int(parts[1]) if len(parts) >= 2 and parts[1].isdigit() else 720
                  
                  return int(duration), w, h
              except:
                  return 0, 1280, 720
          
          def progress_callback(current, total):
              percent = (current / total) * 100
              if int(percent) % 10 == 0 or int(percent) == 100:
                  print(f"   Upload: {percent:.0f}%")
          
          async def main():
              try:
                  client = TelegramClient(StringSession(session_string), int(api_id), api_hash)
                  await client.connect()
                  
                  if not await client.is_user_authorized():
                      print("❌ Session invalid")
                      return
                  
                  me = await client.get_me()
                  print(f"✅ Logged in: {me.first_name}")
                  
                  chat_id = int(chat_id_raw) if chat_id_raw and chat_id_raw.lstrip('-').isdigit() else chat_id_raw
                  entity = await client.get_entity(chat_id)
                  
                  print(f"📤 Uploading episodes to: {entity.title if hasattr(entity, 'title') else entity.id}")
                  
                  ep_files = sorted(glob.glob("EP*.mp4"))
                  
                  for ep_file in ep_files:
                      print(f"\n📤 Uploading {ep_file}...")
                      
                      duration, w, h = get_video_metadata(ep_file)
                      video_attr = DocumentAttributeVideo(duration=duration, w=w, h=h, supports_streaming=True)
                      
                      uploaded_file = await client.upload_file(
                          ep_file,
                          part_size_kb=512,
                          progress_callback=progress_callback
                      )
                      
                      await client.send_file(
                          entity=entity,
                          file=uploaded_file,
                          caption=f"📺 {ep_file}",
                          attributes=[video_attr],
                          supports_streaming=True
                      )
                      
                      print(f"✅ {ep_file} uploaded!")
                      
                      # Small delay between uploads
                      await asyncio.sleep(1)
                  
                  await client.disconnect()
                  print("\n✅ All episodes uploaded!")
                  
              except Exception as e:
                  print(f"❌ Error: {e}")
                  traceback.print_exc()
          
          if __name__ == '__main__':
              asyncio.run(main())
          EOFUPLOAD
          
          echo "🚀 Uploading episodes..."
          python3 -u upload_single.py
          echo "✅ Episode uploads completed!"

      - name: Cleanup - Delete Workflow Run if Successful
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const runId = context.runId;
            const repo = context.repo;
            
            console.log(`🧹 Cleaning up workflow run ${runId}`);
            
            try {
              await github.rest.actions.deleteWorkflowRun({
                owner: repo.owner,
                repo: repo.repo,
                run_id: runId
              });
              console.log(`✅ Successfully deleted workflow run ${runId}`);
            } catch (error) {
              console.log(`❌ Failed to delete workflow run: ${error.message}`);
            }
