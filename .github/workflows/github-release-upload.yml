name: GitHub Telegram & Media Pipeline

on:
  repository_dispatch:
    types: [github_release_upload]

# ONLY ONE WORKFLOW RUN AT A TIME
concurrency:
  group: media-pipeline-processor
  cancel-in-progress: false
  queue: max

# Add permissions for deleting workflow runs
permissions:
  actions: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📋 Series Information & Setup
        run: |
          echo "========================================="
          echo "📋 SERIES INFORMATION"
          echo "========================================="
          
          # Extract series information from payload
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Unknown Series' }}"
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          EPISODE_COUNT="${{ github.event.client_payload.episode_count || 'Unknown' }}"
          
          echo "📺 Series Title: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "📊 Episode Count: $EPISODE_COUNT"
          echo "⏰ Started at: $(date)"
          echo "========================================="
          
          # Store for later use
          echo "series_title=$SERIES" >> $GITHUB_ENV
          echo "label=$LABEL" >> $GITHUB_ENV
          
          # Create a file to track workflow progress
          echo "STARTED" > workflow_status.txt

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Tools & Dependencies
        timeout-minutes: 5
        id: install_tools
        run: |
          echo "========================================="
          echo "🔧 INSTALLING TOOLS"
          echo "========================================="
          
          # Prevent interactive debconf prompts and disable needrestart hangs
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          export NEEDRESTART_SUSPEND=1
          sudo rm -f /etc/apt/apt.conf.d/99needrestart /var/lib/man-db/auto-update 2>/dev/null || true
          
          APT_FLAGS="-y -qq --no-install-recommends -o DPkg::Lock::Timeout=120 -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          
          echo "📦 Updating apt cache..."
          sudo apt-get update -qq -o Acquire::ForceIPv4=true -o Acquire::Retries=3 || true
          
          echo "📦 Installing system packages (ffmpeg, aria2, mkvtoolnix, mediainfo, exiftool, bc)..."
          sudo apt-get install $APT_FLAGS ffmpeg aria2 mkvtoolnix mediainfo libimage-exiftool-perl bc jq || {
            echo "⚠️ Retrying package install individually..."
            for pkg in ffmpeg aria2 mkvtoolnix mediainfo libimage-exiftool-perl bc jq; do
              sudo apt-get install $APT_FLAGS "$pkg" || echo "⚠️ Warning: $pkg install failed"
            done
          }

          echo "📦 Upgrading pip and installing Python packages..."
          python3 -m pip install --no-cache-dir --upgrade pip
          python3 -m pip install --no-cache-dir \
            "yt-dlp[default,curl-cffi]" \
            "curl_cffi" \
            "telethon==1.34.0" \
            "requests" \
            "aiohttp" \
            "python-socks[asyncio]" \
            "qrcode"

          echo "🔍 Verifying installed tools:"
          command -v ffmpeg &>/dev/null && echo "✅ ffmpeg: $(which ffmpeg)" || echo "⚠️ ffmpeg missing"
          command -v aria2c &>/dev/null && echo "✅ aria2c: $(which aria2c)" || echo "⚠️ aria2c missing"
          command -v mkvmerge &>/dev/null && echo "✅ mkvmerge: $(which mkvmerge)" || echo "⚠️ mkvmerge missing"
          command -v mediainfo &>/dev/null && echo "✅ mediainfo: $(which mediainfo)" || echo "⚠️ mediainfo missing"
          python3 -c "import telethon; print(f'✅ Telethon {telethon.__version__}')" || echo "⚠️ Telethon missing"
          python3 -c "import yt_dlp, curl_cffi; print('✅ yt-dlp & curl_cffi ready')" || echo "⚠️ yt-dlp / curl_cffi missing"
          echo "========================================="
          echo "✅ INSTALLATION COMPLETE"
          echo "========================================="
          
          # Show versions
          echo "📊 Tool versions:"
          ffmpeg -version | head -1 || echo "⚠️ ffmpeg not found"
          aria2c --version | head -1 || echo "⚠️ aria2 not found"
          mkvmerge --version | head -1 || echo "⚠️ mkvmerge not found"
          python3 --version || echo "⚠️ python3 not found"
          python3 -c "import telethon; print(f'Telethon {telethon.__version__}')" 2>/dev/null || echo "⚠️ Telethon not found"
          echo "========================================="
          
          echo "INSTALLED" > ../tools_installed.txt

      - name: Compute Dynamic Formatted Output Filename & Label
        id: fname
        run: |
          LABEL="${{ github.event.client_payload.label || 'NONE' }}"
          SERIES="${{ github.event.client_payload.series || github.event.client_payload.series_name || 'Series' }}"
          
          echo "========================================="
          echo "📝 COMPUTING FILENAME"
          echo "========================================="
          echo "📺 Series: $SERIES"
          echo "🏷️  Label: $LABEL"
          echo "========================================="
          
          CLEAN_LABEL=$(echo "$LABEL" | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          CLEAN_SERIES_TITLE=$(echo "$SERIES" | sed -e 's/[\/:*?"<>|]/_/g' -e 's/^ *//' -e 's/ *$//')
          CLEAN_SERIES_TAG=$(echo "$CLEAN_SERIES_TITLE" | tr ' ' '_')
          
          DATE_STR=$(date +'%Y-%m-%d')
          
          TAG_NAME="${DATE_STR}-${CLEAN_LABEL}-${CLEAN_SERIES_TAG}"
          FORMATTED_TITLE="[${DATE_STR}]-[${CLEAN_LABEL}]-${CLEAN_SERIES_TITLE}"
          
          # Create a safe output filename for GitHub: {date}_{label}_{series_title}.mp4
          SAFE_SERIES_NAME=$(echo "$CLEAN_SERIES_TITLE" | tr ' ' '_' | tr -d '[:punct:]' | tr '[:upper:]' '[:lower:]')
          SAFE_LABEL=$(echo "$CLEAN_LABEL" | tr '[:upper:]' '[:lower:]')
          OUTPUT_FILENAME="${DATE_STR}_${SAFE_LABEL}_${SAFE_SERIES_NAME}.mp4"
          
          echo "📄 Formatted Title: $FORMATTED_TITLE"
          echo "🏷️  Tag Name: $TAG_NAME"
          echo "📁 Output Filename: $OUTPUT_FILENAME"
          echo "========================================="
          
          echo "formatted_title=${FORMATTED_TITLE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "series_title=${CLEAN_SERIES_TITLE}" >> $GITHUB_OUTPUT
          echo "clean_label=${CLEAN_LABEL}" >> $GITHUB_OUTPUT
          echo "output_filename=${OUTPUT_FILENAME}" >> $GITHUB_OUTPUT

      - name: Parse URLs with jq (Clean & Uncorrupted)
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "========================================="
          echo "📋 PARSING URLs"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          mkdir -p downloads && cd downloads
          
          # Extract URLs cleanly: remove \r carriage returns and trim whitespace
          echo "$CLIENT_PAYLOAD" | tr -d '\r' | jq -r '
            (.episodes[]?.url // .video_urls[]? // .video_url // .url // empty)
            | tostring | gsub("^\\s+|\\s+$"; "")
          ' > urls.txt
          
          # Remove empty lines
          sed -i '/^$/d' urls.txt
          
          echo "========================================="
          echo "📋 URLs to download:"
          cat urls.txt
          echo "========================================="
          
          echo "total_episodes=$(cat urls.txt | wc -l)" >> $GITHUB_ENV
          
          if [ ! -s urls.txt ]; then
            echo "❌ No valid URLs found!"
            exit 1
          fi
          
          echo "✅ Found $(cat urls.txt | wc -l) URLs"

      - name: Download All Episodes First (Pure Download)
        timeout-minutes: 120
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "📥 DOWNLOADING ALL EPISODES (FAST BATCH)"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $(cat urls.txt | wc -l)"
          echo "========================================="
          
          TOTAL_EPISODES=$(cat urls.txt | wc -l)
          EP_INDEX=1
          FAILED_DOWNLOADS=""
          
          while IFS= read -u 3 -r URL || [ -n "$URL" ]; do
            URL=$(echo "$URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$URL" ]; then continue; fi
            
            EP_NUM=$(printf "%02d" $EP_INDEX)
            OUT_FILE="EP${EP_NUM}.mp4"
            
            echo "📥 Downloading Episode $EP_INDEX/$TOTAL_EPISODES -> $OUT_FILE"
            rm -f "$OUT_FILE" 2>/dev/null
            
            DOWNLOAD_SUCCESS=false
            
            if [[ "$URL" == *".m3u8"* ]] || [[ "$URL" == *".m3u"* ]] || [[ "$URL" == *"master.m3u8"* ]]; then
              # HLS Stream via yt-dlp
              yt-dlp \
                --extractor-args "generic:impersonate" \
                --impersonate chrome \
                -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best[ext=mp4]/best" \
                --merge-output-format mp4 \
                --hls-use-mpegts \
                --no-progress \
                --no-warnings \
                --quiet \
                --geo-bypass \
                --no-check-certificates \
                --socket-timeout 300 \
                --retries 10 \
                --fragment-retries 10 \
                -o "$OUT_FILE" \
                "$URL" 2>/dev/null
            else
              # Direct Video via aria2c
              aria2c -x 16 -s 16 -k 1M --continue=true \
                --console-log-level=error \
                --max-connection-per-server=16 \
                --split=16 \
                --min-split-size=1M \
                --max-overall-download-limit=0 \
                --max-download-limit=0 \
                -o "$OUT_FILE" "$URL" < /dev/null 2>/dev/null
            fi
            
            # Check if file was created and is non-empty (>100KB)
            if [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
              if [ "$FILE_SIZE" -gt 100000 ]; then
                DOWNLOAD_SUCCESS=true
                FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
                echo "   ✅ Episode $EP_INDEX downloaded (${FILE_SIZE_MB}MB)"
              fi
            fi
            
            # Fallback retry with yt-dlp + aria2c external if initial attempt failed
            if [ "$DOWNLOAD_SUCCESS" != true ]; then
              echo "   ⚠️ Direct download failed, retrying with yt-dlp fallback..."
              rm -f "$OUT_FILE" 2>/dev/null
              
              yt-dlp \
                --extractor-args "generic:impersonate" \
                --impersonate chrome \
                -f "bestvideo+bestaudio/best" \
                --merge-output-format mp4 \
                --hls-use-mpegts \
                --external-downloader aria2c \
                --external-downloader-args "-x 16 -s 16 -k 1M" \
                --no-progress \
                --no-warnings \
                --quiet \
                --geo-bypass \
                -o "$OUT_FILE" \
                "$URL" 2>/dev/null
              
              if [ -f "$OUT_FILE" ] && [ -s "$OUT_FILE" ]; then
                FILE_SIZE=$(stat -c%s "$OUT_FILE" 2>/dev/null || stat -f%z "$OUT_FILE" 2>/dev/null || echo "0")
                if [ "$FILE_SIZE" -gt 100000 ]; then
                  DOWNLOAD_SUCCESS=true
                  FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
                  echo "   ✅ Fallback download succeeded (${FILE_SIZE_MB}MB)"
                fi
              fi
            fi
            
            if [ "$DOWNLOAD_SUCCESS" != true ]; then
              echo "   ❌ Failed to download Episode $EP_INDEX"
              FAILED_DOWNLOADS="$FAILED_DOWNLOADS $EP_NUM"
            fi
            
            EP_INDEX=$((EP_INDEX + 1))
          done 3< urls.txt
          
          echo "========================================="
          echo "📊 DOWNLOAD SUMMARY"
          echo "========================================="
          TOTAL_FILES=$(ls -1 EP*.mp4 2>/dev/null | wc -l)
          echo "✅ Downloaded: $TOTAL_FILES/$TOTAL_EPISODES episodes"
          
          if [ -n "$FAILED_DOWNLOADS" ] || [ "$TOTAL_FILES" -ne "$TOTAL_EPISODES" ]; then
            echo "❌ Download failed for: $FAILED_DOWNLOADS"
            exit 1
          fi
          echo "✅ All episodes successfully downloaded to disk!"

      - name: Standardize & Fix Container Formats (MPEG-TS to MP4)
        timeout-minutes: 120
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "⚡ PARALLEL STANDARDIZING & FIXING CONTAINERS"
          echo "========================================="
          echo "💻 CPU Cores Detected on Runner: $(nproc)"
          echo "📺 Series: $SERIES_TITLE"
          echo "========================================="
          
          # Worker function executed in parallel across runner cores
          process_episode() {
            local f="$1"
            local fname
            fname=$(basename "$f")
            local temp="temp_fixed_${fname}"
            rm -f "$temp" 2>/dev/null
            
            # Probe container & video stream
            local container
            container=$(ffprobe -v error -show_entries format=format_name -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null | head -1)
            local format_info
            format_info=$(ffprobe -v error -show_entries format=format_long_name -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null | head -1)
            local has_video
            has_video=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$f" 2>/dev/null)
            
            local needs_fix=false
            if [[ "$container" == *"mpegts"* ]] || [[ "$container" == *"mpeg"* ]] || [[ "$format_info" == *"MPEG-TS"* ]] || [[ "$format_info" == *"MPEGTS"* ]] || [ -z "$has_video" ]; then
              needs_fix=true
            fi
            
            if [ "$needs_fix" = true ]; then
              # Attempt 1: Ultra-fast stream-copy remux with MPEG-TS AAC bitstream filter (0 re-encoding, ~0.05s)
              ffmpeg -y -err_detect ignore_err -i "$f" -c:v copy -c:a copy -bsf:a aac_adtstoasc -movflags +faststart "$temp" >/dev/null 2>&1
              
              if [ -s "$temp" ]; then
                local check_v
                check_v=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$temp" 2>/dev/null)
                if [ "$check_v" = "video" ]; then
                  mv "$temp" "$f"
                  echo "⚡ [Fixed Stream-Copy & Video Verified] $fname"
                  return 0
                fi
              fi
              
              # Attempt 2: High-speed ultrafast re-encode if stream copy fails
              rm -f "$temp" 2>/dev/null
              if [ "$has_video" = "video" ]; then
                ffmpeg -y -err_detect ignore_err -i "$f" -c:v libx264 -preset ultrafast -crf 23 -c:a aac -b:a 128k -ar 44100 -movflags +faststart "$temp" >/dev/null 2>&1
              else
                local dur
                dur=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null || echo "30")
                ffmpeg -y -f lavfi -i color=black:size=1280x720:duration="$dur" -i "$f" -c:v libx264 -preset ultrafast -crf 23 -c:a aac -b:a 128k -ar 44100 -shortest -movflags +faststart "$temp" >/dev/null 2>&1
              fi
              
              if [ -s "$temp" ]; then
                mv "$temp" "$f"
                echo "🔧 [Re-encoded Fix & Video Verified] $fname"
              else
                rm -f "$temp" 2>/dev/null
                echo "⚠️ [Failed to Remux] $fname"
              fi
            else
              echo "✅ [Standard MP4] $fname"
            fi
          }
          
          export -f process_episode
          
          # Execute in parallel on all runner CPU cores
          ls -1 EP*.mp4 2>/dev/null | sort -V | xargs -P $(nproc) -I {} bash -c 'process_episode "{}"'
          
          echo "========================================="
          echo "✅ All episodes standardized across $(nproc) runner cores!"
          echo "========================================="

      - name: Compress Episodes Larger Than 80MB (Very Fast Preset)
        timeout-minutes: 120
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ github.event.client_payload.label || 'NONE' }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔧 COMPRESSING EPISODES > 80MB"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "⚡ Using VERY FAST compression preset"
          echo "========================================="
          
          # Create fast compression script
          cat > fast_compress.py << 'EOFCOMPRESS'
          import os
          import sys
          import subprocess
          import shutil
          import json
          import time
          
          def get_video_info(file_path):
              """Get video duration, width, height using ffprobe"""
              try:
                  cmd = [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-show_entries", "stream=width,height,codec_name",
                      "-of", "json",
                      file_path
                  ]
                  result = subprocess.check_output(cmd, text=True)
                  data = json.loads(result)
                  
                  duration = float(data.get('format', {}).get('duration', 0))
                  
                  width, height = 1280, 720
                  for stream in data.get('streams', []):
                      if stream.get('codec_type') == 'video':
                          width = int(stream.get('width', 1280))
                          height = int(stream.get('height', 720))
                          break
                  
                  return duration, width, height
              except:
                  return 0, 1280, 720
          
          def compress_with_veryfast(file_path, target_size_mb=80):
              """
              Compress video using FFmpeg with VERY FAST preset
              This prioritizes speed over compression efficiency
              """
              print(f"  ⚡ Compressing with VERY FAST preset...")
              
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"  📊 Original size: {file_size_mb:.1f}MB")
              
              if file_size_mb <= target_size_mb:
                  print(f"  ✅ File already under {target_size_mb}MB, skipping compression")
                  return True
              
              # Get video info
              duration, width, height = get_video_info(file_path)
              print(f"  📊 Duration: {duration:.1f}s, Resolution: {width}x{height}")
              
              # Calculate target bitrate for target size
              if duration > 0:
                  target_bitrate = (target_size_mb * 8 * 1024) / duration
                  target_bitrate = min(max(target_bitrate, 500), 2000)
              else:
                  target_bitrate = 1000
              
              print(f"  📊 Target bitrate: {int(target_bitrate)}kbps")
              
              base_name = os.path.splitext(file_path)[0]
              temp_file = f"{base_name}_fast.mp4"
              
              # Use VERY FAST preset for maximum speed
              cmd = [
                  "ffmpeg", "-y",
                  "-i", file_path,
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-b:v", f"{int(target_bitrate)}k",
                  "-maxrate", f"{int(target_bitrate * 1.5)}k",
                  "-bufsize", f"{int(target_bitrate * 2)}k",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ar", "44100",
                  "-movflags", "+faststart",
                  "-threads", str(os.cpu_count() or 2),
                  temp_file
              ]
              
              try:
                  print(f"  🔄 Encoding...")
                  start_time = time.time()
                  
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
                  
                  elapsed = time.time() - start_time
                  print(f"  ⏱️  Encoding time: {elapsed:.1f}s")
                  
                  if result.returncode == 0 and os.path.exists(temp_file) and os.path.getsize(temp_file) > 0:
                      new_size_mb = os.path.getsize(temp_file) / (1024 * 1024)
                      print(f"  ✅ Compressed: {new_size_mb:.1f}MB ({file_size_mb:.1f}MB -> {new_size_mb:.1f}MB)")
                      
                      if new_size_mb <= target_size_mb * 1.1:
                          os.replace(temp_file, file_path)
                          return True
                      else:
                          print(f"  ⚠️ Still too large: {new_size_mb:.1f}MB")
                          
                          # Try even more aggressive compression
                          print(f"  🔄 Trying ULTRA FAST with higher CRF...")
                          temp_file2 = f"{base_name}_ultrafast.mp4"
                          
                          cmd2 = [
                              "ffmpeg", "-y",
                              "-i", file_path,
                              "-c:v", "libx264",
                              "-preset", "ultrafast",
                              "-crf", "28",
                              "-c:a", "aac",
                              "-b:a", "96k",
                              "-ar", "44100",
                              "-movflags", "+faststart",
                              "-threads", str(os.cpu_count() or 2),
                              temp_file2
                          ]
                          
                          result2 = subprocess.run(cmd2, capture_output=True, text=True, timeout=300)
                          
                          if result2.returncode == 0 and os.path.exists(temp_file2) and os.path.getsize(temp_file2) > 0:
                              new_size_mb2 = os.path.getsize(temp_file2) / (1024 * 1024)
                              print(f"  ✅ UltraFast compressed: {new_size_mb2:.1f}MB")
                              
                              if new_size_mb2 < new_size_mb:
                                  os.replace(temp_file2, file_path)
                                  return True
                              else:
                                  os.remove(temp_file2)
                          
                          os.remove(temp_file)
                          return False
                  else:
                      print(f"  ❌ Compression failed: {result.stderr[:200]}")
                      return False
                      
              except subprocess.TimeoutExpired:
                  print(f"  ❌ Compression timeout")
                  return False
              except Exception as e:
                  print(f"  ❌ Compression error: {e}")
                  return False
              finally:
                  # Cleanup temp files
                  for f in [temp_file, f"{base_name}_ultrafast.mp4"]:
                      if os.path.exists(f):
                          try: os.remove(f)
                          except: pass
              
              return False
          
          def process_episode(file_path, target_size_mb=80):
              """Process episode with fast compression"""
              if not os.path.exists(file_path):
                  print(f"❌ File not found: {file_path}")
                  return False
              
              return compress_with_veryfast(file_path, target_size_mb)
          
          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  print("Usage: python fast_compress.py <file_path> [target_size_mb]")
                  sys.exit(1)
              
              file_path = sys.argv[1]
              target_size = int(sys.argv[2]) if len(sys.argv) > 2 else 80
              
              success = process_episode(file_path, target_size)
              sys.exit(0 if success else 1)
          EOFCOMPRESS
          
          # Get list of all episodes sorted numerically
          EPISODE_FILES=()
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              EP_NUM=$(echo "$f" | grep -oE '[0-9]+' | head -1)
              if [ -n "$EP_NUM" ]; then
                EPISODE_FILES+=("$EP_NUM:$f")
              fi
            fi
          done
          
          # Sort by episode number numerically
          IFS=$'\n' SORTED_EPISODES=($(sort -t: -k1 -n <<<"${EPISODE_FILES[*]}"))
          
          TOTAL_EPISODES=${#SORTED_EPISODES[@]}
          COMPRESSED_COUNT=0
          FAILED_COMPRESSIONS=""
          
          echo "📊 Checking episode sizes..."
          echo ""
          
          for entry in "${SORTED_EPISODES[@]}"; do
            f="${entry#*:}"
            if [ ! -f "$f" ]; then continue; fi
            
            FILE_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "0")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            echo "📹 $f: ${FILE_SIZE_MB}MB"
            
            if [ $FILE_SIZE_MB -gt 80 ]; then
              echo "⚠️  $f exceeds 80MB, compressing..."
              
              # Add metadata before compression
              EP_NUM=$(echo "$f" | grep -o '[0-9]*' | head -1)
              EPISODE_TITLE="Episode ${EP_NUM} - ${SERIES_TITLE}"
              
              # Compress with very fast preset
              if python3 fast_compress.py "$f" 80 < /dev/null; then
                COMPRESSED_COUNT=$((COMPRESSED_COUNT + 1))
                NEW_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "0")
                NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
                echo "✅ $f compressed: ${NEW_SIZE_MB}MB"
              else
                echo "❌ Failed to compress $f"
                FAILED_COMPRESSIONS="$FAILED_COMPRESSIONS $f"
              fi
            else
              echo "✅ $f already under 80MB, skipping compression"
            fi
            echo ""
          done
          
          echo "========================================="
          echo "📊 COMPRESSION SUMMARY"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $TOTAL_EPISODES"
          echo "📊 Compressed: $COMPRESSED_COUNT episodes"
          
          if [ -n "$FAILED_COMPRESSIONS" ]; then
            echo "❌ FAILED COMPRESSIONS: $FAILED_COMPRESSIONS"
            echo "❌ Not all episodes compressed successfully!"
            echo "   This is an all-or-nothing workflow. Exiting."
            exit 1
          fi
          
          echo "✅ All episodes processed successfully!"
          echo "========================================="
          
          # Show final file sizes
          echo ""
          echo "📊 Final episode sizes:"
          for entry in "${SORTED_EPISODES[@]}"; do
            f="${entry#*:}"
            if [ -f "$f" ]; then
              SIZE_MB=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null | awk '{print $1/1024/1024}')
              printf "   %-10s: %.1f MB\n" "$f" "$SIZE_MB"
            fi
          done
          echo ""

      - name: ANALYZE EPISODES & DETERMINE MAJORITY STANDARD
        id: analyze
        timeout-minutes: 10
        run: |
          cd downloads
          
          echo "========================================="
          echo "📊 ANALYZING EPISODE SPECS"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          # Create a Python script to analyze all episodes
          cat > analyze_specs.py << 'EOFANALYZE'
          import os
          import json
          import subprocess
          from collections import Counter
          import sys
          
          def get_episode_specs(file_path):
              """Get video and audio specs for an episode using ffprobe"""
              try:
                  # Get all stream info with ffprobe
                  cmd = [
                      "ffprobe", "-v", "error",
                      "-show_entries", 
                      "stream=index,codec_type,width,height,codec_name,pix_fmt,sample_rate,channels,channel_layout",
                      "-of", "json",
                      file_path
                  ]
                  result = subprocess.check_output(cmd, text=True)
                  data = json.loads(result)
                  
                  # Initialize values
                  width, height = 0, 0
                  vcodec, pix_fmt = "unknown", "unknown"
                  sample_rate, channels = 0, 0
                  acodec = "unknown"
                  
                  # Find video and audio streams
                  video_stream = None
                  audio_stream = None
                  
                  for stream in data.get('streams', []):
                      codec_type = stream.get('codec_type', '')
                      if codec_type == 'video' and video_stream is None:
                          video_stream = stream
                      elif codec_type == 'audio' and audio_stream is None:
                          audio_stream = stream
                  
                  # Extract video specs
                  if video_stream:
                      width = int(video_stream.get('width', 0))
                      height = int(video_stream.get('height', 0))
                      vcodec = video_stream.get('codec_name', 'unknown')
                      pix_fmt = video_stream.get('pix_fmt', 'unknown')
                  else:
                      # Try to find any video stream (fallback)
                      for stream in data.get('streams', []):
                          if stream.get('codec_type') == 'video':
                              width = int(stream.get('width', 0))
                              height = int(stream.get('height', 0))
                              vcodec = stream.get('codec_name', 'unknown')
                              pix_fmt = stream.get('pix_fmt', 'unknown')
                              break
                  
                  # Extract audio specs
                  if audio_stream:
                      sample_rate = int(audio_stream.get('sample_rate', 0))
                      channels = int(audio_stream.get('channels', 0))
                      acodec = audio_stream.get('codec_name', 'unknown')
                  else:
                      # Try to find any audio stream (fallback)
                      for stream in data.get('streams', []):
                          if stream.get('codec_type') == 'audio':
                              sample_rate = int(stream.get('sample_rate', 0))
                              channels = int(stream.get('channels', 0))
                              acodec = stream.get('codec_name', 'unknown')
                              break
                  
                  return {
                      'width': width,
                      'height': height,
                      'vcodec': vcodec,
                      'pix_fmt': pix_fmt,
                      'sample_rate': sample_rate,
                      'channels': channels,
                      'acodec': acodec,
                      'resolution': f"{width}x{height}",
                      'video_spec': f"{width}x{height}_{vcodec}_{pix_fmt}",
                      'audio_spec': f"{sample_rate}Hz_{channels}ch_{acodec}"
                  }
              except Exception as e:
                  print(f"⚠️ Error analyzing {file_path}: {e}")
                  return None
          
          # Get all episode files
          episode_files = sorted([f for f in os.listdir('.') if f.startswith('EP') and f.endswith('.mp4')])
          
          if not episode_files:
              print("❌ No episode files found!")
              sys.exit(1)
          
          print(f"📊 Found {len(episode_files)} episodes")
          print("")
          
          # Analyze each episode
          all_specs = []
          resolutions = []
          video_codecs = []
          audio_codecs = []
          sample_rates = []
          channels_list = []
          pix_formats = []
          
          for f in episode_files:
              specs = get_episode_specs(f)
              if specs:
                  specs['file'] = f
                  all_specs.append(specs)
                  resolutions.append(specs['resolution'])
                  video_codecs.append(specs['vcodec'])
                  audio_codecs.append(specs['acodec'])
                  sample_rates.append(specs['sample_rate'])
                  channels_list.append(specs['channels'])
                  pix_formats.append(specs['pix_fmt'])
                  
                  print(f"📹 {f}:")
                  print(f"   Resolution: {specs['resolution']}")
                  print(f"   Video Codec: {specs['vcodec']}")
                  print(f"   Pixel Format: {specs['pix_fmt']}")
                  print(f"   Audio Sample Rate: {specs['sample_rate']}Hz")
                  print(f"   Audio Channels: {specs['channels']}ch")
                  print(f"   Audio Codec: {specs['acodec']}")
                  print("")
              else:
                  print(f"⚠️ Could not analyze {f}")
          
          if not all_specs:
              print("❌ No valid episode specs found!")
              sys.exit(1)
          
          # Find the most common specs
          print("=========================================")
          print("📊 MAJORITY ANALYSIS")
          print("=========================================")
          
          # Video resolution majority
          res_counter = Counter(resolutions)
          most_common_res = res_counter.most_common(1)[0]
          print(f"📐 Most common resolution: {most_common_res[0]} ({most_common_res[1]}/{len(episode_files)} episodes)")
          
          # Video codec majority
          vcodec_counter = Counter(video_codecs)
          most_common_vcodec = vcodec_counter.most_common(1)[0]
          print(f"🎬 Most common video codec: {most_common_vcodec[0]} ({most_common_vcodec[1]}/{len(episode_files)} episodes)")
          
          # Pixel format majority
          pix_counter = Counter(pix_formats)
          most_common_pix = pix_counter.most_common(1)[0]
          print(f"🖼️  Most common pixel format: {most_common_pix[0]} ({most_common_pix[1]}/{len(episode_files)} episodes)")
          
          # Audio sample rate majority
          sr_counter = Counter(sample_rates)
          most_common_sr = sr_counter.most_common(1)[0]
          print(f"🎵 Most common sample rate: {most_common_sr[0]}Hz ({most_common_sr[1]}/{len(episode_files)} episodes)")
          
          # Audio channels majority
          ch_counter = Counter(channels_list)
          most_common_ch = ch_counter.most_common(1)[0]
          print(f"🔊 Most common channels: {most_common_ch[0]}ch ({most_common_ch[1]}/{len(episode_files)} episodes)")
          
          # Audio codec majority
          acodec_counter = Counter(audio_codecs)
          most_common_acodec = acodec_counter.most_common(1)[0]
          print(f"🎵 Most common audio codec: {most_common_acodec[0]} ({most_common_acodec[1]}/{len(episode_files)} episodes)")
          
          print("")
          
          # Determine standard based on majority
          width = int(most_common_res[0].split('x')[0])
          height = int(most_common_res[0].split('x')[1])
          vcodec = most_common_vcodec[0]
          pix_fmt = most_common_pix[0]
          sample_rate = most_common_sr[0]
          channels = most_common_ch[0]
          acodec = most_common_acodec[0]
          
          print("=========================================")
          print("✅ TARGET STANDARDS DETERMINED:")
          print(f"   Resolution: {width}x{height}")
          print(f"   Video Codec: {vcodec}")
          print(f"   Pixel Format: {pix_fmt}")
          print(f"   Audio Sample Rate: {sample_rate}Hz")
          print(f"   Audio Channels: {channels}ch")
          print(f"   Audio Codec: {acodec}")
          print("=========================================")
          
          # Check which episodes need conversion
          needs_conversion = []
          already_standard = []
          
          for specs in all_specs:
              if (specs['width'] == width and specs['height'] == height and 
                  specs['vcodec'] == vcodec and specs['pix_fmt'] == pix_fmt and
                  specs['sample_rate'] == sample_rate and specs['channels'] == channels and
                  specs['acodec'] == acodec):
                  already_standard.append(specs.get('file', 'unknown'))
              else:
                  needs_conversion.append(specs.get('file', 'unknown'))
          
          print(f"\n📊 Episodes already matching standard: {len(already_standard)}")
          print(f"🔄 Episodes needing conversion: {len(needs_conversion)}")
          
          if len(needs_conversion) == 0:
              print("✅ ALL episodes already match the majority standard!")
          
          # Write standards to file for next steps
          with open('standard_specs.txt', 'w') as f:
              f.write(f"WIDTH={width}\n")
              f.write(f"HEIGHT={height}\n")
              f.write(f"VIDEO_CODEC={vcodec}\n")
              f.write(f"PIX_FMT={pix_fmt}\n")
              f.write(f"AUDIO_SAMPLE_RATE={sample_rate}\n")
              f.write(f"AUDIO_CHANNELS={channels}\n")
              f.write(f"AUDIO_CODEC={acodec}\n")
              f.write(f"RESOLUTION={width}x{height}\n")
          
          # Write to GitHub outputs
          github_output = os.environ.get('GITHUB_OUTPUT')
          if github_output:
              with open(github_output, 'a') as f:
                  f.write(f"width={width}\n")
                  f.write(f"height={height}\n")
                  f.write(f"video_codec={vcodec}\n")
                  f.write(f"pix_fmt={pix_fmt}\n")
                  f.write(f"audio_sample_rate={sample_rate}\n")
                  f.write(f"audio_channels={channels}\n")
                  f.write(f"audio_codec={acodec}\n")
                  f.write(f"resolution={width}x{height}\n")
          
          # Also write a summary for debugging
          with open('specs_summary.txt', 'w') as f:
              f.write("EPISODE SPECS SUMMARY:\n")
              f.write("=" * 50 + "\n")
              for specs in all_specs:
                  f.write(f"\n{specs['file']}:\n")
                  f.write(f"  Resolution: {specs['resolution']}\n")
                  f.write(f"  Video Codec: {specs['vcodec']}\n")
                  f.write(f"  Pixel Format: {specs['pix_fmt']}\n")
                  f.write(f"  Audio Sample Rate: {specs['sample_rate']}Hz\n")
                  f.write(f"  Audio Channels: {specs['channels']}ch\n")
                  f.write(f"  Audio Codec: {specs['acodec']}\n")
          
          sys.exit(0)
          EOFANALYZE
          
          python3 analyze_specs.py
          
          # Display the specs summary for debugging
          if [ -f "specs_summary.txt" ]; then
            echo ""
            echo "========================================="
            echo "📋 EPISODE SPECS SUMMARY:"
            echo "========================================="
            cat specs_summary.txt
            echo "========================================="
          fi
          
          # Load the standard specs
          if [ -f "standard_specs.txt" ]; then
            echo ""
            echo "📋 Standard specs file contents:"
            cat standard_specs.txt
            echo ""
            
            # Source the file to verify variables
            source standard_specs.txt
            echo "✅ Verified: WIDTH=$WIDTH, HEIGHT=$HEIGHT"
            echo "✅ Verified: VIDEO_CODEC=$VIDEO_CODEC"
            echo "✅ Verified: AUDIO_SAMPLE_RATE=$AUDIO_SAMPLE_RATE"
            echo "✅ Verified: AUDIO_CHANNELS=$AUDIO_CHANNELS"
            echo "✅ Verified: AUDIO_CODEC=$AUDIO_CODEC"
          else
            echo "❌ Failed to generate standard specs!"
            exit 1
          fi

      - name: FORCE CONSISTENT ENCODING FOR ALL EPISODES (FIX CODEC PRIVATE DATA)
        timeout-minutes: 120
        env:
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
        run: |
          cd downloads
          
          # Get standards from the analyze step outputs
          TARGET_WIDTH="${{ steps.analyze.outputs.width }}"
          TARGET_HEIGHT="${{ steps.analyze.outputs.height }}"
          TARGET_VIDEO_CODEC="${{ steps.analyze.outputs.video_codec }}"
          TARGET_PIX_FMT="${{ steps.analyze.outputs.pix_fmt }}"
          TARGET_AUDIO_SAMPLE_RATE="${{ steps.analyze.outputs.audio_sample_rate }}"
          TARGET_AUDIO_CHANNELS="${{ steps.analyze.outputs.audio_channels }}"
          TARGET_AUDIO_CODEC="${{ steps.analyze.outputs.audio_codec }}"
          TARGET_RESOLUTION="${{ steps.analyze.outputs.resolution }}"
          
          echo "========================================="
          echo "🔧 FORCE CONSISTENT ENCODING FOR ALL EPISODES"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "🎯 Target Standard:"
          echo "   Resolution: ${TARGET_RESOLUTION}"
          echo "   Video: ${TARGET_WIDTH}x${TARGET_HEIGHT} ${TARGET_VIDEO_CODEC} ${TARGET_PIX_FMT}"
          echo "   Audio: ${TARGET_AUDIO_SAMPLE_RATE}Hz ${TARGET_AUDIO_CHANNELS}ch ${TARGET_AUDIO_CODEC}"
          echo "========================================="
          
          # Check if we have valid targets
          if [ "$TARGET_WIDTH" = "0" ] || [ "$TARGET_HEIGHT" = "0" ] || [ -z "$TARGET_WIDTH" ] || [ -z "$TARGET_HEIGHT" ]; then
            echo "❌ Invalid target standards detected!"
            echo "   Width: '$TARGET_WIDTH'"
            echo "   Height: '$TARGET_HEIGHT'"
            exit 1
          fi
          
          # Set defaults if needed
          [ "$TARGET_VIDEO_CODEC" = "unknown" ] || [ -z "$TARGET_VIDEO_CODEC" ] && TARGET_VIDEO_CODEC="libx264"
          [ "$TARGET_AUDIO_CODEC" = "unknown" ] || [ -z "$TARGET_AUDIO_CODEC" ] && TARGET_AUDIO_CODEC="aac"
          [ "$TARGET_AUDIO_SAMPLE_RATE" = "0" ] || [ -z "$TARGET_AUDIO_SAMPLE_RATE" ] && TARGET_AUDIO_SAMPLE_RATE="44100"
          [ "$TARGET_AUDIO_CHANNELS" = "0" ] || [ -z "$TARGET_AUDIO_CHANNELS" ] && TARGET_AUDIO_CHANNELS="2"
          [ "$TARGET_PIX_FMT" = "unknown" ] || [ -z "$TARGET_PIX_FMT" ] && TARGET_PIX_FMT="yuv420p"
          
          echo ""
          echo "📋 Final Encoding Parameters:"
          echo "   Video Codec: ${TARGET_VIDEO_CODEC}"
          echo "   Pixel Format: ${TARGET_PIX_FMT}"
          echo "   Audio Sample Rate: ${TARGET_AUDIO_SAMPLE_RATE}Hz"
          echo "   Audio Channels: ${TARGET_AUDIO_CHANNELS}ch"
          echo "   Audio Codec: ${TARGET_AUDIO_CODEC}"
          echo "   H.264 Profile: baseline"
          echo "   H.264 Level: 3.0"
          echo "   Keyframe Interval: 250 (GOP size)"
          echo "   Reference Frames: 3"
          echo "   B-frames: 0 (for compatibility)"
          echo "========================================="
          
          # Get list of all episodes sorted numerically
          EPISODE_FILES=()
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              EP_NUM=$(echo "$f" | grep -oE '[0-9]+' | head -1)
              if [ -n "$EP_NUM" ]; then
                EPISODE_FILES+=("$EP_NUM:$f")
              fi
            fi
          done
          
          IFS=$'\n' SORTED_EPISODES=($(sort -t: -k1 -n <<<"${EPISODE_FILES[*]}"))
          
          TOTAL=${#SORTED_EPISODES[@]}
          PROCESSED=0
          FAILED=""
          
          echo "📊 Found $TOTAL episodes to re-encode with consistent parameters"
          echo ""
          
          for entry in "${SORTED_EPISODES[@]}"; do
            f="${entry#*:}"
            EP_NUM="${entry%:*}"
            
            if [ ! -f "$f" ]; then continue; fi
            
            echo "📹 Episode $EP_NUM: Re-encoding with consistent parameters..."
            
            # Create temporary file
            TEMP_FILE="temp_${f}"
            rm -f "$TEMP_FILE" 2>/dev/null
            
            # FORCE CONSISTENT ENCODING PARAMETERS
            # This ensures ALL episodes have identical codec private data (SPS/PPS)
            ffmpeg -y -i "$f" \
              -vf "scale=${TARGET_WIDTH}:${TARGET_HEIGHT}:force_original_aspect_ratio=decrease,pad=${TARGET_WIDTH}:${TARGET_HEIGHT}:(ow-iw)/2:(oh-ih)/2:color=black,format=${TARGET_PIX_FMT}" \
              -c:v "${TARGET_VIDEO_CODEC}" \
              -preset veryfast \
              -crf 23 \
              -profile:v baseline \
              -level 3.0 \
              -x264-params "keyint=250:min-keyint=25:scenecut=40:ref=3:bframes=0" \
              -c:a "${TARGET_AUDIO_CODEC}" \
              -b:a 128k \
              -ar "${TARGET_AUDIO_SAMPLE_RATE}" \
              -ac "${TARGET_AUDIO_CHANNELS}" \
              -movflags +faststart \
              -map_metadata 0 \
              "$TEMP_FILE" 2>/dev/null
            
            if [ -f "$TEMP_FILE" ] && [ -s "$TEMP_FILE" ]; then
              # Verify the standardized file
              HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$TEMP_FILE" 2>/dev/null)
              HAS_AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$TEMP_FILE" 2>/dev/null)
              
              if [ "$HAS_VIDEO" = "video" ] && [ "$HAS_AUDIO" = "audio" ]; then
                NEW_W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$TEMP_FILE" 2>/dev/null || echo "0")
                NEW_H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$TEMP_FILE" 2>/dev/null || echo "0")
                echo "   ✅ Re-encoded: ${NEW_W}x${NEW_H}"
                mv "$TEMP_FILE" "$f"
                PROCESSED=$((PROCESSED + 1))
              else
                echo "   ❌ Re-encoded file missing video or audio!"
                rm -f "$TEMP_FILE" 2>/dev/null
                FAILED="$FAILED $f"
              fi
            else
              echo "   ❌ Re-encoding failed!"
              rm -f "$TEMP_FILE" 2>/dev/null
              FAILED="$FAILED $f"
            fi
            
            echo ""
          done
          
          echo "========================================="
          echo "📊 RE-ENCODING SUMMARY"
          echo "========================================="
          echo "📺 Series: $SERIES_TITLE"
          echo "📊 Total Episodes: $TOTAL"
          echo "✅ Re-encoded: $PROCESSED"
          
          if [ -n "$FAILED" ]; then
            echo "❌ Failed episodes: $FAILED"
            exit 1
          fi
          
          echo "✅ All episodes re-encoded with consistent parameters!"
          echo "========================================="
          
          # FINAL VERIFICATION - Check codec private data consistency
          echo ""
          echo "🔍 VERIFYING CONSISTENT CODEC PARAMETERS..."
          
          # Get codec private data from first file as reference
          REF_FILE=$(ls -1 EP*.mp4 | sort -V | head -1)
          REF_EXTRADATA=$(ffprobe -v error -select_streams v:0 -show_entries stream=extradata -of default=noprint_wrappers=1:nokey=1 "$REF_FILE" 2>/dev/null | head -c 100)
          REF_SAMPLE=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$REF_FILE" 2>/dev/null)
          
          echo "Reference: $REF_FILE"
          echo "Reference extradata (first 100 chars): $REF_EXTRADATA"
          echo "Reference sample rate: $REF_SAMPLE"
          echo ""
          
          ALL_MATCH=true
          for f in $(ls -1 EP*.mp4 | sort -V); do
            if [ "$f" = "$REF_FILE" ]; then continue; fi
            
            EXTRADATA=$(ffprobe -v error -select_streams v:0 -show_entries stream=extradata -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null | head -c 100)
            SAMPLE=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null)
            
            if [ "$EXTRADATA" != "$REF_EXTRADATA" ]; then
              echo "❌ $f: Codec private data MISMATCH!"
              ALL_MATCH=false
            elif [ "$SAMPLE" != "$REF_SAMPLE" ]; then
              echo "❌ $f: Sample rate MISMATCH!"
              ALL_MATCH=false
            else
              echo "✅ $f: Codec data matches reference"
            fi
          done
          
          if [ "$ALL_MATCH" = false ]; then
            echo ""
            echo "❌ NOT ALL EPISODES HAVE IDENTICAL CODEC PARAMETERS!"
            exit 1
          fi
          
          echo ""
          echo "✅ ALL EPISODES HAVE IDENTICAL CODEC PARAMETERS!"
          echo "   mkvmerge will be able to append them successfully."
          echo "========================================="

      - name: Merge Episodes with mkvmerge (Primary)
        id: merge_mkvmerge
        timeout-minutes: 120
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔗 MERGING EPISODES WITH MKVMERGE"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          # Sort episodes numerically
          EPISODE_FILES=()
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              EP_NUM=$(echo "$f" | grep -oE '[0-9]+' | head -1)
              if [ -n "$EP_NUM" ]; then
                EPISODE_FILES+=("$EP_NUM:$f")
              fi
            fi
          done
          
          IFS=$'\n' SORTED_EPISODES=($(sort -t: -k1 -n <<<"${EPISODE_FILES[*]}"))
          
          SORTED_FILES=()
          for entry in "${SORTED_EPISODES[@]}"; do
            filename="${entry#*:}"
            SORTED_FILES+=("$filename")
          done
          
          EP_COUNT=${#SORTED_FILES[@]}
          
          echo "📊 Found $EP_COUNT episodes to merge"
          echo "📋 First 3: ${SORTED_FILES[0]}, ${SORTED_FILES[1]}, ${SORTED_FILES[2]}"
          echo "📋 Last 3: ${SORTED_FILES[$((EP_COUNT-3))]}, ${SORTED_FILES[$((EP_COUNT-2))]}, ${SORTED_FILES[$((EP_COUNT-1))]}"
          
          OUTPUT_FILE="${{ steps.fname.outputs.output_filename }}"
          
          if [ "$EP_COUNT" -eq 0 ]; then
            echo "❌ No episodes to merge!"
            exit 1
          fi
          
          if [ "$EP_COUNT" -eq 1 ]; then
            echo "📦 Only 1 episode - copying to output"
            cp "${SORTED_FILES[0]}" "$OUTPUT_FILE"
            echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "merge_method=mkvmerge_single" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📊 MERGING: Using mkvmerge with default append mapping..."
          echo "🔄 Running mkvmerge with + appending (auto-mapping)..."
          
          # Build the command with files separated by +
          MKVMERGE_CMD="mkvmerge -o temp_merged.mkv --title \"$TITLE\" \"${SORTED_FILES[0]}\""
          
          for ((i=1; i<${#SORTED_FILES[@]}; i++)); do
            MKVMERGE_CMD="$MKVMERGE_CMD + \"${SORTED_FILES[$i]}\""
          done
          
          echo "Command: $MKVMERGE_CMD"
          echo ""
          
          # Execute WITHOUT explicit append-to options - let mkvmerge handle it
          eval "$MKVMERGE_CMD" 2>&1
          
          # Check if mkvmerge succeeded
          if [ -f "temp_merged.mkv" ] && [ -s "temp_merged.mkv" ]; then
            echo ""
            echo "✅ mkvmerge successful! Remuxing to MP4..."
            ffmpeg -y -i "temp_merged.mkv" \
              -c copy \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              "$OUTPUT_FILE" 2>/dev/null
            rm -f "temp_merged.mkv" 2>/dev/null
          fi
          
          if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
            HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUTPUT_FILE" 2>/dev/null)
            if [ "$HAS_VIDEO" = "video" ]; then
              echo ""
              echo "✅ mkvmerge merge successful!"
              echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
              echo "has_merged=true" >> $GITHUB_ENV
              echo "merge_success=true" >> $GITHUB_OUTPUT
              echo "merge_method=mkvmerge" >> $GITHUB_OUTPUT
              
              FINAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
              echo "⏱️  Duration: ${FINAL_DURATION%.*} seconds"
              ls -lh "$OUTPUT_FILE"
              
              # Generate thumbnails
              echo "🖼️ Generating thumbnails..."
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
                -q:v 2 "thumb.jpg" 2>/dev/null
              
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
                -q:v 2 "square_thumb.jpg" 2>/dev/null
              
              exit 0
            fi
          fi
          
          # If mkvmerge failed, try with explicit mapping but using the correct syntax
          echo ""
          echo "⚠️ mkvmerge with auto-mapping failed. Trying with explicit track mapping..."
          
          MKVMERGE_CMD2="mkvmerge -o temp_merged2.mkv --title \"$TITLE\" \"${SORTED_FILES[0]}\""
          
          # Add all files with + for appending
          for ((i=1; i<${#SORTED_FILES[@]}; i++)); do
            MKVMERGE_CMD2="$MKVMERGE_CMD2 + \"${SORTED_FILES[$i]}\""
          done
          
          # Build append-to options for all files after the first
          APPEND_OPTS=""
          for ((i=1; i<${#SORTED_FILES[@]}; i++)); do
            APPEND_OPTS="$APPEND_OPTS --append-to $i:0:$((i-1)):0"
            APPEND_OPTS="$APPEND_OPTS --append-to $i:1:$((i-1)):1"
          done
          
          echo "Command: $MKVMERGE_CMD2 $APPEND_OPTS"
          echo ""
          
          eval "$MKVMERGE_CMD2 $APPEND_OPTS" 2>&1
          
          if [ -f "temp_merged2.mkv" ] && [ -s "temp_merged2.mkv" ]; then
            echo ""
            echo "✅ mkvmerge with explicit mapping successful! Remuxing to MP4..."
            ffmpeg -y -i "temp_merged2.mkv" \
              -c copy \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              "$OUTPUT_FILE" 2>/dev/null
            rm -f "temp_merged2.mkv" 2>/dev/null
          fi
          
          if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
            HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUTPUT_FILE" 2>/dev/null)
            if [ "$HAS_VIDEO" = "video" ]; then
              echo ""
              echo "✅ mkvmerge merge successful with explicit mapping!"
              echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
              echo "has_merged=true" >> $GITHUB_ENV
              echo "merge_success=true" >> $GITHUB_OUTPUT
              echo "merge_method=mkvmerge_explicit" >> $GITHUB_OUTPUT
              
              FINAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
              echo "⏱️  Duration: ${FINAL_DURATION%.*} seconds"
              ls -lh "$OUTPUT_FILE"
              
              # Generate thumbnails
              echo "🖼️ Generating thumbnails..."
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
                -q:v 2 "thumb.jpg" 2>/dev/null
              
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
                -q:v 2 "square_thumb.jpg" 2>/dev/null
              
              exit 0
            fi
          fi
          
          echo ""
          echo "❌ mkvmerge merge failed!"
          echo "merge_success=false" >> $GITHUB_OUTPUT
          exit 1

      - name: Merge Episodes with FFmpeg Concat (Fallback)
        if: steps.merge_mkvmerge.outputs.merge_success == 'false'
        id: merge_ffmpeg
        timeout-minutes: 120
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          echo "========================================="
          echo "🔗 MERGING EPISODES WITH FFMPEG (FALLBACK)"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "========================================="
          
          # Sort episodes numerically
          EPISODE_FILES=()
          for f in EP*.mp4; do
            if [ -f "$f" ]; then
              EP_NUM=$(echo "$f" | grep -oE '[0-9]+' | head -1)
              if [ -n "$EP_NUM" ]; then
                EPISODE_FILES+=("$EP_NUM:$f")
              fi
            fi
          done
          
          IFS=$'\n' SORTED_EPISODES=($(sort -t: -k1 -n <<<"${EPISODE_FILES[*]}"))
          
          SORTED_FILES=()
          for entry in "${SORTED_EPISODES[@]}"; do
            filename="${entry#*:}"
            SORTED_FILES+=("$filename")
          done
          
          EP_COUNT=${#SORTED_FILES[@]}
          
          echo "📊 Found $EP_COUNT episodes to merge"
          
          OUTPUT_FILE="${{ steps.fname.outputs.output_filename }}"
          
          if [ "$EP_COUNT" -eq 0 ]; then
            echo "❌ No episodes to merge!"
            exit 1
          fi
          
          if [ "$EP_COUNT" -eq 1 ]; then
            echo "📦 Only 1 episode - copying to output"
            cp "${SORTED_FILES[0]}" "$OUTPUT_FILE"
            echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
            echo "has_merged=true" >> $GITHUB_ENV
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "merge_method=ffmpeg_single" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Create concat list
          CONCAT_FILE="concat_list.txt"
          > "$CONCAT_FILE"
          
          for f in "${SORTED_FILES[@]}"; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              echo "file '$f'" >> "$CONCAT_FILE"
              echo "✅ Added: $f"
            else
              echo "⚠️ Skipping invalid file: $f"
            fi
          done
          
          echo ""
          echo "📊 Attempting FFmpeg concat with stream copy (fast)..."
          
          # First attempt: stream copy (fastest)
          ffmpeg -f concat -safe 0 -i "$CONCAT_FILE" \
            -c copy \
            -movflags +faststart \
            -metadata title="$TITLE" \
            -metadata series="$SERIES_TITLE" \
            -metadata label="$LABEL" \
            -metadata year="$(date +%Y)" \
            -metadata date="$(date +%Y-%m-%d)" \
            "$OUTPUT_FILE" 2>/dev/null
          
          # Check if stream copy succeeded
          if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
            HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUTPUT_FILE" 2>/dev/null)
            if [ "$HAS_VIDEO" = "video" ]; then
              echo "✅ FFmpeg merge successful with stream copy!"
              echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
              echo "has_merged=true" >> $GITHUB_ENV
              echo "merge_success=true" >> $GITHUB_OUTPUT
              echo "merge_method=ffmpeg_streamcopy" >> $GITHUB_OUTPUT
              
              FINAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
              echo "⏱️  Duration: ${FINAL_DURATION%.*} seconds"
              ls -lh "$OUTPUT_FILE"
              
              # Generate thumbnails
              echo "🖼️ Generating thumbnails..."
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
                -q:v 2 "thumb.jpg" 2>/dev/null
              
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
                -q:v 2 "square_thumb.jpg" 2>/dev/null
              
              rm -f "$CONCAT_FILE" 2>/dev/null
              exit 0
            fi
          fi
          
          echo "⚠️ Stream copy failed, trying re-encode concat..."
          
          # Second attempt: re-encode (slower but more reliable)
          ffmpeg -f concat -safe 0 -i "$CONCAT_FILE" \
            -c:v libx264 -preset veryfast -crf 23 \
            -profile:v baseline -level 3.0 \
            -c:a aac -b:a 128k -ar 44100 \
            -movflags +faststart \
            -metadata title="$TITLE" \
            -metadata series="$SERIES_TITLE" \
            -metadata label="$LABEL" \
            -metadata year="$(date +%Y)" \
            -metadata date="$(date +%Y-%m-%d)" \
            "$OUTPUT_FILE" 2>/dev/null
          
          rm -f "$CONCAT_FILE" 2>/dev/null
          
          if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
            HAS_VIDEO=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUTPUT_FILE" 2>/dev/null)
            if [ "$HAS_VIDEO" = "video" ]; then
              echo "✅ FFmpeg merge successful with re-encode!"
              echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
              echo "has_merged=true" >> $GITHUB_ENV
              echo "merge_success=true" >> $GITHUB_OUTPUT
              echo "merge_method=ffmpeg_reencode" >> $GITHUB_OUTPUT
              
              FINAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
              echo "⏱️  Duration: ${FINAL_DURATION%.*} seconds"
              ls -lh "$OUTPUT_FILE"
              
              # Generate thumbnails
              echo "🖼️ Generating thumbnails..."
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
                -q:v 2 "thumb.jpg" 2>/dev/null
              
              ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
                -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
                -q:v 2 "square_thumb.jpg" 2>/dev/null
              
              exit 0
            fi
          fi
          
          echo "❌ FFmpeg merge failed!"
          exit 1

      - name: Verify Merged File
        if: steps.merge_mkvmerge.outputs.merge_success == 'true' || steps.merge_ffmpeg.outputs.merge_success == 'true'
        id: verify
        timeout-minutes: 120
        env:
          TITLE: ${{ steps.fname.outputs.formatted_title }}
          SERIES_TITLE: ${{ steps.fname.outputs.series_title }}
          LABEL: ${{ steps.fname.outputs.clean_label }}
        run: |
          cd downloads
          
          OUTPUT_FILE="${{ steps.fname.outputs.output_filename }}"
          
          echo "========================================="
          echo "🔍 VERIFYING MERGED FILE"
          echo "========================================="
          echo "📺 Series: ${{ steps.fname.outputs.series_title }}"
          echo "📁 File: $OUTPUT_FILE"
          echo "========================================="
          
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "❌ $OUTPUT_FILE not found!"
            exit 1
          fi
          
          FILE_SIZE_BYTES=$(stat -c%s "$OUTPUT_FILE" 2>/dev/null || stat -f%z "$OUTPUT_FILE" 2>/dev/null || echo "0")
          FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))
          
          echo "📊 File size: ${FILE_SIZE_MB} MB"
          
          if [ $FILE_SIZE_MB -gt 1800 ]; then
            echo "⚠️ File exceeds 1.8GB (${FILE_SIZE_MB} MB)"
            echo "🔧 Compressing file with veryfast preset..."
            
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
            DURATION_INT=${DURATION%.*}
            
            if [ "$DURATION_INT" -gt 0 ]; then
              TARGET_SIZE_MB=1500
              TARGET_BITRATE=$((TARGET_SIZE_MB * 8 * 1024 / DURATION_INT))
              if [ $TARGET_BITRATE -lt 500 ]; then
                TARGET_BITRATE=500
              fi
              echo "📊 Target bitrate: ${TARGET_BITRATE}k"
            else
              TARGET_BITRATE=1500
            fi
            
            echo "🔧 Compressing with veryfast preset..."
            
            ffmpeg -y -i "$OUTPUT_FILE" \
              -c:v libx264 -preset veryfast -b:v ${TARGET_BITRATE}k -maxrate ${TARGET_BITRATE}k \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output_compressed.mp4" 2>/dev/null
            
            if [ -f "output_compressed.mp4" ] && [ -s "output_compressed.mp4" ]; then
              NEW_SIZE=$(stat -c%s "output_compressed.mp4" 2>/dev/null || stat -f%z "output_compressed.mp4" 2>/dev/null || echo "0")
              NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
              
              if [ $NEW_SIZE_MB -lt 1800 ]; then
                mv output_compressed.mp4 "$OUTPUT_FILE"
                echo "✅ File compressed! New size: ${NEW_SIZE_MB} MB"
                echo "compressed=true" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Compression didn't reduce enough (${NEW_SIZE_MB} MB), trying CRF..."
                
                ffmpeg -y -i "$OUTPUT_FILE" \
                  -c:v libx264 -preset veryfast -crf 28 \
                  -c:a aac -b:a 96k -ar 44100 \
                  -movflags +faststart \
                  -metadata title="$TITLE" \
                  -metadata series="$SERIES_TITLE" \
                  -metadata label="$LABEL" \
                  -metadata year="$(date +%Y)" \
                  -metadata date="$(date +%Y-%m-%d)" \
                  "output_compressed.mp4" 2>/dev/null
                
                if [ -f "output_compressed.mp4" ] && [ -s "output_compressed.mp4" ]; then
                  NEW_SIZE=$(stat -c%s "output_compressed.mp4" 2>/dev/null || stat -f%z "output_compressed.mp4" 2>/dev/null || echo "0")
                  NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
                  
                  if [ $NEW_SIZE_MB -lt 1800 ]; then
                    mv output_compressed.mp4 "$OUTPUT_FILE"
                    echo "✅ File compressed! New size: ${NEW_SIZE_MB} MB"
                    echo "compressed=true" >> $GITHUB_OUTPUT
                  else
                    echo "❌ Compression failed to reduce file size"
                    rm -f output_compressed.mp4
                    echo "compressed=false" >> $GITHUB_OUTPUT
                  fi
                fi
              fi
            else
              echo "❌ Compression failed"
              echo "compressed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ File size is under 1.8GB, no compression needed"
            echo "compressed=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
            echo "🖼️ Regenerating thumbnails..."
            ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
              -q:v 2 "thumb.jpg" 2>/dev/null
            
            ffmpeg -i "$OUTPUT_FILE" -ss 00:00:01 -vframes 1 \
              -vf "crop=min(iw\,ih):min(iw\,ih),scale=512:512:flags=lanczos" \
              -q:v 2 "square_thumb.jpg" 2>/dev/null
          fi
          
          echo "🔧 Fixing duration metadata..."
          ffmpeg -i "$OUTPUT_FILE" -c copy -map_metadata 0 -movflags +faststart output_fixed.mp4 2>/dev/null
          
          if [ -f "output_fixed.mp4" ] && [ -s "output_fixed.mp4" ]; then
            mv output_fixed.mp4 "$OUTPUT_FILE"
            echo "✅ Duration metadata fixed"
          fi
          
          if mediainfo "$OUTPUT_FILE" > /dev/null 2>&1; then
            echo "✅ MediaInfo can read the file"
            echo ""
            mediainfo "$OUTPUT_FILE"
            echo ""
            
            DURATION=$(mediainfo --Inform="General;%Duration/String3%" "$OUTPUT_FILE" 2>/dev/null)
            FINAL_SIZE=$(stat -c%s "$OUTPUT_FILE" 2>/dev/null || stat -f%z "$OUTPUT_FILE" 2>/dev/null || echo "0")
            FINAL_SIZE_MB=$((FINAL_SIZE / 1024 / 1024))
            
            echo "📝 Duration: $DURATION"
            echo "💾 Final size: ${FINAL_SIZE_MB} MB"
            echo "✅ File is valid"
            echo "verify_success=true" >> $GITHUB_OUTPUT
            echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
            
            if [ $FINAL_SIZE_MB -gt 2000 ]; then
              echo "❌ File exceeds 2GB (${FINAL_SIZE_MB} MB)"
              echo "   Telegram limit is 2GB!"
              exit 1
            else
              echo "✅ File size: ${FINAL_SIZE_MB} MB (under 2GB limit)"
            fi
          else
            echo "❌ MediaInfo cannot read the file!"
            echo "🔧 Attempting to repair..."
            
            ffmpeg -y -err_detect ignore_err -i "$OUTPUT_FILE" \
              -c:v libx264 -preset veryfast -crf 23 \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              -metadata title="$TITLE" \
              -metadata series="$SERIES_TITLE" \
              -metadata label="$LABEL" \
              -metadata year="$(date +%Y)" \
              -metadata date="$(date +%Y-%m-%d)" \
              "output_repaired.mp4" 2>/dev/null
            
            if [ -f "output_repaired.mp4" ]; then
              REPAIR_SIZE=$(stat -c%s "output_repaired.mp4" 2>/dev/null || echo "0")
              REPAIR_SIZE_MB=$((REPAIR_SIZE / 1024 / 1024))
              if [ "$REPAIR_SIZE" -gt 1000000 ] && [ $REPAIR_SIZE_MB -lt 2000 ]; then
                mv output_repaired.mp4 "$OUTPUT_FILE"
                echo "✅ File repaired!"
                echo "verify_success=true" >> $GITHUB_OUTPUT
                echo "merged_file_path=$(pwd)/$OUTPUT_FILE" >> $GITHUB_ENV
              else
                echo "❌ Repair failed or file still too large"
                rm -f output_repaired.mp4
                exit 1
              fi
            else
              echo "❌ Repair failed"
              exit 1
            fi
          fi

      - name: Start Merged Upload (Background with Fast Upload)
